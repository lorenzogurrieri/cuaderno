 formas en el espacio de trabajo."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Organización experimental de diferentes elementos visuales, en representaciones analógicas y/o digitales.", "i": ["Experimenta con diferentes ubicaciones de trazos, para generar formas simples dentro del espacio de trabajo.", "Distribuye, de manera libre y sin restricciones, las formas simples y/o las manchas de color en el espacio de trabajo, analógico y/o digital.", "Explora con formas y manchas, de distintos tamaños, en el espacio de trabajo."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Descubrimiento de algunos soportes (papel, cartón, tela, programas de dibujo y pintura sencillos), materiales (tradicionales, naturales, innovadores) y herramientas para el dibujo y la pintura (hisopos, palitos, pinceles, dactilopintura).", "i": ["Explora diferentes tipos de soportes (analógicos y/o digitales) y materiales, de manera espontánea y curiosa.", "Muestra curiosidad por descubrir las posibilidades motrices y expresivas, tanto de su propio cuerpo, como de los materiales usados.", "Experimenta con herramientas, de manera creativa, para producir trazos, formas, manchas de color, de acuerdo con su propia curiosidad."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Desarrollo de dibujos y pinturas, analógicas y/o digitales, empleando líneas como trazo/contorno y variedad de colores.", "i": ["Representa formas con líneas continuas y experimenta con trazos más sueltos.", "Mezcla colores para obtener nuevos tonos en sus producciones.", "Organiza líneas para delimitar figuras básicas y diferenciar figuras del fondo en sus dibujos.", "Distingue, al pintar, entre colores claros y oscuros."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Exploración de formas figurativas y no figurativas en sus producciones gráfico-pictóricas, analógicas o digitales.", "i": ["Manipula trazos, formas, recortes, imágenes y manchas en sus representaciones.", "Crea composiciones con color, texturas visuales y/o táctiles y formas, distinguiendo los colores, tanto en las figuras como en el fondo.", "Organiza intuitivamente el uso del color en sus composiciones, diferenciando tonalidades para crear contrastes o armonías en las figuras y los espacios vacíos.", "Disfruta de la exploración creativa y se muestra curiosa/o frente a los descubrimientos."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Identificación de características expresivas y de uso, de soportes de variadas dimensiones (grandes, medianos, pequeños), posiciones (apaisado, vertical), formatos (rectangulares, cuadrados, circulares), origen (analógicos, digitales), materiales (convencionales, naturales, reutilizados, recuperados) y herramientas, para la creación de dibujos, pinturas, collage y grabados.", "i": ["Genera producciones según las características del espacio de trabajo y sus necesidades expresivas.", "Experimenta con diferentes técnicas en una misma obra, utilizando las cualidades de cada técnica para enriquecer su producción.", "Demuestra control inicial y flexibilidad, al adaptar las diferentes posiciones y orientaciones del trabajo de acuerdo con el formato elegido.", "Integra al menos dos técnicas diferentes en un solo trabajo y combina los materiales de forma creativa, para lograr una obra que refleje esta mezcla de procedimientos."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Descubrimiento de las impresiones a partir del uso de diferentes matrices (incisiones en placas de telgopor, sellos con cartones, frutas y/o verduras, monocopias) y reconocimiento de la posibilidad de reproducir imágenes múltiples, con materiales de uso cotidiano y/o reutilizados/recuperados.", "i": ["Experimenta con diversas matrices, formas y texturas.", "Crea, de forma lúdica y por repetición, representaciones gráficas con imágenes similares pero no idénticas.", "Reproduce imágenes de forma repetitiva, observando las variaciones entre cada impresión."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Creación de dibujos y pinturas, analógicas y/o digitales, que incluyan figuras y fondos, texturas visuales/ táctiles y mezclas de colores, para complejizar las representaciones a través de la inclusión de detalles.", "i": ["Representa figuras y fondos con mayor precisión, utilizando intencionalmente líneas como contornos y colores diferentes para figuras y fondos.", "Utiliza el color en sus producciones, para diferenciar sensaciones o atmósferas.", "Manipula, de forma intencionada, en sus producciones, los colores y las texturas para la representación de distintos elementos cotidianos o imaginarios.", "Experimenta con mezclas de colores convencionales y alternativos (generados a partir de pigmentos naturales de flores, hojas, frutas, entre otros), y con yuxtaposiciones de colores, para crear otros nuevos (más claros, más oscuros) con contrastes y matices expresivos."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Desarrollo intencionado de representaciones de formas figurativas y no figurativas, distinguiendo sus diferencias y usos expresivos, en soportes analógicos y/o digitales.", "i": ["Selecciona y organiza, intuitivamente, elementos visuales, experimentando con nociones de equilibrio y, de acuerdo con su intención expresivo-comunicativa, diferenciando figuras y fondos.", "Integra manchas de color, con texturas y formas, en el espacio de la representación, relacionando su uso en composiciones que articulan figuras y fondos más complejos.", "Manipula y distribuye trazos, formas, recortes, imágenes y manchas, para representar, de acuerdo con su propio imaginario, escenas cotidianas o fantásticas.", "Combina, intencionadamente, técnicas mixtas, en producciones que incluyen dibujo, pintura, collage y grabado."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Experimentación, con soportes convencionales y no convencionales (analógicos, digitales) de variadas dimensiones (grandes, medianos, pequeños), posiciones (apaisado, vertical) y formatos (rectangulares, cuadrados, circulares, entre otros), y con materiales, técnicas y herramientas, para las representaciones bidimensionales analógicas y/o digitales.", "i": ["Experimenta con variedad de materiales y herramientas, seleccionando aquellos que mejor se adaptan a la expresión de sus ideas.", "Organiza su espacio de trabajo y adapta el uso de los soportes (analógicos y/o digitales) en función de las características de la producción, con mayor control y planificación en la disposición.", "Elige, intencionadamente, materiales y técnicas para producir efectos visuales o expresivos particulares, reconociendo cómo cada herramienta aporta un resultado específico en la producción.", "Identifica las características de cada técnica y elige dos o más para producir trabajos que combinen lo analógico con lo digital.", "Emplea técnicas mixtas de manera creativa, para potenciar su mensaje o expresión en las representaciones."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Diseño y uso de matrices más elaboradas para la estampación, explorando patrones y composiciones repetitivas.", "i": ["Crea matrices para generar impresiones múltiples, observando y comparando las variaciones y patrones que se generan en cada repetición.", "Demuestra creatividad al modificar o combinar matrices, para producir impresiones más complejas o con efectos visuales distintos.", "Emplea más de un color para sus impresiones, en diversos soportes, con y sin intervenciones."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Desarrollo de composiciones grupales a partir de matrices creadas individualmente, y de otras técnicas mixtas gráfico-pictóricas que utilizan materiales recuperados y/o reutilizados.", "i": ["Trabaja en colaboración, desarrollando composiciones colectivas.", "Explora diferentes roles y posibilidades de creación colaborativa.", "Expresa su opinión y respeta la de sus pares en las composiciones colaborativas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Aproximación a la representación escultórica a través de la manipulación intuitiva de diferentes materiales (convencionales, reutilizados, recuperados, entre otros).", "i": ["Usa, intuitivamente, a través del juego creativo, diferentes materiales y herramientas para sus representaciones tridimensionales.", "Demuestra curiosidad y una actitud de participación activa en el descubrimiento y manipulación de nuevos materiales.", "Explora libremente los materiales (plastilina, arcilla, papel, cartón) con el cuerpo y las manos, realizando formas y figuras simples."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Exploración, a través del juego, de acciones constructivas para realizar volúmenes.", "i": ["Experimenta, intuitivamente, distintas acciones constructivas para crear formas tridimensionales (abollar, apilar, unir, pegar, torcer, entre otras).", "Demuestra curiosidad en la exploración de su propio cuerpo, como herramienta para el desarrollo de diferentes acciones constructivas.", "Reconoce las acciones que realiza al enfrentar desafíos, por ejemplo, cambiar de herramienta o de material cuando algo no funciona."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Descubrimiento guiado de la manipulación y las combinaciones de algunos materiales (convencionales, reutilizados, recuperados), herramientas relacionadas con el modelado (masas, arcilla) y construcciones (cajas, tubos de cartón).", "i": ["Muestra curiosidad al intentar nuevas formas de manipular los materiales, como mezclar técnicas o herramientas.", "Desarrolla experimentaciones que evidencian su inventiva e imaginación en el proceso de descubrimiento creativo.", "Construye formas tridimensionales básicas (torres, bolas, cilindros, entre otras) mediante la combinación de materiales y el uso de herramientas básicas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Exploración del modelado y las construcciones mediante el contacto directo con diferentes materialidades (convencionales, reutilizadas, recuperadas, entre otros).", "i": ["Juega con diferentes materiales y herramientas para explorar sus posibilidades técnico-estéticas.", "Experimenta construcciones en el espacio con diversidad de materiales (cartones, telgopor, palitos, entre otros), descubriendo soluciones iniciales a cuestiones técnico-constructivas y de emplazamiento.", "Crea formas y volúmenes con materiales blandos o moldeables, que pueden ser tocados y observados desde diferentes puntos de vista."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Experimentación de acciones constructivas a través de la combinación de juegos para realizar volúmenes, relacionando operaciones con resultados.", "i": ["Resuelve desafíos creativos al experimentar con diversas acciones (abollar, apilar, unir, pegar, torcer, encastrar, entre otras) para construir volúmenes, ajustando sus decisiones a partir de los resultados que observa.", "Elige los materiales y reconoce la acción a realizar en sus producciones volumétricas.", "Expresa preferencias y motivaciones en la elección de materiales y herramientas de trabajo."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Exploración y combinación de materiales (convencionales, reutilizados, recuperados, entre otros) y herramientas, e identificación de sus características expresivas y de uso (blando/duro, flexible/rígido, fino/grueso, entre otros), en el modelado y las construcciones.", "i": ["Experimenta con materiales y observa cómo sus características y/o propiedades influyen en la manipulación y el resultado final.", "Identifica las herramientas o acciones a desarrollar, según la materialidad con la que trabaja.", "Combina distintos materiales y reconoce las características básicas de cada uno (por ejemplo, que la plastilina es blanda y flexible, que el cartón es más rígido) para lograr construcciones más complejas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Experimentaciones tridimensionales por medio de los volúmenes, el color y las texturas.", "i": ["Explora la tridimensionalidad en sus construcciones, integrando detalles más elaborados.", "Crea entornos tridimensionales para contar historias o representar escenarios conocidos, de acuerdo con sus intereses.", "Juega con las texturas táctiles y visuales para enriquecer las producciones espaciales."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Desarrollo y combinación de acciones constructivas, en función de las características del material así como de la intención de la representación, y establecimiento de relaciones entre acciones y resultados.", "i": ["Explora operaciones más complejas en la creación de volúmenes (como apilar, torcer, plegar, encastrar, entre otras) estableciendo relaciones entre acciones y resultados.", "Identifica materiales que pueden ser trabajados a partir de técnicas similares.", "Expresa oralmente las soluciones encontradas, para resolver cuestiones técnicas de construcción y de emplazamiento.", "Organiza la secuencia de acciones a desarrollar, según el material de trabajo y sus posibilidades expresivas y formales."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Manipulación de materiales (convencionales, reutilizables, recuperados, entre otros) y herramientas, e identificación de características expresivas y de uso (blando/duro, flexible/rígido, fino/grueso, entre otros) en el modelado y las construcciones.", "i": ["Selecciona materiales y herramientas con mayor criterio, combinándolas según sus características y particularidades, de acuerdo con los resultados deseados en sus construcciones.", "Produce diferentes tipos de esculturas (de bulto completo, bajorrelieves, móviles, entre otras).", "Reconoce algunas propiedades de los materiales usados (blando, rígido, maleable, elástico, entre otras) y establece las primeras relaciones con las técnicas a emplear y las herramientas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Jugar con materiales para el descubrimiento y la construcción de formas tridimensionales, a través de la exploración sensorial de los volúmenes, en diferentes espacios.", "a": "Identificación inicial de las características de la representación tridimensional, como volúmenes, espacio, formas huecas y sólidas, entre otras.", "i": ["Interviene lúdicamente el espacio tridimensional, a través de la utilización de diferentes formas volumétricas.", "Asocia las construcciones desarrolladas con objetos cotidianos de su entorno, como puentes, estatuas en plazas, monumentos, entre otros.", "Nombra elementos tridimensionales y explora su forma, desde diferentes perspectivas o puntos de vista.", "Al finalizar la sala de 5 años, se espera que las/os estudiantes puedan:"]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Descubrimiento del mundo sonoro a partir de la exploración de sonidos de su entorno cotidiano.", "i": ["Se expresa a través de la palabra y/o gestos cuando descubre un nuevo sonido (sonidos que la/o rodean, de la naturaleza, de la calle, de su casa, de la escuela).", "Recrea diferentes sonidos con la voz, el cuerpo y con objetos sonoros.", "Incorpora, en su juego, los sonidos nuevos que descubre en su entorno próximo.", "Descubre y reconoce sonidos en paseos exploratorios por el entorno próximo (escuela, hogar, comunidad)."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Participación en experiencias de producción y percepción sonora, que involucren la ausencia y presencia del sonido.", "i": ["Interviene en juegos colectivos y reconoce, con gestos o movimientos expresivos, la alternancia entre la presencia y ausencia de sonidos. Manifiesta curiosidad ante la aparición o interrupción espontánea de sonidos en su entorno cotidiano.", "Explora, a través de diferentes materiales sonoros, en la interpretación colectiva de canciones o en juegos, el contraste entre el sonido y el silencio."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Exploración, mediante experiencias sensoriales y lúdicas, de sonidos que resulten agradables o molestos en su entorno.", "i": ["Expresa corporalmente las sensaciones que le producen diferentes sonidos.", "Juega explorando variaciones de intensidad en su propia voz y con objetos sonoros e identificando sensaciones de comodidad e incomodidad, en relación con lo que escucha."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Identificación de sonidos del entorno cotidiano y de sus posibilidades expresivas.", "i": ["Expresa, a través de dibujos y/o palabras, los sonidos que escucha en los paseos.", "Incorpora diferentes sonidos, como un recurso expresivo en sus relatos y canciones (por ejemplo, a través del uso de onomatopeyas).", "Participa en juegos sonoros de imitación y creación de sonidos a través de la voz, el cuerpo y los objetos.", "Explora diferentes fuentes emisoras y sus características sonoras, a través de sonorizaciones grupales."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Exploración progresiva de las nociones de espacio y tiempo, en la producción y percepción de sonidos.", "i": ["Reconoce de dónde provienen los sonidos (de adelante, de atrás, de los laterales, de cerca/lejos) en juegos grupales.", "Experimenta con diferentes materiales sonoros, en secuencias en las que debe anticipar o esperar un sonido, siguiendo gestos o señales de la/del docente o de sus pares.", "Participa en experiencias sonoras y sensoriales, como juegos de ubicación auditiva y actividades que involucran otros sentidos."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Apropiación progresiva de prácticas sonoras que contribuyan al bienestar colectivo.", "i": ["Participa en la construcción de acuerdos sonoros grupales, como respetar turnos para hablar o regular el volumen de la voz y de los instrumentos.", "Reconoce sonidos que pueden resultar molestos para sí misma/o y/o para otras personas."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Asociación de los sonidos del entorno cotidiano con sus características y posibilidades expresivas, a partir de experiencias lúdicas y creativas.", "i": ["Compara los sonidos de su entorno cotidiano, a través de experimentos y juegos sonoros (“más largo que…”, “más fuerte que…”).", "Relaciona los sonidos con el momento y el lugar donde fueron escuchados.", "Vincula sonidos con situaciones de la vida cotidiana, evidenciando comprensión expresiva del entorno sonoro.", "Expresa corporalmente las características sonoras escuchadas.", "Explora diversas formas de registrar el sonido, por ejemplo, a través de dispositivos tecnológicos que le permiten volver a escuchar los sonidos de su entorno."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Organización de las nociones de espacio y tiempo en la producción y percepción de los sonidos.", "i": ["Recrea secuencias de sonidos, con diferentes materiales emisores, atendiendo al orden de aparición y el lugar de dónde provienen.", "Juega, junto a sus pares, a crear secuencias de sonidos, a partir de imágenes, relatos, cuentos, canciones, y explica cómo lo realizaron.", "Ordena secuencias sonoras e indica qué sonidos ocurrieron primero, luego y al final, en actividades de escucha contextualizadas (por ejemplo, en paisajes y relatos sonoros)."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar y transformar sonidos presentes en su entorno cotidiano a través de la escucha activa y de experiencias lúdicas vocales y corporales.", "a": "Reconocimiento de la diversidad de sonidos en su entorno, comprendiendo la importancia de mantener prácticas sonoras que contribuyan a la salud ambiental dentro del jardín.", "i": ["Propone, en colaboración con sus pares, acciones que contribuyen al cuidado del ambiente sonoro en la sala o en espacios compartidos del jardín.", "Identifica por qué es importante cuidar el entorno sonoro y el nivel de ruido, en diferentes situaciones escolares (por ejemplo, durante la lectura de un cuento, el momento del descanso o en momentos de escucha)."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Descubrimiento de diferentes posibilidades sonoras y expresivas de la voz.", "i": ["Se inicia en el canto colectivo, a través de un repertorio variado de canciones para las infancias.", "Explora diferentes sonidos que puede producir con su voz, como susurros, silbidos, zumbidos, entre otros.", "Improvisa cantos espontáneos.", "Juega a combinar sonidos vocales y movimientos corporales, durante juegos en ronda o canciones."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Exploración del cuerpo como fuente sonora, a partir de canciones y experiencias lúdicas.", "i": ["Experimenta mediante sonidos producidos con diferentes partes del cuerpo, a través de juegos y canciones (por ejemplo, en juegos corporales o juegos de manos).", "Descubre formas de producir sonidos con distintas partes del cuerpo y las comparte con otras/os.", "Produce sonidos corporales como palmas, pisadas, chasquidos o golpes suaves en juegos rítmicos."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Reconocimiento de las posibilidades sonoras y expresivas de su propia voz y la de las/os demás.", "i": ["Explora la voz cantada, individual y colectivamente, a través de un repertorio variado de canciones para las infancias.", "Recrea, con su voz, pequeñas frases melódicas, por medio de juegos de eco.", "Disfruta de cantar con otras/os.", "Explora la voz hablada y sus posibilidades expresivas, mediante juegos de sorteo, adivinanzas, jitanjáforas y trabalenguas."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Experimentación con sonidos corporales, a través de diferentes ritmos, variaciones de intensidad y combinaciones tímbricas.", "i": ["Explora las posibilidades sonoras y expresivas de su cuerpo, a través de juegos rítmicos y canciones.", "Vivencia, mediante la percusión corporal, el acompañamiento de canciones, músicas y juegos.", "Juega, explorando cambios de intensidad o variaciones tímbricas, con los sonidos que produce con su cuerpo."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Interpretación vocal de diferentes repertorios para las infancias, explorando el sentido de lo que se canta, individual y colectivamente.", "i": ["Juega con las posibilidades de su voz en resonancia con la de las/os demás, en contextos de canto colectivo.", "Explora distintas dinámicas vocales en la interpretación grupal de canciones.", "Canta e improvisa motivos melódicos sencillos y expresa ideas, sentidos y sentimientos.", "Vivencia el sentido del canto colectivo, a través de la interpretación de canciones patrias (“Saludo a la Bandera” e “Himno Nacional Argentino”)."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar las posibilidades sonoras de la voz y el cuerpo como instrumentos, a través del canto colectivo, integrando nociones de ritmo y coordinación grupal.", "a": "Exploración de secuencias rítmicas colectivas a través de la percusión corporal.", "i": ["Combina sonidos corporales (golpear las piernas, aplaudir, golpear el pecho), para acompañar canciones o relatos.", "Explora sus movimientos en vinculación con los de las demás personas, en secuencias rítmicas sencillas.", "Improvisa secuencias simples con percusión corporal, en juegos musicales y en rondas.", "Interpreta y recrea secuencias rítmicas con percusión corporal, para acompañar el canto grupal (en sucesión), corrigiendo errores espontáneamente."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Experimentación de las posibilidades sonoras de instrumentos de percusión y diferentes objetos sonoros.", "i": ["Explora diferentes modos de acción con instrumentos y objetos sonoros, como raspar, percutir, sacudir, entrechocar, frotar, soplar.", "Se expresa utilizando instrumentos y materiales sonoros, para sonorizar canciones o relatos.", "Recrea, en juegos de imitación, sonidos producidos por otras/os.", "Muestra interés por repetir sonidos que le resultan atractivos durante la exploración instrumental."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Exploración rítmica a través del uso de instrumentos de percusión y otras fuentes sonoras no convencionales.", "i": ["Participa en juegos de eco rítmico, utilizando diferentes instrumentos de percusión o cotidiáfonos.", "Juega con el ritmo de la música y explora acompañamientos instrumentales.", "Experimenta la alternancia de sonidos y pausas con instrumentos o cotidiáfonos, en canciones y juegos musicales."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Reconocimiento de las posibilidades sonoras de los instrumentos de percusión y objetos sonoros, en experiencias musicales grupales.", "i": ["Compara las características sonoras de instrumentos y otros objetos, a través de juegos de exploración grupales.", "Explora combinaciones de sonidos con instrumentos y objetos sonoros, para acompañar diferentes músicas.", "Reconoce modos de acción, en juegos de discriminación auditiva (títeres sonoros, bingos, entre otros).", "Muestra curiosidad por la sonoridad que producen los instrumentos y los objetos sonoros."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Participación en acompañamientos instrumentales, en propuestas orientadas a lo lúdico y a los repertorios para las infancias.", "i": ["Explora acompañamientos rítmicos guiados con instrumentos u otros objetos sonoros.", "Juega con ecos rítmicos e imita y crea secuencias rítmicas sencillas, utilizando instrumentos y otros objetos sonoros.", "Ejecuta instrumentos en partes específicas de una canción, siguiendo pautas rítmicas previamente establecidas (por ejemplo, suenan los toc-toc durante el estribillo).", "Vivencia, a través de la práctica instrumental, el acompañamiento de canciones, músicas y juegos."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Participación en prácticas instrumentales grupales, que incentiven la improvisación y la creación de arreglos musicales sencillos.", "i": ["Selecciona y combina diferentes sonoridades, con instrumentos y cotidiáfonos, para crear paisajes y/o relatos sonoros.", "Explora y propone combinaciones sonoras que generan un efecto expresivo determinado (por ejemplo, agitar muchas radiografías al mismo tiempo para recrear el sonido de una tormenta).", "Participa en arreglos instrumentales y manifiesta gustos personales por la ejecución de determinados instrumentos y fuentes sonoras no convencionales.", "Cuida y comparte los instrumentos o materiales con sus pares, en momentos de exploración instrumental."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Explorar las cualidades sonoras y las posibilidades expresivas de instrumentos de percusión y cotidiáfonos, para la interpretación colectiva de arreglos musicales sencillos.", "a": "Interpretación de acompañamientos rítmicos en juegos y repertorios para las infancias, atendiendo a la coordinación grupal.", "i": ["Interviene en ensambles instrumentales, interpretando secuencias rítmicas sencillas, para acompañar repertorios del cancionero infantil, popular y folklórico, reconociendo aquellos momentos en los que necesita ayuda o anticipando dificultades en la interpretación.", "Participa en intervenciones instrumentales, intentando mantener el ritmo colectivo (por ejemplo, empezar y terminar junto al grupo, hacer pausas al mismo tiempo que las/os demás).", "Experimenta la división de roles en las producciones musicales colectivas (por ejemplo, un grupo canta, mientras otro grupo ejecuta instrumentos, en partes sucesivas o simultáneas)."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Exploración de movimientos espontáneos al escuchar diferentes músicas, mediante juegos corporales y rondas infantiles.", "i": ["Se mueve libremente y asocia balanceos, aplausos y giros con la música que escucha.", "Vivencia el ritmo con su cuerpo, mientras escucha música o canta.", "Imita y recrea movimientos propuestos por la/el docente o surgidos de su propia iniciativa, en rondas y bailes."]}, {"c": "Educación Artística", "s": "Música", "sala": 3, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Descubrimiento de repertorios que circulan en el espacio escolar y comunitario.", "i": ["Explora, a través de la escucha activa, repertorios pensados especialmente para las infancias, descubriendo sonoridades, ritmos e historias con las que se identifica.", "Recuerda y evoca las canciones que circulan en su ámbito familiar o comunitario (por ejemplo, canciones de cuna o para dormir).", "Reconoce algunas canciones utilizadas en rutinas escolares (entrada, saludo, juegos) y anticipa sonidos o frases.", "Se involucra en momentos de escucha placentera de diferentes músicas."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Identificación de algunos rasgos característicos de los géneros musicales, a través de movimientos, rondas y juegos corporales.", "i": ["Asocia movimientos con algunos rasgos distintivos de diferentes géneros y estilos musicales (pasos suaves o balanceados con canciones de cuna o zapateos rítmicos con determinadas músicas folclóricas).", "Vivencia diferentes géneros musicales y sus características, a través de la danza y el movimiento.", "Juega con movimientos libres, para expresar sensaciones vinculadas con distintas músicas."]}, {"c": "Educación Artística", "s": "Música", "sala": 4, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Reconocimiento de los diversos repertorios del patrimonio cultural propio y de su localidad.", "i": ["Vivencia, en festividades y celebraciones, algunas músicas tradicionales, canciones y danzas pertenecientes a grupos culturales de la comunidad.", "Se involucra en momentos de escucha atenta, por períodos crecientes de tiempo, durante conciertos didácticos y espectáculos para las infancias (en vivo o en videos).", "Identifica, a través de la escucha activa, instrumentos típicos de determinadas formaciones musicales, pertenecientes al patrimonio cultural propio y de su localidad.", "Realiza comentarios espontáneos sobre los diferentes repertorios que escucha e interpreta."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Asociación de distintos géneros y estilos musicales, de diferentes épocas y lugares, con secuencias de movimientos corporales, individuales y grupales.", "i": ["Percibe diferencias rítmicas, cambios de velocidad o variaciones, en las diversas músicas que escucha y/o canta, y las expresa a través de sus movimientos o en juegos de ronda.", "Participa en danzas colectivas, danzas circulares y rondas tradicionales.", "Reconoce aspectos formales en diferentes repertorios, a partir de coreografías grupales."]}, {"c": "Educación Artística", "s": "Música", "sala": 5, "m": "Descubrir los diferentes géneros musicales desde la exploración de movimientos expresivos y el disfrute por la audición de diferentes repertorios.", "a": "Apropiación sensible de los repertorios de su comunidad y de otras regiones, en diversos momentos históricos.", "i": ["Participa en instancias musicales representativas para la comunidad (por ejemplo, festividades, peñas, conciertos infantiles, entre otras).", "Reconoce la diversidad de expresiones musicales del patrimonio cultural de su comunidad, de otras regiones y países.", "Identifica, a través de la escucha activa, algunos cambios y continuidades a lo largo del tiempo, en músicas de diferentes épocas.", "Expresa gustos y preferencias personales sobre los diferentes repertorios que escucha e interpreta.", "Al finalizar la sala de 5 años, se espera que las/os estudiantes puedan:"]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Descubrimiento, sensibilización y concientización del esquema corporal total.", "i": ["Explora el movimiento global del cuerpo.", "Participa en juegos que implican imitar animales o personajes, moviendo el cuerpo de manera expresiva.", "Identifica y señala algunas partes del cuerpo cuando se le pregunta (ojos, boca, manos, pies)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Descubrimiento y exploración global de las posibilidades de movimiento corporal.", "i": ["Experimenta con el peso de cada parte del cuerpo y de su totalidad. Explora las posibilidades de movimiento de flexión y extensión por segmentos (brazos, piernas, cabeza, torso).", "Imita movimientos sencillos de danza, como tocarse los pies, saltar o mover los brazos a partir del ritmo de la música."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Concientización de la respiración y su relación con la concentración y el registro sensitivo del propio cuerpo (propiocepción).", "i": ["Reconoce los diferentes momentos de la respiración, como inhalación y exhalación.", "Imita acciones simples que requieren coordinación entre respiración y movimiento (inhalar y levantar brazos, exhalar y bajarlos).", "Sopla con la boca o la nariz en el marco de propuestas lúdicas (hace burbujas, infla un globo imaginario, entre otras)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Percepción del esquema corporal total y por segmentos.", "i": ["Reconoce diferentes partes del cuerpo.", "Identifica y diferencia las partes del cuerpo mientras se mueve (cabeza, manos, pies, torso).", "Distingue entre el cuerpo global y sus partes."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Exploración de las posibilidades de movimiento del cuerpo (de forma global y segmentada), en relación con la diferencia entre quietud y movimiento y los cambios de dinámica (lento-rápido, fuerte-suave).", "i": ["Explora diferentes velocidades del movimiento (lento-rápido) en experiencias que involucran el cuerpo total o por segmentos.", "Indaga posibilidades de movimiento por segmento (flexión, extensión, rotación).", "Explora movimientos con diferentes dinámicas (fuerte-suave), regulando su energía."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Participación en prácticas somáticas y contemplativas (como yoga o meditación), orientadas al descubrimiento del propio cuerpo en sus dimensiones emocional, física y psíquica.", "i": ["Participa en actividades simples que involucran la respiración y que fomentan la calma, como imaginar que está oliendo una flor al inhalar y soplando una vela al exhalar.", "Reconoce, luego de una actividad corporal, cuándo su cuerpo está tenso o relajado.", "Realiza movimientos de estiramientos básicos y posturas simples de yoga."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Aprehensión del esquema corporal total y por segmentos.", "i": ["Reconoce y moviliza las diferentes partes del cuerpo.", "Reconoce las dimensiones de los segmentos corporales y sus articulaciones, en la formación global del cuerpo (dedos, manos, muñeca, brazo, entre otras posibilidades).", "Realiza movimientos coordinados con todo su cuerpo (brazos, piernas, cabeza, torso, manos)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Descubrimiento de las posibilidades de movimiento del cuerpo (total y por segmentos), con exploración del lenguaje gestual y postural.", "i": ["Indaga posibilidades de movimiento por segmentos (flexión, extensión, rotación).", "Reconoce y reproduce gestos cotidianos, como forma de comunicación no verbal.", "Utiliza gestos y movimientos corporales para comunicar deseos o estados de ánimo."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Descubrir el propio cuerpo, diferenciar sus partes y sus posibilidades de movimiento a partir de la propiocepción, la respiración y la danza total y por segmentos corporales.", "a": "Indagación de elementos de las prácticas somáticas (asanas, respiración, relajación) y la sensopercepción (táctil, auditiva, visual e interoceptiva), para favorecer un vínculo sensible y sensorial del cuerpo.", "i": ["Participa en prácticas corporales que requieren concentración y registro interno (yoga, juegos de equilibrio, ejercicios de pausa).", "Utiliza los sentidos para explorar y ajustar su respiración, en actividades que involucran su atención plena o la conciencia sensorial (como juegos de observación o de atención al sonido).", "Reconoce las diferentes texturas y superficies a través del tacto y las integra a sus movimientos (caminar descalzo, explorar materiales con las manos)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Indagación de la lateralidad en variaciones de movimientos.", "i": ["Explora movimientos básicos utilizando ambos lados del cuerpo.", "Ejecuta movimientos grandes o pequeños con el cuerpo, de acuerdo con las instrucciones de la/del docente.", "Mueve los brazos o las piernas de manera diferenciada, siguiendo instrucciones simples, como levantar la mano derecha o el pie izquierdo."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Vivencia del juego danzado como modo de exploración corporal, expresión rítmica y relación con otras/ os en el espacio.", "i": ["Explora su cuerpo a través de movimientos básicos, como saltar, girar, y trasladarse al ritmo de la música.", "Interactúa con otras/os niñas/os durante el juego danzado.", "Responde de manera espontánea a estímulos musicales."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Coordinación de movimientos en el espacio personal y el espacio total, atendiendo a la lateralidad.", "i": ["Participa en juegos de locomoción (caminar, saltar, correr) y usa de manera equitativa ambos lados del cuerpo.", "Reconoce las diferencias entre los movimientos que realiza en su espacio personal y los que realiza al interactuar con otras/os en un espacio más amplio.", "Muestra conciencia de los límites de su espacio personal, evitando chocar con objetos o personas cuando se mueve."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Participación en experiencias lúdicas de danza, que impliquen el reconocimiento de formas y relaciones espaciales (solos/as, con otros/as y con objetos).", "i": ["Se relaciona con otras/os niñas/os en el espacio, imitando o interactuando durante el juego danzado.", "Interacciona con objetos en el espacio durante la danza (cintas, pañuelos, pelotas), incorporándolos en su movimiento corporal.", "Explora diferentes formas en el espacio (círculos, cuadrados, líneas), al interactuar con objetos, estructuras, dibujos o gestos corporales."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Exploración de las posibilidades del movimiento, a través de relaciones espaciales (derecha-izquierda, delante-atrás, arriba-abajo, cerca-lejos), en vínculo con disfraces y objetos del entorno cotidiano, real o imaginario.", "i": ["Realiza movimientos que combinan ambos lados del cuerpo, alternando entre ellos (como saltar y girar).", "Reconoce y aplica direcciones espaciales simples en movimientos básicos (delante, atrás, derecha, izquierda).", "Explora acciones básicas que exigen coordinación y movimientos cruzados (mano derecha con pierna izquierda, por ejemplo).", "Utiliza objetos, reales o imaginarios, en exploraciones de movimiento."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Internalizar las nociones de lateralidad del propio cuerpo en relación al espacio, reconocer la diferencia entre espacio personal y espacio total, y distinguir las posibilidades de formas y formaciones en el juego danzado.", "a": "Participación en actividades expresivas, libres o guiadas, que permitan integrar la exploración del espacio y el vínculo corporal con otras/os.", "i": ["Colabora con otras/os niñas/os en la danza grupal, respetando el espacio común y el ritmo del grupo.", "Realiza movimientos expresivos que conectan el cuerpo con las emociones o con el contexto de la actividad (por ejemplo, expresar una sensación a través de su cuerpo).", "Utiliza el espacio de manera variada (subiendo, agachándose, girando, extendiéndose) y juega con los límites del espacio disponible."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Exploración de movimientos en ronda junto a sus pares.", "i": ["Indaga movimientos de contracción y expansión en ronda.", "Incorpora la ronda como ritual cotidiano de encuentro.", "Comparte movimientos espontáneamente con sus pares."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Acercamiento a las danzas folklóricas y populares de carácter colectivo, por ejemplo, carnavalito y huayno, a partir de formaciones en el espacio (ronda, caracol, hilera, puente).", "i": ["Participa con disfrute en rondas y desplazamientos colectivos sencillos, al ritmo del carnavalito y el huayno. Reproduce y explora algunos movimientos básicos constitutivos de estas danzas (giro con brazos abiertos, tomarse de la mano con otra/o, entre otros).", "Participa en danzas que implican diversas formaciones (de la hilera a la ronda, de la ronda al puente, entre otras)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 3, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Participación y disfrute de espectáculos vinculados con diversas expresiones que contengan el lenguaje de la danza.", "i": ["Asiste a actividades culturales relacionadas con la danza, como obras, espectáculos callejeros, proyecciones multimediales, entre otras. Manifiesta disfrute durante el espectáculo, a través de gestos, risas, aplausos o movimientos.", "Reconoce un elemento del espectáculo después de verlo (personaje, movimiento, sonido, color)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Vivencia y disfrute de movimientos con otras/os, que posibiliten el contacto corporal en ronda, desde la autoconfianza y el respeto.", "i": ["Participa en juegos de movimiento que implican contacto corporal con pares (tomarse de las manos, apoyarse, balancearse juntos). Muestra actitudes de cuidado y respeto en el contacto corporal durante la interacción con sus pares.", "Muestra entusiasmo y predisposición al participar en propuestas danzadas en ronda.", "Responde con alegría y espontaneidad a las consignas corporales que implican moverse con otros/as."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Exploración de movimientos y ritmos de origen afro, originarios y populares (cuarteto, murga, carnavalito).", "i": ["Participa de juegos danzados u otras propuestas lúdicas, con músicas de origen afro, originarias y populares (cuarteto, murga y carnavalito). Explora algunos movimientos básicos asociados con cada ritmo (saltos, balanceos, palmadas, pasos arrastrados, movimiento de cadera).", "Disfruta de moverse en grupo al compás de la música, expresando gestos propios."]}, {"c": "Educación Artística", "s": "Danza", "sala": 4, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Apreciación de la diversidad artística y cultural de la propia localidad, a partir de experiencias en espacios diversos (teatros, centros culturales o salas independientes).", "i": ["Participa, con interés, en experiencias artísticas, y asiste a funciones de danza en salas independientes o teatros de su localidad/cercanos.", "Comparte sus percepciones sobre lo vivido en la experiencia artística con el grupo, a través de palabras, gestos o dibujos."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Exploración de movimientos que posibiliten el contacto corporal en distintas formaciones espaciales con otras/os y fortalezcan la autoconfianza y el respeto, por el propio cuerpo y el de las/os demás.", "i": ["Participa y disfruta de movimientos que implican contacto corporal con pares. Muestra actitudes de cuidado y respeto en la interacción corporal con sus pares, atendiendo tanto a la comodidad propia como a la de los demás.", "Explora movimientos en distintas formaciones espaciales."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Exploración de movimientos, formas espaciales y ritmos de origen afro, originarios y populares, con incorporación de objetos significativos de las danzas y elementos de percusión.", "i": ["Indaga y copia patrones rítmicos básicos de danzas de origen afro, originarios y populares (cuarteto, murga y carnavalito). Integra movimientos característicos de diferentes ritmos populares, en experiencias de danza colectiva.", "Utiliza objetos culturales (pañuelos, sombreros, cintas, instrumentos de percusión) en la exploración del movimiento y el ritmo.", "Participa en diferentes formaciones espaciales propias de las danzas populares (caracol, ronda, puente)."]}, {"c": "Educación Artística", "s": "Danza", "sala": 5, "m": "Explorar la danza a través de formas y formaciones de movimiento colectivo, como la ronda, el caracol, la hilera o el puente, entre otras, desde una dimensión lúdica y de disfrute de las expresiones de la cultura popular.", "a": "Relaciona la experiencia de la danza en el ámbito escolar, con lo vivenciado en contextos sociales y culturales (peñas, festivales, centros culturales, eventos barriales).", "i": ["Reconoce que la danza puede encontrarse en distintos lugares fuera de la escuela (fiestas, actos, festivales, celebraciones familiares, entre otros). Comparte, verbal o corporalmente, recuerdos de experiencias con danzas vistas o vividas fuera de la escuela.", "Participa de propuestas que invitan a recrear o representar contextos sociales donde aparece la danza (peña, festival, escenario, entre otros).", "Al finalizar la sala de 5 años, se espera que las/os estudiantes puedan:"]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Transitar del juego dramático —espontáneo y libre— al juego teatral —intencionado y guiado— para desarrollar la exploración consciente de recursos expresivos y comunicativos.", "a": "Participación en el juego dramático a partir de la comprensión de consignas.", "i": ["Atiende a la consigna inicial y reconoce las orientaciones propuestas.", "Reconoce y respeta turnos en juegos dirigidos.", "Muestra disposición para incorporarse al juego grupal siguiendo una consigna.", "Reproduce gestos/ acciones / sonidos sugeridos por el docente o por una/un compañera/o."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Transitar del juego dramático —espontáneo y libre— al juego teatral —intencionado y guiado— para desarrollar la exploración consciente de recursos expresivos y comunicativos.", "a": "Exploración y representación de acciones de la vida cotidiana en contextos de juego dramático (caminar, dormir, comer entre otros).", "i": ["Identifica y nombra acciones de la vida cotidiana cuando se le proponen en el juego. Representa con gestos o movimientos simples acciones conocidas (caminar, dormir, comer, saludar, entre otros)", "Utiliza objetos cotidianos o imaginarios para reforzar la acción (por ejemplo, almohada, cuchara ,entre otros).", "Participa en representaciones colectivas imitando acciones propuestas por el docente o por compañeras/os."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Transitar del juego dramático —espontáneo y libre— al juego teatral —intencionado y guiado— para desarrollar la exploración consciente de recursos expresivos y comunicativos.", "a": "Participación en dinámicas grupales dirigidas con consignas simples, a partir del \"como si\" (por ejemplo, moverse como si fuera un animal, caminar como si fuera un astronauta, entre otros).", "i": ["Responde a consignas simples del “como si” con movimientos corporales ien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Reconocimiento y diferenciación de los roles de quien actúa y de quien observa en el juego teatral.", "i": ["Reconoce cuándo le toca actuar y cuándo debe mirar a sus compañeras/os.", "Se ubica en el espacio del público cuando no participa de la acción.", "Acepta alternar roles en juegos breves."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Diferenciar los roles de quien juega en la escena y de quien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Iniciación en la experiencia de “ser público”, observando y escuchando con atención breve.", "i": ["Observa las producciones teatrales de sus compañeras/os.", "Aplaude o reacciona espontáneamente al finalizar la acción observada.", "Escucha la consigna y observa lo que hacen sus compañeras/os.", "Comenta las producciones de sus compañeras/os."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Diferenciar los roles de quien juega en la escena y de quien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Diferenciación del tiempo y espacio lúdico.", "i": ["Reconoce el espacio destinado al juego teatral y se desplaza dentro de él.", "Diferencia momentos de juego de otros momentos de la rutina escolar.", "Reconoce el momento de inicio y final del juego."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Diferenciar los roles de quien juega en la escena y de quien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Reconocimiento y diferenciación de los momentos de juego de otros momentos de la rutina escolar.", "i": ["Reconoce cuándo está “jugando un personaje”.", "Entra y sale del juego teatral cuando se le indica o cuando finaliza.", "Identifica instancias lúdicas (como si) y las diferencia de acciones reales."]}, {"c": "Educación Artística",
