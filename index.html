ntas.", "Reconoce cambios en el patrón de una serie, luego de que se hubieren agregado o quitado una o dos formas geométricas."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de objetos sólidos de diferentes características (forma, color, textura, tamaño, olor, entre otros) y de las sensaciones que provoca jugar con ellos.", "i": ["Manipula objetos-juguetes (como telas, cajas, lanas, entre otros) y juguetes, con diferentes propósitos.", "Encuentra objetos con determinadas características en juegos propuestos por la/el docente.", "Realiza acciones relacionadas con diferentes movimientos de un objeto (lo hace rodar, sacude, golpea, aplasta, deja caer, entre otros) y busca otras/os con los que pueda replicar esas acciones.", "Distingue en el ambiente diversidad de objetos, incluyendo dispositivos computacionales.", "Agrupa objetos según las coincidencias en sus características.", "Identifica distintas características en los objetos (por ejemplo, colores, texturas, tamaños, pesos, olores, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de líquidos, a través de operaciones simples, como por ejemplo trasvasar, agitar, verter, entre otras.", "i": ["Observa y manipula líquidos con distintas características (viscosidad, adherencia), para realizar acciones (por ejemplo, hacer burbujas, pintar, pegar papeles, entre otras).", "Comenta acerca de algunas características de los líquidos (por ejemplo, color, aroma, sensación al tacto, entre otras).", "Trasvasa líquidos entre recipientes de diversas formas y tamaños."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Relato de observaciones directas o indirectas a partir de dibujos, ilustraciones o por medio de la exploración de textos informativos de ciencias, tecnología y/o ciudadanía.", "i": ["Reconoce imágenes, esquemas, ilustraciones de objetos cotidianos, en la exploración de materiales informativos de ciencias, tecnología y/o ciudadanía.", "Relaciona lo que escucha en lecturas de textos informativos en voz alta por parte de la/del docente, con lo que observa, directa o indirectamente.", "Interactúa con textos informativos (por ejemplo, libros, enciclopedias, revistas, folletos, entre otros), busca y señala dónde se encuentra la información sobre un tema."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Construcción con diferentes objetos, realizando acciones como apilar, encastrar, apoyar, entre otras, en instancias lúdicas y creativas.", "i": ["Manipula objetos de diferentes dimensiones, formas y pesos.", "Encastra objetos relacionando sus formas.", "Construye formas y estructuras apilando objetos diversos, de forma cada vez más compleja.", "Explora el apilamiento de objetos."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de objetos y espacios del pasado familiar, diferenciándolos de aquellos comunes o compartidos en la sala e incorporando el sentido de pertenencia.", "i": ["Observa objetos personales que pertenecieron a familiares cuando eran niñas/os (como juguetes, vestimenta, muebles, herramientas, entre otros).", "Distingue objetos y espacios propios y ajenos (por ejemplo, juguetes, casa) de aquellos que son de uso común y compartido (como los juguetes de la sala, los espacios de la escuela, entre otros).", "Participa en conversaciones sobre objetos del pasado familiar (como radios antiguas, cámaras de fotos, juguetes, entre otros), en relación con la pertenencia y los usos, entre otros aspectos, estableciendo diferencias con objetos actuales.", "Busca soluciones, con mediación de la/del docente, ante posibles conflictos en torno a la pertenencia de los objetos propios y comunes."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Desarrollo de la percepción espacial en el entorno físico-espacial de la sala y del patio, a través de juegos de desplazamiento y búsqueda de elementos naturales, objetos técnicos y culturales.", "i": ["Ubica objetos a partir del uso de nociones espaciales (arriba - abajo, adentro - afuera, encima de - debajo de, - al costado de, entre otros).", "Encuentra elementos naturales, objetos técnicos y culturales, a partir de consignas que incluyen nociones espaciales.", "Realiza desplazamientos por el lugar llevando objetos (o no) y utiliza consignas dadas (ir a un lado o a otro, subir o bajar, traer y llevar, levantar o apoyar, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Observación de objetos para el reconocimiento de sus características y de los diferentes materiales que los componen.", "i": ["Observa y clasifica diversidad de objetos, con formas y funciones distintas, mediante el juego.", "Identifica (descubre, señala, reúne) materiales con características similares (como brillo, temperatura, transparencia, fragilidad, flexibilidad, entre otros) que conforman los objetos.", "Observa y manipula objetos fabricados con distintos materiales (por ejemplo, maderas, semillas, lanas, plásticos, metales, entre otros), tanto artesanales como industriales.", "Representa diferentes objetos mediante dibujos, modelización con masa, apilamiento de otros objetos o uso de recortes de papel."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Formulación de anticipaciones y comprobación de interacciones entre objetos y su entorno.", "i": ["Identifica interacciones entre objetos y su entorno (por ejemplo, se hunde/flota, puedo ver a través de él/ no puedo ver/ veo borroso, es atraído por un imán/ no es atraído, absorbe un líquido/no absorbe, entre otras).", "Participa en conversaciones de comprobación o refutación de anticipaciones sobre interacciones entre objetos y su entorno.", "Participa en conversaciones para la formulación de anticipaciones acerca de qué sucederá en diferentes interacciones entre los objetos y su entorno."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de mezclas formadas por materiales en estado líquido y sólido.", "i": ["Identifica los materiales que conforman diferentes tipos de mezclas (mezclas sólido - sólido, líquido - líquido y sólido - líquido).", "Representa las diferentes mezclas, mediante dibujos, o escribe cómo están formadas, a través del dictado a la/ el docente.", "Propone la formación de distintas mezclas (mezclas sólido - sólido, líquido - líquido y sólido - líquido)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de acciones que generen cambios en los materiales.", "i": ["Observa los cambios (antes/después) que ocurren en los materiales al aplicarles alguna acción, como modelado, calor, inmersión, entre otras.", "Experimenta distintos procesos que generan cambios en los materiales, por ejemplo, teñir diferentes materiales, hornear masas, entre otros.", "Establece vínculos entre las acciones y los cambios que se producen en los materiales."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Participación en situaciones de registro de observaciones (a través del dictado a la/al docente, la realización de dibujos, y/o el uso de dispositivos que permitan elaborar fotografías, videos o registros sonoros), así como en la exploración de textos informativos de ciencias, tecnología y ciudadanía y la recuperación de la información.", "i": ["Observa recortes del entorno, en función de las indicaciones de la/el docente.", "Realiza preguntas a partir de lo que observa o reconoce en textos informativos de ciencias, tecnología y ciudadanía.", "Describe oralmente lo que observa, para que la/el docente lo registre en un texto breve.", "Selecciona, entre textos informativos (como enciclopedias, libros, noticias, revistas de divulgación) y con mediación docente, aquellos que la/lo ayudarán a “saber más sobre” lo que le interesa.", "Representa lo que observa en diferentes situaciones que le generan curiosidad.", "Toma fotografías de sus observaciones y compara sus descripciones con el registro fotográfico propio, el de sus pares y/o con textos informativos."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Construcción de estructuras con diversos objetos que permitan explorar diferentes situaciones de equilibrio, alturas y superficies, a partir de modelos o secuencias ordenadas de pasos.", "i": ["Diseña y arma espacios de juego con elementos de la sala.", "Arma nichos, nidos o escondites con elementos naturales, a partir de observaciones en su entorno.", "Crea diferentes estructuras que implican tener en cuenta el equilibrio, distintas alturas y diversas superficies.", "Resuelve desafíos de construcción, a través de una secuencia ordenada de pasos y seleccionando los objetos y/o materiales más apropiados.", "Anticipa qué le sucederá a las estructuras elaboradas ante diferentes acciones.", "Expresa qué acciones realizó para superar los desafíos propuestos."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Reconocimiento de algunas huellas materiales del pasado en el presente, a través de objetos y espacios que identifican al grupo/sala/escuela.", "i": ["Observa objetos y documentos significativos que distintos actores escolares guardan como recuerdo de su paso por el nivel (fotos, dibujos, carpetas, diplomas,entre otros).", "Compara objetos y espacios de la actualidad con otros que existían antes y crea relatos sobre las diferencias y similitudes observadas.", "Utiliza las nociones de antes y ahora en conversaciones, para distinguir temporalidades.", "Dialoga acerca de la utilidad y función de los objetos y espacios de la sala/jardín."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Comunicación oral de referencias espaciales básicas que den cuenta de su ubicación, la de otras personas y objetos que se sitúan en ambientes cotidianos.", "i": ["Describe oralmente la posición de sí misma/o, con referencias espaciales básicas en relación con otras personas u objetos (al lado de, detrás de, cerca de, lejos de, al frente de).", "Juega a ensayar diferentes ubicaciones de sí misma/o.", "Relata, con referencias espaciales básicas, la ubicación de otra/o niña/o u objeto."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de partes tangibles del dispositivo computacional y funciones asociadas.", "i": ["Observa dispositivos computacionales (prendidos y apagados), identificando partes observables (como botón de encendido, pantalla, teclas, cable, puertos de conexión) y explorando las respuestas del dispositivo al accionar alguno de estos componentes (por ejemplo, mover el mouse y se mueve el cursor, apretar la tecla de encendido/apagado y enciende o apaga, entre otros).", "Observa, acompañada/o por la/el docente, en diferentes dispositivos, partes similares (por ejemplo, la pantalla, los parlantes).", "Reconoce que un componente (por ejemplo, la pantalla) puede tomar, de un dispositivo a otro, características que lo distinguen (por ejemplo, puede o no ser táctil).", "Advierte que los dispositivos computacionales pueden tener muchas formas y tamaños.", "Observa, acompañada/o por la/el docente, diferentes partes de un dispositivo, reconociendo que cada una es diferente a la otra, tiene tamaños distintos y cumple funciones distintas."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Identificación de tareas realizables por el dispositivo computacional, a través de la exploración y manipulación de diferentes aplicaciones (por ejemplo, para buscar información, escuchar audios, observar imágenes y videos, interactuar con videojuegos, comunicarse con otras/os que no están presentes físicamente).", "i": ["Experimenta el desarrollo de distintas tareas usando dispositivos computacionales, como hacer un dibujo, sacar una foto, entre otras.", "Observa y reconoce que hay íconos en la pantalla/escritorio del dispositivo asociados con acciones o tareas específicas (por ejemplo, qué icono se debe tocar para dibujar o para sacar fotos).", "Advierte que hay tareas que el dispositivo computacional no puede desarrollar (por ejemplo, no se puede usar para cortar un papel o para abrazar a una persona o para correr en la plaza con amigas/os).", "Reconoce la importancia de utilizar los dispositivos respetando pautas de cuidado."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Identificación de las tareas que los dispositivos computacionales pueden realizar cuando se encuentren conectados a Internet.", "i": ["Explora, guiada/o por la/el docente, qué ocurre cuando realiza tareas determinadas (por ejemplo, búsqueda de imágenes o visualización de vídeos), identificando si el dispositivo está conectado a Internet.", "Advierte que algunas tareas, como enviar un mensaje o descargar una imagen o hacer una videollamada, pueden hacerse sólo si el dispositivo está conectado a Internet.", "Reconoce que al realizar acciones utilizando Internet, es importante contar con la compañía de una persona adulta.", "Reconoce que hay contenidos que pueden utilizarse si el dispositivo está conectado a Internet."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Reconocimiento de las relaciones entre los materiales que conforman los objetos y sus usos.", "i": ["Recolecta objetos de uso cotidiano o del entorno de la sala, reconociendo que, aunque tengan funciones similares, están hechos con diferentes materiales.", "Relaciona los materiales que conforman un objeto con las funciones que tiene, por ejemplo, un vaso de metal que, si se cae, no se rompe.", "Reconoce los usos de distintos objetos y la diversidad de materiales que pueden conformarlos."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Exploración de diversos modos de separar mezclas.", "i": ["Predice qué ocurrirá al mezclar distintos materiales, según sus características.", "Logra separar los componentes de una mezcla.", "Relata cómo realiza separaciones de mezclas y las herramientas que utiliza.", "Propone distintos modos y herramientas para separar los materiales de diferentes tipos de mezclas (por ejemplo, usando goteros, espátulas, tamices, filtros, pinzas, imanes, entre otros)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Registro autónomo de observaciones de objetos, mediante la realización de dibujos, fotografías, videos o la utilización de instrumentos de registro, como listados, tablas, check-list.", "i": ["Elabora dibujos sobre las observaciones que realiza.", "Participa en situaciones de búsqueda o identificación de información sobre los objetos que observa, contenida en textos informativos.", "Utiliza listados, tablas, check-list como instrumentos de registro de sus observaciones.", "Usa vocabulario y recupera información sobre la temática, a partir de textos informativos leídos en la sala.", "Completa listas de cotejo sobre objetos.", "Registra, mediante fotografías, videos o grabaciones de sonidos, recortes del entorno, en función de los objetivos de la observación.", "Dialoga con sus pares, y/o la/el docente, sobre la información contenida en textos informativos, a partir de lo que observa o anticipa."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Diseño de secuencias ordenadas de pasos para la resolución de una situación problemática, y la ejecución de una tarea determinada.", "i": ["Ordena, de forma secuencial, los pasos para elaborar un producto o realizar una tarea (preparar un sándwich, abrir una aplicación en el celular, separar residuos para reciclar, cruzar la calle de manera segura, entre otros) que resuelva una situación problemática.", "Reconoce y expresa posibles errores o inconvenientes si el orden de la secuencia de pasos se altera o modifica.", "Registra y/o representa, mediante dibujos, fotografías o videos, una secuencia de pasos.", "Descompone una tarea en una secuencia de pasos o sugiere pasos intermedios para una determinada secuencia propuesta por su docente, explicando su elección en función del objetivo a cumplir."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Diseño de objetos para diferentes usos y/o para satisfacer necesidades sociales, identificando algunas transformaciones que experimentan cuando se construyen.", "i": ["Relaciona un objeto con la necesidad que éste satisface.", "Experimenta con técnicas sencillas de transformación de los materiales (cortar, pegar, moldear, encastrar, plegar) para construir objetos.", "Idea y diseña objetos que satisfacen diferentes necesidades o resuelven problemas.", "Selecciona, en base a su experiencia, la técnica más apropiada para construir determinados objetos."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Aproximación a la historia de la comunidad, a partir de la indagación sobre ciertos objetos y espacios públicos como bienes de la cultura.", "i": ["Entrevista a distintos habitantes de la comunidad acerca de sus vivencias en diferentes momentos de la historia local.", "Utiliza palabras que aluden a la temporalidad (antes, ahora, después) para aproximarse a las nociones de pasado, presente, futuro.", "Observa objetos, espacios y prácticas culturales representativas para la comunidad (por ejemplo, monumentos, calles, murales, plazas, caminos, áreas naturales, festividades, entre otros), identificando algunos cambios y continuidades a través del tiempo.", "Participa y colabora en distintas intervenciones comunitarias, mencionando las tareas que realiza y expresando las sensaciones que experimenta."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Representación e interpretación de secuencias de relaciones espaciales, que informan acerca de desplazamientos propios, de otras personas y objetos.", "i": ["Escucha y sigue indicaciones de la/del docente o de otras/os compañeras/os para desplazarse (hacia adelante/atrás tantos pasos, girar hacia la ventana/hacia la puerta, caminar tantos pasos hacia el costado/hacia el frente, entre otras), en espacios conocidos y en situaciones de juegos.", "Representa gráficamente (croquis), lugares (casas, puentes, construcciones) y las trayectorias que realiza.", "Realiza, con mediación docente, desplazamientos por senderos y calles del entorno cotidiano, con atención a reglas y señales (normas de tránsito) para la circulación de peatonas/es y vehículos.", "Anticipa oralmente la secuencia de desplazamientos a partir de información presente en un croquis/plano de un espacio cercano (como sala, patio del jardín, parque, plaza, entre otros) y representa esa secuencia con material manipulativo, figurativo o gráfico."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Caracterización de los dispositivos computacionales, considerando similitudes y diferencias con otros objetos tecnológicos.", "i": ["Distingue tareas que no sólo pueden realizarse con un dispositivo computacional (por ejemplo, se puede hacer un dibujo utilizando un dispositivo o utilizando lápices y papel, se puede escuchar música en una tablet o cantar con amigas/os).", "Identifica que con los dispositivos computacionales se pueden realizar varias tareas, a diferencia de otros objetos que permiten realizar una sola actividad (por ejemplo, una heladera sólo permite refrigerar, pero con un dispositivo computacional se puede escuchar música, ver un video, sacar fotos, dibujar, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Reconocimiento de que para hacer una tarea con un dispositivo computacional, se utiliza un programa o aplicación.", "i": ["Relaciona, de manera autónoma el ícono del programa con la tarea que desea realizar.", "Distingue que distintos dispositivos pueden tener diferentes programas (por ejemplo, los programas que tiene un celular, no necesariamente son iguales a los que tiene una tablet, o en dos tablet puede haber programas distintos).", "Observa que una misma tarea puede ser llevada a cabo por más de un programa (por ejemplo, si se desea hacer un dibujo, se pueden elegir distintos programas que permitan realizarlo).", "Reconoce que se requiere del acompañamiento de una persona adulta para usar los dispositivos y sus programas."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Uso de funciones de edición (copiar, cortar y pegar), de guardado y recuperación de producciones digitales.", "i": ["Reconoce la función de “guardar” en los programas, para conservar sus producciones digitales al apagarse el dispositivo, poder retomarlas más tarde y compartirlas con otras/os.", "Explora funciones que facilitan la realización de producciones digitales (como copiar, pegar y cortar).", "Accede a las funciones de edición, guardado y recuperación, de distintas maneras (usando el menú, usando los íconos, entre otras).", "Recupera producciones digitales previamente guardadas.", "Reconoce la necesidad de nombrar la producción al momento de guardar, para luego poder abrirla ."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Identificación de dispositivos computacionales que, como el módem, tienen la funcionalidad de permitir la conexión a Internet.", "i": ["Explora, con acompañamiento docente, la conexión o desconexión de los dispositivos computacionales a Internet.", "Reconoce en qué situaciones es necesario que un dispositivo esté conectado a Internet (por ejemplo, para comunicarse con alguien mediante videollamada, ver un video en una plataforma, entre otros).", "Identifica objetos, en el ámbito escolar u hogareño, que permiten a los dispositivos conectarse a Internet (como cables, antenas, modem , router )."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Explorar objetos del pasado y el presente, los materiales que los forman, los sentidos que portan, los cambios que pueden experimentar, y sus usos personales y grupales.", "a": "Diálogo sobre formas de cuidado y respeto en prácticas comunicativas mediadas con tecnologías (analógicas y digitales).", "i": ["Conversa sobre características distintivas de prácticas comunicativas cotidianas, propias o ajenas, mediadas por tecnologías.", "Reconoce la necesidad de acompañamiento de una persona adulta en prácticas comunicativas mediadas por tecnologías digitales.", "Plantea preguntas y respuestas, con la mediación de la/ del docente, sobre el grado de seguridad y respeto de las prácticas comunicativas (por ejemplo, en relación con la información personal que se comparte, el cuidado de la integridad física/emocional de niños/as, la consideración de las opiniones y sentimientos de sus pares, entre otros aspectos).", "Reconoce similitudes y diferencias entre el modo de comunicarse en entornos presenciales y en plataformas digitales (turno de palabra, uso de emojis, tono, entre otros)."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Observación y participación en instancias conmemorativas y festivas para la construcción de la identidad.", "i": ["Participa en la recreación lúdica de escenas del pasado y del presente, utilizando objetos característicos de cada época.", "Realiza, con mediación docente, lectura de imágenes de época (pinturas, litografías, fotos, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Diálogo para expresar y escuchar sentimientos, opiniones y emociones, de sí misma/o y de otras personas.", "i": ["Usa la palabra para comunicar sus preferencias personales y escucha las de las otras personas.", "Conversa con sus pares sobre vivencias, opiniones y emociones de sus contextos cotidianos."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Exploración de paisajes cotidianos y de sus elementos y componentes perceptibles.", "i": ["Reconoce diferentes elementos —naturales, sociales, culturales, tecnológicos— de paisajes de los entornos próximos (tales como elementos del relieve, aguas, vegetación, fauna, prácticas sociales, población, actividades de distinto tipo, infraestructura, entre otros).", "Juega con materiales y objetos que le permiten aproximarse a componentes de paisajes (maquetas con diversos relieves, personas, casas, vías de comunicación, entre otras).", "Percibe, a través de ejercicios y manipulación de objetos, diversidad de colores, aromas, formas, texturas, entre otros, presentes en los espacios cercanos y que conforman paisajes."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Cooperación/colaboración en acciones de cuidado del entorno, en el quehacer cotidiano del jardín.", "i": ["Participa en actividades grupales simples que promueven el conocimiento del entorno natural, como sembrar y ver crecer plantas o una huerta, y observar interacciones entre plantas y animales.", "Evidencia compromiso con la conservación y buen estado de objetos y espacios comunes, como juguetes, materiales, mobiliario de la sala, a través de acciones concretas.", "Demuestra curiosidad e interés sobre las plantas y los animales de su entorno cotidiano, y manifiesta actitudes de cuidado."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Exploración de fenómenos meteorológicos, como lluvia, viento, granizo, entre otros.", "i": ["Participa en actividades de observación del cielo y de fenómenos meteorológicos.", "Relaciona los fenómenos meteorológicos observados con la iconografía que los representa.", "Describe de forma oral fenómenos meteorológicos."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Observación de diversos seres vivos para aproximarse a la diversidad en el paisaje cotidiano.", "i": ["Reconoce las plantas, los animales y a las personas como seres vivos.", "Reconoce, a partir de observaciones directas o indirectas (fotografías, ilustraciones en textos informativos y otros soportes), los estados de crecimiento de plantas y animales (por ejemplo, semilla, brote, planta; huevo, oruga, crisálida o pupa e insecto; embarazo, cachorro, adulto).", "Identifica plantas y animales según sus tamaños, colores y formas.", "Observa y explora cambios que suceden en las plantas de su entorno cotidiano, a lo largo de varios días."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Participación en instancias conmemorativas y festivas de la sala, la escuela y la comunidad, para la construcción de la identidad.", "i": ["Identifica acontecimientos del pasado que son importantes para nuestro presente.", "Reconoce la bandera y la escarapela como símbolos patrios significativos para la escuela y la comunidad."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Identificación, en intercambios comunicativos, de distintas formas de expresar emociones y opiniones, que favorecen o perjudican el encuentro y trabajo con otras/os.", "i": ["Identifica distintos modos de comunicación en la convivencia con otras/os (al pedir la palabra, respetar turnos de habla, en la escucha atenta y respetuosa de las demás personas, entre otros).", "Es amable, respetuosa/o y atenta/o en sus propias prácticas comunicativas.", "Se expresa acerca de cómo le afectan los intercambios con otras/os, reconociendo emociones propias y ajenas."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Reconocimiento de los elementos del paisaje y sus características.", "i": ["Distingue elementos naturales (tierra, cielo, plantas, animales, entre otros) de aquellos construidos por personas (por ejemplo, escuelas, edificios, parques, calles, cableado, puentes, entre otros).", "Observa y reconoce, a partir de juegos y dibujos, objetos culturales y técnicos de los paisajes, así como las actividades que realizan las personas (por ejemplo, infraestructura, tipos de construcciones, medios de transporte, entre otros).", "Observa y reconoce elementos naturales de la tierra (por ejemplo, diversidad de plantas, animales, componentes del suelo, el agua, el aire, entre otros) y del cielo (estrellas, luna, nubes, entre otros).", "Distingue diversos paisajes, encontrando similitudes y diferencias, a partir de la observación de fotografías, materiales audiovisuales o experiencias directas (por ejemplo, bosque, cultivo, ciudad, entre otros)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Identificación de algunas acciones de cuidado del entorno que se realizan en la vida cotidiana.", "i": ["Diferencia, a partir de dibujos, imágenes, textos informativos, juegos o el diálogo, acciones que son beneficiosas para el cuidado del ambiente (como cuidar las plantas, y el monte, evitar arrojar residuos al suelo, mantener la limpieza de espacios y objetos compartidos, sostener tratos cordiales con los demás miembros del grupo, tener una huerta, entre otras) respecto de otras que son perjudiciales.", "Realiza acciones colaborativas de cuidado del entorno (por ejemplo, separar los residuos en distintos tachos, cerrar canillas de agua en el patio del jardín, caminar cuando la distancia es corta, entre otras).", "Participa en conversaciones grupales sobre el cuidado del ambiente, compartiendo sus ideas y experiencias."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Reconocimiento del tiempo atmosférico como una situación que varía e incide en las actividades diarias de las personas.", "i": ["Nombra y reconoce distintos estados de tiempo meteorológico (por ejemplo, soleado, nublado, lluvioso, entre otros).", "Relaciona el tiempo atmosférico con la vestimenta a utilizar (abrigarse cuando hace frío, usar piloto para la lluvia o botas, paraguas, entre otros) o actividades a realizar ( al aire libre en días soleados, por ejemplo).", "Realiza mediciones sencillas, utilizando instrumentos como pluviómetro, veleta, catavientos, anemómetro, cianómetro, entre otros, y las registra mediante esquemas o dibujos.", "Recupera información referida a los fenómenos meteorológicos, a partir de iconografía presente en distintos soportes y medios (como diario, revistas, programas de televisión, aplicaciones)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Diferenciación entre animales domésticos (de la casa o de granja) y silvestres, y entre plantas que comemos, domésticas, y silvestres.", "i": ["Identifica y utiliza formas corporales, texturas, cantidades y tamaños, para describir a plantas y animales.", "Agrupa animales o plantas según sean silvestres o domésticos.", "Reconoce y nombra animales domésticos (como perro, gato, canario, gallina, vaca, caballo) y plantas que come (por ejemplo, tomate, lechuga, zanahoria, papa, banana, entre otras).", "Diferencia las características del hábitat y las necesidades de animales domésticos y silvestres.", "Participa en diálogos sobre la importancia del cuidado de plantas y animales.", "Distingue el rol que se asigna a diferentes animales domésticos en diversos contextos (por ejemplo, paseo, buscar objetos, rescatar personas, guiar personas con discapacidad)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Exploración del suelo y sus características.", "i": ["Observa rocas de su entorno con diferentes características y elabora clasificaciones propias (texturas, pesos, colores, termopercepción).", "Explora y caracteriza, sensorialmente, diversos tipos de suelo.", "Reconoce al suelo como hábitat para algunos seres vivos (como bichos bolita, lombrices)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Participación activa en instancias conmemorativas y festivas de la comunidad local y nacional, para la construcción de la identidad.", "i": ["Identifica acontecimientos históricos que se conmemoran en el presente.", "Reconoce la bandera, la escarapela y el Himno Nacional como símbolos patrios significativos para la comunidad, y destaca lugares o momentos en que se emplean.", "Compara prácticas de la vida social del pasado con el presente, en relación con vestimentas, juegos, comidas, bailes, entre otros."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Deliberación sobre situaciones conflictivas o problemáticas de la vida cotidiana del jardín, del barrio y de otros entornos, reconociendo diversidad de intereses y puntos de vista, proponiendo y consensuando posibles soluciones.", "i": ["Identifica el/los conflictos presentes en situaciones del cotidiano escolar o comunitario.", "Participa en conversaciones expresando su posición personal sobre el conflicto identificado, escucha otras opiniones y propone alternativas.", "Vincula el/los conflictos con diferentes opiniones, intereses, preferencias personales que tienen sus compañeras/os y otros miembros de la comunidad.", "Elige entre las opciones propuestas."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Identificación de las diversas formas en que las comunidades habitan y transforman los paisajes.", "i": ["Observa y registra, a través de palabras o dibujos, los cambios que las personas realizan en el paisaje (por ejemplo construcción de edificios, cultivos, caminos en diversos espacios, calles, bicisendas, costaneras).", "Identifica múltiples prácticas de interacción sociedad-naturaleza (producción de alimentos, oficios y trabajos en las ciudades o pueblos, entre otros), a partir de actividades lúdicas.", "Representa paisajes de los que se reconoce parte y expresa su conexión emocional a través de íconos (caras con diversas expresiones emocionales), palabras, colores, entre otros.", "Describe espacios públicos, como la calle o plaza, y los modos de desplazarse, de manera segura, como peatonas/es acompañadas/os y/o pasajeras/os de diversos transportes."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Participación responsable en acciones cotidianas de cuidado del ambiente.", "i": ["Comunica y expresa actitudes y emociones al hablar de la naturaleza y su cuidado.", "Distingue entre acciones que son beneficiosas para el ambiente de aquellas que son perjudiciales.", "Participa de acciones (individuales o grupales) de cuidado del entorno, y las implementa cotidianamente (por ejemplo, separar los residuos en distintos tachos, cerrar canillas de agua en el patio del jardín, recoger agua de lluvia, solicitar a adultos que apaguen luces que no son necesarias, entre otras).", "Conversa sobre las consecuencias de las acciones propias y ajenas en el cuidado de espacios comunes o barriales, tales como plazas, edificios, calles, medios de transporte, reservas naturales, entre otros.", "Dialoga y propone a sus compañeras/os acciones de cuidado del ambiente, en sus contextos de pertenencia, compartiendo sus ideas y experiencias.", "Reconoce prácticas de cuidado hacia producciones culturales de la comunidad, en espacios de uso común (murales, monumentos, espacios de recreación, entre otros)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Identificación de las relaciones entre las estaciones del año y el clima, con las actividades de las personas y el resto de los seres vivos.", "i": ["Participa en actividades de observación y señala cambios (en el paisaje, en la vestimenta, en la dinámica familiar, entre otros) que se relacionan con las estaciones del año.", "Reconoce los cambios en animales y plantas durante las estaciones climáticas del año (por ejemplo, en primavera crecen más y nuevas flores, algunos animales migran en invierno, algunos animales tienen cambio de pelaje, entre otros).", "Identifica algunas características específicas de cada estación del año (por ejemplo, el aumento de temperatura en primavera y verano, el descenso de lluvias en invierno, menos horas de luz en invierno, entre otras).", "Anticipa condiciones climáticas en una estación del año determinada, y expresa sus preferencias y sensaciones.", "Reconoce que el clima cambia a lo largo del tiempo, a partir de conversaciones sobre el pasado y relatos familiares (por ejemplo, preguntando cómo eran los inviernos en las infancias de sus familiares)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Observación de plantas y animales (vertebrados y no vertebrados), para reconocer las principales partes de su cuerpo y caracterizarlos.", "i": ["Observa, representa o reconoce en dibujos y esquemas de textos informativos (láminas, libros, enciclopedias, entre otros) las distintas partes del cuerpo de animales y plantas, en especial, con ejemplos de flora y fauna autóctona.", "Reconoce diferencias externas entre los distintos animales vertebrados (por ejemplo, formas de movimiento y de desarrollo, de nacer, tipos de boca y de alimentación, coberturas del cuerpo) y clasificaciones simples (como mamíferos, anfibios, reptiles, peces y aves).", "Utiliza lupas, binoculares u otros instrumentos de observación que le permiten centrar la mirada y detallar las partes del cuerpo de diferentes seres vivos.", "Identifica características que permiten distinguir lombrices, moluscos, insectos, arácnidos, miriápodos (por ejemplo cantidad de patas, presencia de alas y antenas, segmentos del cuerpo, entre otros).", "Agrupa diversas partes del cuerpo de distintas plantas o animales, según características similares.", "Reconoce las medidas de prevención para cuidar su cuerpo y el de otras personas al encontrar mosquitos, arañas, escorpiones y serpientes.", "Reconoce, en esquemas sencillos, las principales partes de las plantas, como raíz, tallo, hojas, flores, frutos."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Reconocimiento del hábitat de animales y plantas, en particular de flora y fauna autóctona.", "i": ["Reconoce tipos de hábitats (por ejemplo, selva, montaña, pastizal, desierto, bañado).", "Observa y/o escucha sobre la relación entre plantas y animales autóctonos de un mismo hábitat (por ejemplo, mariposas y flores).", "Participa en actividades de observación y exploración de su entorno natural, para registrar la diversidad de plantas y animales silvestres y autóctonos.", "Reflexiona sobre la importancia del respeto por el hábitat de los demás seres vivos.", "Identifica algunos animales autóctonos de la provincia de Córdoba y de Argentina.", "Reconoce sensaciones y experiencias positivas propias en ambientes naturales."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Reconocerse como parte de comunidades conformadas a partir de múltiples prácticas que involucren interacciones con la naturaleza, la cultura y las tecnologías.", "a": "Exploración de los cambios que se producen en el paisaje a lo largo del tiempo, y reconocimiento de la existencia de huellas de formas de vida del pasado, en el presente.", "i": ["Distingue diversos movimientos de tierra (como deslizamientos, derrumbes, aludes, entre otros) y a partir de ejemplos concretos, los relaciona con los diferentes paisajes.", "Participa en actividades lúdicas relacionadas con diversas tareas y campos científicos (como paleontología, geología, antropología fósil, biología, etnografía, entre otras).", "Narra cómo se transforma un paisaje con el tiempo, a través de secuencias temporales.", "Compara animales del pasado con animales del presente, como aproximación a la idea de extinción.", "Reconoce los fósiles como huellas que nos permiten identificar formas de vida del pasado.", "Identifica construcciones y artefactos del pasado (templos, vasijas, arcos y flechas, entre otros).", "Explora y describe formas y características observadas en réplicas de fósiles o reconstrucciones (observación directa o a través de imágenes o videos) y las relaciona con las de otros seres vivos actuales que conoce."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en diversas situaciones de juego, identificando preferencias personales e interactuando con otras/os de manera respetuosa.", "i": ["Explora y participa de diferentes juegos, con actitud respetuosa.", "Acepta las preferencias de las demás personas, realizando acuerdos mediados por personas adultas.", "Expresa, ante diferentes juegos, opiniones, intereses y emociones."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en experiencias que posibilitan la integración y convivencia grupal.", "i": ["Reconoce a sus compañeras/os de sala y a la/el docente como grupo de pertenencia.", "Comparte, actividades, ideas o materiales con sus compañeras/os, escuchando a las/os demás y respetando turnos y reglas para interactuar con otras/os.", "Se involucra y colabora en rutinas y pautas cotidianas de la sala/el jardín, de manera progresiva.", "Acepta indicaciones de las personas adultas cuando surge un desacuerdo entre pares, y propone acciones colaborativas para resolver conflictos."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Exploración del entorno cercano como aproximación a los beneficios de estar en la naturaleza.", "i": ["Disfruta de la naturaleza, poniendo en juego todos sus sentidos.", "Se desplaza por los espacios que habita, cumpliendo las normas que se le proponen según el contexto.", "Reconoce la naturaleza en entornos cotidianos, como espacios verdes, patios, plazas, terrenos baldíos, veredas, banquinas, entre otros.", "Cuida de los espacios propios y ajenos, ya sean naturales, sociales y tecnológicos.", "Identifica y registra, con dibujos sencillos, elementos naturales, objetos técnicos y culturales observados en los entornos que habita."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento del tiempo diario personal/familiar, su organización, sus rutinas y lugares en los que acontecen.", "i": ["Distingue entre actividades que se realizan de día y de noche.", "Dialoga sobre las rutinas de la vida familiar y los lugares en que acontecen.", "Incorpora, progresivamente, en sus relatos, palabras vinculadas con las nociones temporales antes y ahora.", "Dramatiza actividades familiares de distintos momentos de un día."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Identificación de partes del propio cuerpo y del cuerpo de las demás personas de la sala, a partir de prácticas de autoconocimiento y cuidado.", "i": ["Identifica límites físicos entre el propio cuerpo y el de las demás personas.", "Realiza prácticas de autocuidado y autoprotección, a partir de recomendaciones (por ejemplo, higiene personal y de la sala, uso del baño, alimentación, conductas adecuadas durante el juego, cuidado de la intimidad propia y de otras/os, entre otras).", "Nombra las partes externas de su propio cuerpo y las identifica en esquemas, dibujos o muñecos.", "Distingue, en su propio cuerpo y en representaciones, las partes externas y las zonas íntimas."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Identificación y diferenciación de las características de personas y grupos sociales cercanos (familia-sala).", "i": ["Participa en conversaciones, con mediación docente, sobre la vida cotidiana y las prácticas que realizan los miembros de la familia.", "Valora y respeta las diferencias que caracterizan a las/ os compañeras/os de la sala.", "Reconoce distintos miembros de la sala y describe sus singularidades (por ejemplo, corporales, preferencias, consumos culturales, habilidades, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 3, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en prácticas saludables de alimentación, higiene, descanso, actividades corporales, motrices y recreativas.", "i": ["Realiza prácticas saludables de higiene (como aprender a lavarse las manos, los dientes, entre otras), identificando los objetos asociados y utilizándolos de manera adecuada.", "Reconoce el momento de la merienda, incorporando alimentos saludables.", "Incorpora, progresivamente, nuevas maneras de moverse para ampliar su repertorio motriz y lúdico."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en diferentes tipos de juego, fortaleciendo la autoestima y la interacción colaborativa.", "i": ["Elige a qué jugar (en situaciones de juego dramático, de construcciones, de roles, entre otros), explorando sus gustos y preferencias.", "Participa interactuando colaborativamente con otras/ os, para alcanzar objetivos comunes.", "Establece vínculos de cooperación y empatía durante las actividades de juego, respetando la elección y los intereses de todas/os, sin asumir roles según estereotipos.", "Explora diferentes roles y juegos, fortaleciendo una imagen positiva de sí misma/o."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Identificación y valoración de pautas que facilitan la convivencia, entre personas que comparten tiempos y espacios comunes.", "i": ["Reconoce y sigue progresivamente pautas establecidas para los usos de espacios y objetos comunes, de la sala y el jardín de la escuela.", "Comprende la utilidad del diálogo para expresar opiniones y escuchar a las demás personas.", "Conversa sobre la utilidad y sentido de las normas de la sala y la escuela, en pos de una convivencia armoniosa.", "Diferencia modalidades correctas e incorrectas de interacciones entre pares y adultos."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Exploración de diferentes espacios (como jardines urbanos, huertas, granjas, plazas, costaneras, áreas naturales protegidas) y reflexión sobre sus sensaciones y experiencias.", "i": ["Conoce y recorre distintos espacios, cumpliendo las normas de cuidado establecidas.", "Valora la diversidad de estos espacios, en comparación con lugares que forman parte de su cotidianeidad.", "Participa en salidas didácticas (a plazas, parques, jardines botánicos, áreas naturales protegidas, entre otros) y reconoce características, particularidades y los objetos que diferencian cada espacio.", "Dialoga sobre sus sensaciones y experiencias al habitar esos espacios."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento del tiempo diario escolar, su organización y sus rutinas, identificando lugares compartidos.", "i": ["Dialoga sobre los tiempos en la sala, observando imágenes secuenciadas de los distintos momentos de una jornada.", "Incorpora progresivamente, en sus relatos, palabras vinculadas con las nociones temporales antes, ahora y después.", "Observa grillas semanales en las que se registran acontecimientos sucesivos.", "Identifica objetos y dispositivos que miden el tiempo, como relojes, almanaques, calendarios."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Observación de las acciones y actividades de quienes integran la comunidad educativa, como las/os trabajadoras/es de la escuela, las/os estudiantes y las familias.", "i": ["Reconoce a las/os trabajadoras/es que se encuentran en la escuela, y participa en conversaciones sobre quiénes son, cuáles son sus tareas, qué herramientas e instrumentos utilizan, y cómo se relacionan entre sí.", "Indaga, a partir de actividades y encuentros convocados en la escuela, acerca de las formas de participación de las familias.", "Participa en diálogos con sus pares acerca de las actividades que realizan las/os niñas/os, momentos y espacios que utilizan, y la participación de personas adultas en las diversas tareas."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento de las funciones de las partes externas de su propio cuerpo, a través de prácticas de autoconocimiento y cuidado propio y de las demás personas, en diferentes espacios y situaciones cotidianas.", "i": ["Explora y realiza diferentes movimientos con sus extremidades, reconociendo situaciones en las que éstas se utilizan.", "Reconoce y diferencia interacciones adecuadas e inadecuadas con pares y personas adultas.", "Expresa autonomía y seguridad en la comunicación de emociones, necesidades o rechazos, frente a situaciones incómodas.", "Vincula las partes externas del cuerpo con las funciones que realizan.", "Participa en acciones que involucran el cuidado de su cuerpo y el de las demás personas (cerrar la puerta del baño, colaborar con la limpieza de la sala, respetar el espacio personal, ofrecer y pedir ayuda durante juegos)."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento de las diferencias de las personas y de los grupos sociales cercanos, aproximándose a la importancia de la diversidad para la convivencia.", "i": ["Identifica las diferencias (de nombres, gustos, preferencias, entre otras) como parte de la identidad de las personas.", "Descubre características distintivas de otros grupos sociales con los que interactúa (amigos, clubes, entre otros).", "Participa en conversaciones sobre las familias de la sala (sus orígenes diversos, su conformación, la distribución de roles, entre otras características) e identifica diferencias (valores, gustos y tradiciones particulares).", "Colabora en tareas colectivas, valorando las particularidades y preferencias de unas/os y otras/os."]}, {"c": "Ambiente", "s": null, "sala": 4, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Identificación de diversas prácticas saludables de alimentación, higiene, actividades corporales y motrices, incluyendo las recreativas, lúdicas y expresivas.", "i": ["Participa en prácticas saludables de alimentación, higiene personal (lavarse las manos y los dientes, el baño diario, entre otras) y movilidad corporal (posturas, desplazamientos, juegos motores).", "Distingue y contrasta prácticas de alimentación saludable y no saludables (qué comer, cómo, dónde).", "Propone la implementación de prácticas que promuevan el cuidado y bienestar.", "Incorpora progresivamente las prácticas saludables a sus hábitos cotidianos en los espacios escolares."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento y ejercicio de algunos derechos de NNA, tales como el derecho a jugar, a la identidad, a la intimidad y a disfrutar de un ambiente sano, a través de la participación en situaciones del cotidiano escolar.", "i": ["Identifica, en diversas situaciones de la vida escolar, el ejercicio del derecho a jugar.", "Valora progresivamente la importancia del cuidado de su intimidad, como el respeto de la de otras/os.", "Reconoce su nombre, sus gustos y preferencias como parte de su identidad (“yo soy”).", "Participa en acciones que hacen que la sala y el jardín sean un ambiente seguro, saludable y sostenible."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en la construcción colaborativa de acuerdos seguros y respetuosos para la sala, para su apropiación creciente.", "i": ["Reconoce situaciones cotidianas que requieren acuerdos.", "Participa activamente en la creación de acuerdos para resolver conflictos, como construcciones colaborativas que favorecen la convivencia", "Propone pautas para resolver situaciones y respeta las propuestas de las/os demás."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Disfrute y cuidado de variados espacios, en el ejercicio del derecho a un ambiente sano.", "i": ["Reconoce las ventajas de realizar actividades al aire libre y sus beneficios para la salud, a partir de los movimientos que realiza y las sensaciones que le generan, entre otras posibilidades.", "Cuida las plantas, el agua y el suelo, de manera autónoma y habitual, en el espacio cotidiano.", "Reconoce cambios que perjudican al ambiente y los entornos próximos.", "Participa en conversaciones sobre cómo es estar en diferentes espacios (interiores pequeños o amplios, al aire libre), preparadas/os para distintas actividades.", "Propone acciones para cuidar y mejorar los espacios cotidianos que habita."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Conocimiento del pasado lejano de la comunidad, a partir de un recorte de la vida cotidiana, para identificar cambios y continuidades.", "i": ["Formula preguntas y busca respuestas sobre el pasado lejano, identificando cambios y continuidades con el presente.", "Participa en la creación y dramatización de escenas del pasado, representando un grupo social determinado, y utilizando elementos/objetos que caracterizaban su vida cotidiana.", "Reconoce y comenta con sus pares acerca de costumbres en la vida cotidiana de sociedades del pasado, a través de relatos, imágenes y visitas a museos, entre otros recursos."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Identificación de las diversas instituciones de la comunidad que organizan la vida en sociedad, a partir de las profesiones, oficios y ocupaciones que se ejercen.", "i": ["Distingue diversas instituciones que organizan la vida en sociedad, (en áreas tales como salud, seguridad, educación, recreación, entre otras).", "Identifica diversos roles y puntos de vista de los actores sociales vinculados con las instituciones (reconociendo acuerdos o desacuerdos posibles en la organización de la vida en sociedad).", "Reconoce, mediante observación directa o a través de imágenes, oficios, profesiones, objetos y materiales utilizados en diferentes establecimientos de atención sanitaria (consultorio odontológico, hospital, dispensario, entre otros), de seguridad (posta policial, comisaría, Policía Caminera, entre otros), y de educación (centros educativos, universidades, entre otros)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento de algunas partes internas del cuerpo, sus funciones y los cambios producidos a lo largo del crecimiento.", "i": ["Observa materiales bibliográficos, recursos audiovisuales o maquetas en los que se representan las partes internas del cuerpo humano.", "Registra cambios corporales propios, como altura, tamaño de manos y pies, entre otros, a lo largo del tiempo.", "Compara y describe las diferencias corporales relacionadas con el crecimiento, desde el nacimiento hasta la actualidad.", "Reconoce la relación entre las partes internas del cuerpo y las funciones perceptibles a través del uso de los sentidos (por ejemplo, movimiento, respiración, latido del corazón, ruido de la panza, percepción de aromas, entre otras)."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Participación en conversaciones sobre el cuidado de la intimidad en diversos contextos cotidianos, enfatizando la importancia de respetarla.", "i": ["Intercambia opiniones y vivencias sobre la intimidad como espacio personal, que incluye pensamientos, sentimientos y relaciones con el propio cuerpo", "Propone, de manera colaborativa, prácticas en relación al cuidado de la intimidad, en situaciones cotidianas escolares y familiares.", "Compara situaciones de intimidad con otras públicas o compartidas, reconociendo diferencias y respetando límites.", "Plantea conjeturas sobre conductas respetuosas/irrespetuosas de la intimidad propia y ajena, y sus consecuencias.", "Dialoga sobre la noción de consentimiento, su presencia y ausencia, ejemplificando diferentes modos de expresarlo.", "Reconoce la importancia de no guardar secretos que la/o hagan sentir incómoda/o, mal o confundida/o."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento y valoración de aspectos comunes y diversos de los miembros de la comunidad escolar.", "i": ["Comparte anécdotas, costumbres e historias de vida de su familia e identifica lo común y diverso respecto de otras familias.", "Participa en juegos tradicionales y festividades locales, identificando sus singularidades.", "Reconoce y valora la diversidad de formas de convivir y de organizar la vida familiar y comunitaria, apreciando tanto las similitudes como las diferencias.", "Identifica diferentes cultos religiosos y colectividades presentes en la comunidad, a partir de vestimentas, objetos, comidas típicas, e intercambia creencias y prácticas."]}, {"c": "Ambiente", "s": null, "sala": 5, "m": "Experimentar y participar en situaciones de la vida cotidiana de las infancias: diferentes rutinas y lugares, modos de ser y convivir, derechos y responsabilidades, el cuidado del propio cuerpo y el de las/os otras/os.", "a": "Reconocimiento de diferentes grupos de alimentos y su importancia para la salud.", "i": ["Identifica distintos grupos de alimentos e indaga sobre su origen.", "Reconoce los beneficios del consumo de agua para el cuidado de la salud.", "Participa en conversaciones sobre la importancia de consumir alimentos variados y nutritivos.", "Propone o aplica prácticas saludables relacionadas con la alimentación y la hidratación."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Exploración, a través del contacto sensorial, de variedad de imágenes, objetos y entornos (naturales, urbanos, lúdicos, muestras escolares, museos, entre otros).", "i": ["Toca, huele, escucha, mira de cerca diversos materiales y contextos, para interactuar con ellos.", "Distingue, con la guía de la/del docente, objetos artificiales (sillas, juguetes, entre otros) y naturales (hojas, piedras, entre otros) propios de los entornos explorados.", "Reconoce colores básicos (amarillo, rojo, azul), diferentes texturas contrastantes (por ejemplo,. suaves/ rugosas) y materiales comunes (telas, madera, plástico, entre otros) en aquello que percibe."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Aproximación, lúdica y visual, de producciones artísticas locales, nacionales y latinoamericanas, a través del reconocimiento de formas, colores y texturas.", "i": ["Distingue elementos visuales (colores, formas, texturas) comunes y diferentes. Expresa, con palabras o gestos,lo que siente o imagina al observar una producción artística.", "Describe lo observado, para manifestar sus primeras impresiones/ interpretaciones."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Valoración de las producciones de sus pares, para identificar características comunes y/o diferentes en relación con las propias producciones.", "i": ["Reconoce los elementos visuales (colores, formas, texturas), técnicas y materiales usados en producciones ajenas.", "Comparte su opinión acerca de la producción propia y la de sus pares.", "Distingue algunas similitudes y diferencias entre su producción y la de sus pares."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Iniciación en la experiencia de observación de producciones artísticas en el entorno escolar y visitas culturales, para desarrollar,como público, dinámicas y comportamientos vinculados con la experiencia y el disfrute.", "i": ["Demuestra curiosidad y asombro frente a la experiencia, a través del contacto sensorial con las producciones.", "Reconoce diferentes momentos de la visita, como de exploración individual o grupal, agrupamiento para escuchar explicaciones, intercambio de ideas, entre otros.", "Responde a las indicaciones de la/del docente mediante gestos, palabras o movimientos."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Reconocimiento sensorial de variedad de imágenes, objetos y entornos, identificando algunas de sus cualidades visuales y táctiles.", "i": ["Experimenta y recorre, vivencialmente, entornos naturales, urbanos, lúdicos, muestras escolares, museos y producciones artísticas (fotografías, reproducciones, entre otros).", "Identifica elementos visuales (formas, colores, texturas), sus cualidades comunes y diferentes.", "Expresa sus ideas y sentimientos sobre lo percibido, a través de gestos, palabras o conversaciones sencillas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Identificación de sentimientos o ideas que provocan diferentes producciones artísticas (históricas y contemporáneas) y de las características formales que presentan (colores, formas, personajes, entre otras).", "i": ["Identifica colores primarios, formas sencillas y texturas en lo observado.", "Comparte sus sensaciones o ideas con relación a lo percibido.", "Describe algunas de sus características, como formas (cerradas, abiertas, tamaño), texturas (suaves, rugosas) y colores (claros, oscuros).", "Comparte, a través de relatos breves, algunos recuerdos, anécdotas o experiencias propias, de acuerdo con lo observado/vivenciado."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Apreciación de las producciones propias y la de sus pares, por medio de la identificación de elementos visuales comunes y diferentes.", "i": ["Señala elementos visuales, comunes y diferentes, entre sus producciones y la de sus pares.", "Expresa las sensaciones/sentimientos que le provoca lo percibido, por ejemplo, “en esa imagen hay un parque, hay muchos colores y me gusta porque me gusta ir al parque”.", "Expone sus ideas sobre producciones propias y ajenas, relacionándolas con los colores, formas y texturas que las componen, anticipando su intencionalidad creativa."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 4, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Exploración y disfrute de producciones visuales en muestras escolares y otros espacios culturales, barriales, entre otros, para iniciar su experiencia individual y colectiva como público.", "i": ["Reconoce materiales y posibles técnicas y/o herramientas empleadas, identificando obras y paratextos (información técnica de la obra, textos de sala, firma, entre otros).", "Comparte sus sensaciones o ideas respecto de lo experimentado.", "Identifica elementos visuales, similares y diferentes, entre las producciones percibidas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Observación activa, a través del contacto sensorial, de variedad de imágenes, objetos y entornos, focalizando en sus cualidades visuales y táctiles, así como en la incorporación de términos específicos.", "i": ["Explora, de manera autónoma, entornos, objetos y/o imágenes de su interés.", "Comparte historias o ideas que surgen de las percepciones vivenciadas.", "Describe elementos visuales y táctiles, a partir de sus cualidades comunes y diferentes, incorporando vocabulario específico paulatinamente."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Apreciación de diferentes producciones artísticas, para comparar los sentimientos o ideas que surgen de estas observaciones, y los elementos formales usados en el proceso creativo.", "i": ["Compara elementos formales, por ejemplo, “este color es más claro/oscuro que este otro”, “esta forma es mayor/ menor que aquella”, entre otras.", "Construye significados a partir del propio imaginario, lo que las imágenes muestran, lo que evocan (por ejemplo, “creo que el artista estaba triste/contento, porque el personaje tiene…”).", "Expresa conexiones afectivas con lo observado, de acuerdo con las sensaciones de placer o displacer que experimenta.", "Establece relaciones iniciales entre los aspectos formales de lo observado y las intenciones expresivo-comunicativas de sus autores (por ejemplo, el uso de texturas o colores para generar diferentes sensaciones o ambientes)."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Comparación entre las producciones propias y la de sus pares, reconociendo elementos formales y culturales.", "i": ["Reconoce aspectos culturales presentes en las producciones observadas (personajes, tradiciones, festividades, entre otros).", "Sugiere opciones o variaciones, por ejemplo, “podrías agregar este color”, “hacer más grande esta forma”, entre otras.", "Describe elementos visuales comunes entre su producción y la de sus pares.", "Describe relaciones básicas entre las formas y el espacio (figura/fondo, cerrado/abierto), en imágenes y/o composiciones propias o ajenas, utilizando términos simples."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 5, "m": "Descubrir los elementos visuales presentes en el entorno cotidiano, a través de la exploración de colores, formas y texturas, desde el juego y la observación activa, para habilitar una mirada curiosa y creativa.", "a": "Participación en instancias de observación directa de diferentes producciones, en visitas a muestras barriales o de espacios culturales vecinales, para promover vivencias individuales —como espectadora/ or— y grupales, que promuevan el ejercicio del derecho a la cultura.", "i": ["Explica, con palabras sencillas, algunas de las decisiones compositivas observadas (por ejemplo, un mayor tamaño en relación con una preferencia, importancia o protagonismo).", "Expresa sus sensaciones de placer o displacer frente a lo vivenciado, justificando brevemente lo que siente.", "Identifica personajes, objetos, paisajes, detectando las partes que componen el todo, en las producciones figurativas observadas."]}, {"c": "Educación Artística", "s": "Artes Visuales", "sala": 3, "m": "Explorar las posibilidades expresivas de trazos, manchas y formas en producciones gráfico-pictóricas bidimensionales, a través de la experimentación y el juego creativo con el espacio y la composición, desde una perspectiva intuitiva.", "a": "Experimentación lúdica de dibujos y pinturas, analógicas y/o digitales, a través del uso intuitivo de elementos gráficos como punto, línea, figura, manchas, colores.", "i": ["Descubre diferentes elementos gráficos (puntos, líneas, formas) en sus producciones bidimensionales, a través de la gestualidad.", "Explora las posibilidades estéticas de los colores y las formas en el espacio de trabajo.", "Juega con diferentes elementos pictóricos (manchas, formas, paletas reducidas, entre otros) en sus producciones bidimensionales, en soportes analógicos y/o digitales.", "Experimenta las posibilidades expresivas de los trazos y las
