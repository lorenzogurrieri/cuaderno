escena y de quien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Participación en escenas asumiendo intencionadamente un rol, sosteniéndolo durante el desarrollo del juego teatral mediante gestos, movimientos y expresiones acordes.", "i": ["Elige y sostiene un personaje a lo largo de la representación.", "Mantiene la continuidad de la acción hasta el final del juego.", "Utiliza gestos, posturas y voz adecuados al rol que representa.", "Interactúa con otros personajes respetando la lógica de la representación."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Diferenciar los roles de quien juega en la escena y de quien observa como público, a través de actividades simples de dramatización y juego de roles.", "a": "Iniciación de la construcción del rol de espectador activo, capaz de elaborar opiniones sobre lo que se muestra en escena.", "i": ["Observa atentamente las situaciones escénicas representadas por sus compañeras/os asumiendo una actitud respetuosa desde el rol de espectadora/dor.", "Reconoce emociones, personajes o acciones representadas y lo comenta con el grupo.", "Elabora comentarios expresando ideas, sensaciones o interpretaciones personales."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Descubrimiento de las posibilidades del propio cuerpo y del de sus compañeras/os en el espacio.", "i": ["Se desplaza por el espacio evitando choques frecuentes con sus compañeras/os.", "Ajusta sus movimientos al grupo cuando se lo indica su docente.", "Reconoce su propio lugar dentro de un espacio compartido.", "Explora variaciones de movimientos (rápido/lento, fuerte/suave, grande/pequeño, entre otros).", "Respeta consignas de movimiento que implican cercanía o distancia."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Exploración libre de las posibilidades del cuerpo y de la voz para expresar y/o comunicar emociones, sensaciones, ideas, entre otros.", "i": ["Emite sonidos y palabras variadas para acompañar su juego.", "Expresa emociones básicas (alegría, enojo, sorpresa, miedo) a través de gestos, movimientos y tonos de voz.", "Realiza movimientos corporales espontáneos (saltar, girar, rodar, agacharse) en distintas situaciones lúdicas.", "Usa el cuerpo y la voz para inventar acciones simples en el juego."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Exploración de las posibilidades expresivas del propio cuerpo y la voz y de los cuerpos y voces de sus compañeras/os, a partir del juego teatral.", "i": ["Imagina situaciones y las expresa en forma corporal y/o vocal.", "Imita y responde a gestos, movimientos o voces de sus compañeras/os.", "Experimenta con distintos tonos de voz, gestos y posturas para comunicar intenciones.", "Integra cuerpo y voz durante el juego teatral.", "Reconoce y valora las propuestas expresivas de otras/os en el juego grupal.", "Realiza movimientos y sonidos variados para expresar ideas o emociones en el juego."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Experimentación con diferentes elementos del lenguaje teatral (vestuario, utilería, escenografías, sonidos, iluminación).", "i": ["Crea ambientes teatrales con sonidos,vestuario,objetos y/o mobiliario y los explora desde el juego teatral.", "Se interesa por el uso de vestuario o accesorios que aportan al juego teatral.", "Transforma elementos para crear escenografías y emplea vestuarios que le permiten asumir roles.", "Interactúa con escenografías y sonidos como parte de la acción dramática.", "Utiliza objetos y materiales simples para representar acciones o personajes.", "Integra elementos materiales a la representación con intención lúdica y expresiva."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Desarrollo progresivo del uso consciente del cuerpo, la voz, los gestos, movimientos y silencios para expresarse.", "i": ["Usa el cuerpo y la voz de manera intencionada para comunicar.", "Realiza gestos y movimientos diferenciados para distintos personajes o situaciones.", "Modifica la intensidad de la voz en función de la consigna.", "Reconoce la importancia de los momentos de silencio y quietud dentro de la acción dramática."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Experimentación con diferentes elementos del lenguaje teatral, para la creación y representación de situaciones breves, con estructura dramática simple (inicio, desarrollo y cierre).", "i": ["Experimenta sobre el sentido que asumen los diferentes elementos del lenguaje teatral.", "Participa en la creación de escenas breves con un inicio y un final definidos.", "Utiliza vestuario, utilería, sonidos o escenografía para enriquecer una representación.", "Reconoce el valor de los recursos teatrales en la construcción de la escena."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Empleo del cuerpo y la voz de manera consciente para representar personajes o situaciones.", "i": ["Modifica intencionadamente postura, gestos y movimientos para asumir un personaje.", "Mantiene la coherencia expresiva de cuerpo y voz durante el juego teatral.", "Ajusta volumen, tono y ritmo de la voz de acuerdo con la situación o personaje.", "Utiliza recursos expresivos para diferenciar personajes o momentos de la acción."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Reconocer el cuerpo y la voz como herramientas de expresión y de comunicación, promoviendo la exploración de recursos expresivos básicos (cuerpo, voz, gesto, movimiento y uso del espacio, entre otros).", "a": "Integración consciente y compartida de recursos expresivos durante juegos teatrales con mayor estructura y organización.", "i": ["Participa en juegos teatrales grupales sosteniendo la acción de manera organizada.", "Coordina cuerpo, voz y movimientos con los de sus compañeras/os definiendo una estructura dramática básica (inicio,desarrollo y cierre).", "Ajusta sus intervenciones para integrarse a la dinámica colectiva.", "Reconoce y respeta reglas, turnos y tiempos del juego teatral."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Disfrute de juegos teatrales colectivos, reconociendo el tiempo y espacio compartido.", "i": ["Reconoce que el teatro se disfruta junto a otras/os, jugando y mirando en grupo.", "Reconoce que el juego teatral emociona: sorprende, entusiasma, alegra.", "Participa en rituales teatrales simples (saludar al público, esperar turno, aplaudir al final).", "Reconoce el espacio de juego y se integra con sus compañeras/os.", "Diferencia el juego solitario del juego compartido.", "Muestra alegría y disposición al interactuar en la dinámica compartida."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Valoración de la experiencia compartida, reconociendo logros individuales y grupales (a través de aplausos, comentarios o instancias de socialización de vivencias).", "i": ["Aplaude espontáneamente al finalizar la actuación de compañeras/os.", "Reconoce la participación de otros en el juego, señalando personajes o acciones.", "Expresa con palabras o gestos simples su disfrute de lo observado.", "Comparte brevemente su propia vivencia después del juego."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Representación de roles, tareas o situaciones propias de la vida cotidiana.", "i": ["Representa personajes o situaciones simples vinculadas al entorno cercano (familia, escuela, barrio).", "Imita tareas cotidianas del contexto.", "Reconoce los roles que asumen sus compañeras/os durante el juego.", "Utiliza gestos, movimientos y voz para diferenciar roles básicos (por ejemplo, vendedor, maestro, mamá/papá/ abuelo/abuela)."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Creación colectiva de escenas breves, dramatizaciones de cuentos, representación de canciones, entre otros.", "i": ["Propone situaciones teatrales y participa de la creación de producciones teatrales con sus pares.", "Mantiene el rol asignado durante la representación grupal.", "Coopera con compañeras/os en la distribución de personajes o tareas dentro de la escena.", "Aporta ideas sencillas para enriquecer la representación (un gesto, un objeto, una acción)."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Expresión de opiniones y emociones frente a lo visto o actuado (qué me gustó, qué me llamó la atención, entre otros).", "i": ["Comenta con frases simples lo que le gustó de lo visto o jugado.", "Se emociona con la experiencia (alegría, sorpresa, risa).", "Escucha y respeta las opiniones de otras/os durante la puesta en común.", "Señala algún detalle que le llamó la atención en la actuación propia o de compañeras/os."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Expectación, en caso de ser posible, de producciones teatrales (del ámbito oficial, independiente, comunitario, escolar, etc.) y valoración de estas.", "i": ["Amplía su repertorio imaginativo y cultural a partir de los espectáculos vistos y lo expresa en sus juegos y sus prácticas de oralidad.", "Expresa con palabras o gestos qué le gustó o llamó la atención.", "Manifiesta respeto por la experiencia de ser espectador (silencio, aplausos).", "Atiende y observa con interés una producción teatral externa o escolar.", "Reconoce personajes, escenas o situaciones representadas."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Participación activa en producciones colectivas, asumiendo roles y responsabilidades dentro del grupo.", "i": ["Crea situaciones de juego en pequeños grupos o con el grupo total, incorporando elementos simples del lenguaje teatral.", "Identifica en qué consisten los roles dentro de la experiencia grupal.", "Reflexiona sobre las producciones de creación colectiva.", "Colabora en la organización de escenas grupales con estructura definida (inicio, desarrollo y cierre).", "Elabora preguntas sobre los diversos roles."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Experimentar el teatro como hecho social y cultural, propiciando el disfrute de experiencias teatrales en sus distintas formas, promoviendo la valoración de la vivencia compartida del hecho teatral y la participación en producciones de creación colectiva.", "a": "Elaboración de reflexiones críticas simples sobre los espectáculos teatrales vistos o sobre las producciones del grupo.", "i": ["Comenta diversos aspectos de la producción observada (“me gustó porque…”, “fue aburrido cuando…”).", "Escucha y respeta las opiniones de compañeras/os durante la instancia de reflexión.", "Señala aspectos que podrían mejorar o cambiar en la actuación o puesta en escena.", "Expresa emociones y pensamientos vinculados con lo que vio o representó."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Manipulación de objetos y materiales diversos, descubriendo movimientos, sonidos y texturas.", "i": ["Muestra curiosidad e iniciativa al explorar materiales con diferentes movimientos, presiones y ritmos.", "Comparte con otros sus hallazgos, observando o imitando las exploraciones de sus pares.", "Manipula objetos de distintos tamaños, formas y texturas, variando su uso y descubriendo efectos sonoros o visuales.", "Reconoce diferencias entre materiales (livianos, pesados, blandos, rígidos, entre otros) relacionando estas cualidades con las posibilidades de movimiento.", "Acompaña sus acciones con sonidos, onomatopeyas o gestos, manifestando disfrute y atención."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 3, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Exploración de diversas formas de manipular objetos, muñecos o títeres con intención expresiva, articulando acciones, gestos y voz.", "i": ["Sostiene la atención en el objeto o títere mientras lo manipula.", "Utiliza la voz para acompañar las acciones de los personajes, diferenciando tonos, intensidades o emociones.", "Articula gestos y sonidos para representar acciones (caminar, saludar, esconderse, dormir, entre otros).", "Responde a consignas lúdicas que implican animar o transformar objetos en personajes."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Coordinación de cuerpo, mirada y voz para mantener la atención sobre el personaje que anima.", "i": ["Mantiene la concentración en el personaje o títere durante las secuencias de animación.", "Varía el tono, la velocidad o la intensidad de la voz según la acción o emoción representada.", "Sincroniza gestos, movimientos y voz para reforzar la intención expresiva del personaje.", "Demuestra disfrute y compromiso al participar en juegos teatrales que implican animar y observar.", "Orienta su cuerpo y su mirada hacia el público o sus compañeras/os, sosteniendo la atención compartida."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 4, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Reconocimiento de la posibilidad del títere u objeto de contar historias o representar historias cotidianas y/o fantásticas.", "i": ["Identifica personajes y situaciones presentes en las dramatizaciones con títeres u objetos.", "Participa en la creación de escenas que relatan hechos cotidianos o imaginarios.", "Propone acciones o diálogos para continuar o transformar las historias representadas.", "Explica con sus palabras lo que el títere “hace”, “dice” o “siente”, mostrando comprensión narrativa."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Diseño y animación de personajes elaborados con distintos materiales, explorando la relación entre forma y movimiento.", "i": ["Selecciona y combina materiales para crear personajes, observando cómo su forma condiciona los movimientos posibles.", "Participa activamente en la construcción y animación de personajes.", "Muestra autonomía y disfrute en la experimentación con materiales, texturas y colores como parte del proceso creativo.", "Explora distintas maneras de manipular los personajes, variando ritmo, dirección y energía del movimiento.", "Identifica correspondencias entre las características del personaje y su forma de desplazarse, hablar o actuar."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Integración de voz, gesto y desplazamiento en la animación de personajes, sosteniendo la ilusión escénica y comunicando intenciones, emociones o acciones con claridad.", "i": ["Coordina cuerpo, mirada y voz para mantener la atención sobre el personaje durante la representación.", "Sostiene la continuidad del personaje durante breves secuencias escénicas, evitando distracciones.", "Utiliza variaciones de tono, volumen y ritmo para comunicar emociones o intenciones del personaje.", "Demuestra comprensión de la relación entre intérprete, personaje y espectador, disfrutando del intercambio teatral.", "Desplaza el personaje en el espacio escénico de manera coherente con la acción representada."]}, {"c": "Educación Artística", "s": "Teatro", "sala": 5, "m": "Explorar el teatro de títeres, sombras y objetos como forma de expresión lúdica, atribuyendo voz, movimiento e intención a materiales y personajes para comunicar emociones, ideas y situaciones cotidianas.", "a": "Exploración de técnicas o modos de actuación mixtas en el juego dramático.", "i": ["Combina diferentes técnicas o modos de actuación en el juego dramático.", "Participa en juegos escénicos que combinan actuación con títeres, sombras u objetos.", "Selecciona las técnicas o modos de actuación de su preferencia e indaga particularmente en las que son de su interés.", "Reconoce la posibilidad de mezclar recursos para ampliar la expresión."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de su corporeidad y de las posibilidades de movimiento, en prácticas corporales que involucren el cuidado de sí mismo/a y el reconocimiento de la diversidad de los cuerpos.", "i": ["Reconoce las partes y lados del cuerpo en acciones motrices globales.", "Percibe cambios corporales y sensaciones vinculadas con el reposo o la realización de prácticas corporales, como ritmos cardiacos y respiratorios, fatiga, calor, transpiración, sed, entre otras.", "Identifica las partes íntimas del cuerpo y su cuidado durante prácticas corporales en interacción con otras personas.", "Manifiesta corporalmente su propio ritmo, como forma natural y espontánea de moverse.", "Reconoce las diferencias entre los distintos cuerpos y respeta la diversidad corporal, en actividades motrices compartidas.", "Descubre algunas capacidades motoras involucradas en acciones globales y segmentarias, durante la resolución de situaciones motrices.", "Reconoce pautas de cuidado/protección y se familiariza con hábitos saludables, durante las actividades motrices."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de la motricidad y sus posibilidades corporales, a través de acciones globales locomotrices.", "i": ["Ajusta su marcha de acuerdo con el espacio y la presencia de obstáculos.", "Descubre diferentes formas de trasladar objetos (como empujar, rodar, arrastrar o cargar en juegos y tareas).", "Experimenta desplazamientos mediante saltos, gateos, cuadrupedias, reptaciones, galopes, entre otros movimientos.", "Descubre el control global en la secuenciación de dos acciones motoras, con ayuda o por imitación, durante la resolución de juegos y tareas.", "Vivencia diferentes formas de saltos, varía apoyos y controla la caída."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de la motricidad y sus posibilidades corporales, a través de acciones globales no locomotrices.", "i": ["Participa en tracciones, con objetos de distinto peso/tamaño, y ajusta la fuerza y la postura corporal.", "Explora espontáneamente movimientos, como extensión y flexión del cuerpo, en diferentes juegos o situaciones cotidianas.", "Vivencia distintas formas de suspensiones y balanceos, en diversos planos de movimiento y con materiales variados."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de la motricidad y sus posibilidades corporales, a través de acciones globales manipulativas.", "i": ["Descubre la coordinación visomotora (óculo-manual) y la prensión en actividades motrices, y diferencia progresivamente los movimientos de manos y dedos durante el juego.", "Participa en prácticas ludomotrices en las que lanza objetos variados, con una y ambas manos.", "Atrapa elementos grandes y livianos, en situaciones de juego sin desplazamiento, con distintas partes del cuerpo.", "Experimenta situaciones ludomotrices que implican patear y golpear elementos variados con diferentes partes del cuerpo."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de la motricidad y sus posibilidades, en situaciones motrices que comprometan el equilibrio y el control corporal.", "i": ["Vivencia posturas (sentarse, pararse, acostarse, otras) y formas de equilibrio.", "Experimenta apoyos alternados de manos y pies, rodadas laterales y rolidos asistidos.", "Descubre el control corporal en movimientos, giros y vueltas espontáneas."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de la motricidad y sus posibilidades, en situaciones motrices que impliquen la temporalidad y la espacialidad.", "i": ["Experimenta nociones como adentro-afuera, arriba-abajo, adelante-atrás a través de acciones motrices globales, en diferentes situaciones de juego.", "Vivencia nociones como rápido-lento, fuerte-débil y diferencia la duración de algunas acciones motoras, en situaciones ludomotrices."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Reconocimiento y comunicación de sentimientos a través de palabras, gestos y movimientos creativos, en prácticas corporales ludomotrices.", "i": ["Expresa, a través de palabras (como triste, feliz, enojada/o) y gestos, sentimientos y estados de ánimo vivenciados durante situaciones ludomotrices.", "Resuelve creativamente algunas situaciones motrices con ayuda, iniciándose en su autonomía y autoconfianza.", "Participa en juegos o propuestas en las que representa diferentes emociones con el cuerpo (moverse como si estuviera asustada/o, contenta/o, enojada/o).", "Explora y comparte movimientos que le generan placer y disfrute del propio cuerpo, en propuestas lúdicas y motrices."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Reconocimiento de la corporeidad y sus posibilidades de movimiento, con diferenciación progresiva de partes, zonas y lados del cuerpo, con acciones de cuidado de sí misma/o y de las/os otras/os y respeto por la diversidad corporal, en un marco de hábitos y prácticas saludables.", "i": ["Identifica las partes del cuerpo y sus características, (formas, relieves, tamaños, partes duras y blandas), así como las zonas íntimas y su cuidado, poniendo en práctica el respeto por sí misma/o y por las/os demás.", "Observa cambios corporales y sensaciones propias y de las/os demás, vinculadas con el reposo o durante la realización de prácticas corporales, por ejemplo, ritmos cardíacos y respiratorios, fatiga, calor, transpiración, sed, entre otras.", "Vivencia la lateralidad en diferentes acciones motrices y descubre su predominancia lateral.", "Diferencia acciones motrices que implican control corporal, como movilidad-quietud, tensión-relajación, flexión-extensión, rapidez-lentitud.", "Respeta la diversidad en las formas y posibilidades de movimiento, durante actividades grupales.", "Percibe variaciones en el ritmo propio e intensidad, en diferentes propuestas.", "Pone en práctica hábitos saludables y pautas de cuidado y protección, de sí misma/o y de las/os demás, durante las actividades motrices.", "Reconoce algunas capacidades motoras, involucradas durante la resolución de situaciones motrices."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Experimentación de la motricidad y su disponibilidad, a través de habilidades locomotrices, en interacción con otra/o.", "i": ["Afianza la coordinación entre brazos y piernas en la marcha y la carrera, según el espacio y/o la presencia de obstáculos, en situaciones de juego.", "Traslada y/o conduce diversos objetos con diferentes partes del cuerpo, de forma individual o con una/un compañera/o, y ajusta progresivamente sus movimientos.", "Vivencia desplazamientos con cambios de dirección, mediante saltos, gateos, cuadrupedias, reptaciones, galopes entre otros movimientos.", "Vivencia la combinación de dos acciones motoras, de forma individual y con otra/o, según el orden y la secuencia de movimientos.", "Participa en juegos con diferentes formas de salto, ajuste de apoyos, direcciones y control del equilibrio, durante acciones compartidas."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Reconocimiento de la motricidad y su disponibilidad, a través de habilidades no locomotrices, en interacción con otra/o.", "i": ["Comparte acciones de tracción y empuje con otras/os, con ajuste de la fuerza y la postura corporal, para resolver diferentes situaciones motrices.", "Realiza movimientos de extensión y flexión del cuerpo, con mayor control y coordinación, adaptándolos a juegos o al uso de objetos.", "Experimenta formas de suspensión y balanceo, en forma individual y con otras/os, en distintos planos de movimiento y con variedad de materiales."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Construcción de la motricidad y su disponibilidad, a través de habilidades manipulativas, en interacción con otra/o.", "i": ["Participa, con otras/os, en juegos que implican prensión de diferentes objetos y coordinación óculo-manual, acorde a la acción y a sus compañeras/os.", "Explora lanzamientos de distintos objetos, con una y otra mano, en forma individual y con otras/os, hacia diferentes direcciones, e identifica progresivamente su predominancia lateral.", "Patea o golpea objetos con diferentes partes del cuerpo, con ajuste de la dirección, la fuerza y el tipo de movimiento, al espacio y a la situación de juego.", "Pone en práctica pases con compañeras/os, en situaciones con y sin desplazamiento, y explora el autopase, con ajuste progresivo de la coordinación visual y corporal."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Adaptación de su disponibilidad motriz, a través de acciones motrices que comprometan el equilibrio y control corporal, en interacción con otra/o.", "i": ["Ajusta posturas corporales y resuelve situaciones problemáticas de equilibrio y reequilibrio mediante la variación de apoyos", "Coordina apoyos alternados de manos y pies, rodadas laterales y rolidos asistidos, en planos inclinados y/o horizontales, en situaciones lúdicas compartidas.", "Realiza giros y vueltas, en uno y otro sentido, con equilibrio y control corporal, en situaciones lúdicas compartidas."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Adaptación de sus movimientos a nociones espaciales y temporales, en acciones motoras con otra/o.", "i": ["Identifica nociones espaciales como cerca-lejos, agrupados-dispersos, adentro-afuera, arriba-abajo y adelante-atrás, en juegos y tareas junto con otra/o.", "Diferencia nociones temporales como antes, durante o después, y de corta o larga duración, en juegos y acciones motrices compartidas."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Identificación y comunicación de sentimientos propios y de otras/os, a través de palabras, gestos y movimientos creativos, con autonomía y confianza, en prácticas corporales ludomotrices.", "i": ["Expresa sentimientos, lo que le gusta y lo que no, mediante palabras y posturas corporales.", "Resuelve situaciones motrices y avanza en su autonomía y autoconfianza.", "Reconoce y nombra emociones propias y ajenas, en situaciones ludomotrices.", "Crea gestos, posturas y movimientos corporales, y comparte con otras/os el disfrute del cuerpo, en propuestas lúdicas y motrices"]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Construcción de su corporeidad, a partir del afianzamiento de la conciencia corporal y de las posibilidades de movimiento, lo que le permite diferenciar partes, zonas y lados del cuerpo y reconocer la diversidad corporal, en un marco de hábitos y prácticas saludables, en interacción con otras/os.", "i": ["Nombra las partes del propio cuerpo y sus características, con reconocimiento de semejanzas y diferencias respecto de las demás personas, en situaciones ludomotrices.", "Diferencia acciones motrices que implican control corporal (movilidad-quietud, tensión-relajación, flexión-extensión, rapidez-lentitud, dinámicas-estáticas), y se inicia en la descripción de sus efectos en el propio cuerpo y en el de las/os demás.", "Distingue y verbaliza la predominancia lateral y los lados del cuerpo, propios y de otras/os.", "Reconoce y ajusta su ritmo corporal a estímulos externos como la música, el grupo, entre otros.", "Reconoce y diferencia interacciones físicas adecuadas e inadecuadas, se apropia de hábitos saludables y prácticas de cuidado del cuerpo que respetan la intimidad propia y la de las/os demás, tanto en situaciones lúdicas como cotidianas.", "Amplía su alfabetización motriz, al poner en juego capacidades motoras (fuerza, velocidad, flexibilidad, resistencia, coordinación), ajustando su participación a las demandas del juego y de las/os demás.", "Describe los cambios corporales y las sensaciones que se producen, en sí misma/o y en las/os demás, en movimiento o en reposo, durante o después de las actividades motrices."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Exploración de habilidades locomotrices combinadas, secuenciadas y/o simultáneas con otras acciones motrices, en interacción con otras/os.", "i": ["Realiza la marcha y la carrera, con dominio y fluidez, en diferentes direcciones y velocidades (incluída la detención), anticipa recorridos y modifica según el espacio, los obstáculos y la interacción con otras/os.", "Ajusta sus movimientos al traslado y/o conducción de objetos, junto con otras/os, con control progresivo, precisión y direccionalidad, en juegos y tareas compartidas.", "Construye secuencias de dos o más acciones motrices, con fluidez y control progresivo, en interacción con otras/os.", "Experimenta desplazamientos variados y sus combinaciones (saltos, gateos, cuadrupedias, reptaciones, galopes y otros), en diferentes situaciones motrices compartidas.", "Inicia la combinación de saltos y apoyos, para resolver diversas situaciones ludomotrices, en interacción con otras/os."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Construcción de su disponibilidad motriz a través de la exploración de habilidades no locomotrices, combinadas, secuenciadas y/o simultáneas con otras acciones motrices, y en interacción con otras/os.", "i": ["Acuerda, con compañeras/os, acciones para resolver situaciones que implican empujar y traccionar objetos de distinto peso, tamaño y medida.", "Integra movimientos de extensión y flexión del cuerpo, en secuencias corporales con ajuste de la fuerza, el espacio y el tiempo, según la situación.", "Experimenta la regulación del equilibrio y la fuerza, en acciones que implican la secuenciación y el balanceo, con distintos aparatos y objetos en planos horizontales, verticales, oblicuos."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Integración de acciones motrices que involucren la experimentación de habilidades manipulativas, combinadas y secuenciadas, e incorporación progresiva de la simultaneidad, en interacción con otras/os.", "i": ["Explora la coordinación visomotora y el control de la prensión en situaciones ludomotrices que requieren el uso de objetos (lanzar, recibir, construir, encestar, ubicar), en vínculo con otras/os y con el entorno.", "Vivencia lanzamientos con una y otra mano, y con diversos objetos, afianza su predominancia lateral y ajusta la fuerza, la dirección y la intención, en situaciones ludomotrices con otras/os.", "Patea y golpea, con control y precisión, y ajusta la fuerza/la dirección en función del objeto, el espacio, el objetivo y la interacción con otras/os.", "Integra formas de recepción con diferentes objetos y el autopase, y ajusta sus movimientos a las trayectorias y acciones de otras/os, en situaciones ludomotrices."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Combinación de posturas, apoyos y giros, que permitan anticipar y resolver situaciones de equilibrio y control corporal, en interacción con otras/os.", "i": ["Establece y adopta diferentes posturas y sus combinaciones corporales, adecuándolas a diversas situaciones motrices compartidas.", "Realiza rolidos hacia adelante, en forma global y en plano horizontal, y explora el rolido hacia atrás en plano inclinado.", "Combina giros y vueltas, en uno y otro sentido, con equilibrio y control corporal, en situaciones lúdicas y en interacción con otras/os."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Adecuación de sus acciones motrices al espacio compartido, tiempo del juego y a las acciones de otras/os, con precisión y anticipación.", "i": ["Emplea y expresa nociones de adentro-afuera, arriba-abajo y adelante-atrás, e incorpora otras como cerca-lejos y agrupadas/os-dispersas/os, con ajuste de sus movimientos al contexto de la situación motriz, en interacción con otras/os.", "Diferencia nociones de antes-durantedespués, continua-discontinua, en la duración de juegos y acciones motrices compartidas.", "Establece y respeta límites personales y del espacio compartido, en sus interacciones motrices con otras/os.", "Interpreta la duración, las trayectorias y las velocidades de las acciones motrices, tanto en sus propios desplazamientos, como en los de otras/os, y en el movimiento de objetos."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Reconocer el propio cuerpo, identificar sus partes, lados y posibilidades motrices, integrando nociones espaciales, temporales y objetales, en prácticas corporales que involucren hábitos saludables y de cuidado de sí misma/o y de las/os demás", "a": "Comunicación autónoma y creativa de sentimientos propios y de otras/os, a través del lenguaje, gestos y el movimientos, en prácticas corporales ludomotrices.", "i": ["Expresa, verbal y corporalmente, los sentimientos generados en diferentes situaciones ludomotrices y reflexiona sobre ellos, en un clima de confianza.", "Resuelve situaciones motrices de manera creativa, consolida su autonomía y autoconfianza, y respeta el propio proceso y el de las/os demás.", "Aporta y recibe ideas, opiniones, propuestas, escuchando y aceptando las de otras/os, en un clima emocional de apoyo, en situaciones ludomotrices.", "Organiza y ajusta, creativamente, gestos, posturas y movimientos, con conciencia corporal y control motriz,y disfrutando del cuerpo en situaciones ludomotrices, tanto individuales como compartidas."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Exploración de diversas prácticas corporales ludomotrices, que permitan conocer el juego y sus elementos constitutivos del juego.", "i": ["Vivencia distintos tipos de juegos, individuales y en pequeños grupos, su finalidad y sus elementos básicos (por ejemplo, de persecución, de organización simple, de reacción, de habilidades motoras, de imitación, con diferentes organizaciones espaciales, entre otros).", "Asocia e imita roles en los juegos en los que participa.", "Identifica la posibilidades que ofrecen diferentes materiales/espacios y crea/recrea juegos motores.", "Explora prácticas ludomotrices que contemplan particularidades sociales, culturales y geográficas, del contexto en el que vive.", "Diferencia juego libre y juego reglado, reconoce las reglas propias de cada juego, y acepta su importancia y sostenimiento."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Exploración de actitudes y modos de involucrarse (jugar), en prácticas ludomotrices, y de su influencia en la construcción y resignificación de la propia corporeidad.", "i": ["Identifica acuerdos de convivencia para resolver conflictos vinculares, respetar y cuidar de sí misma/o en diferentes juegos.", "Reconoce la presencia de otras/os compañeras/os en el espacio compartido.", "Participa activamente de las propuestas y avanza en su autonomía, al interactuar y comunicarse con las/os demás.", "Se inicia en la resolución de problemas que se presentan en los juegos, con intervención docente."]}, {"c": "Educación Física", "s": null, "sala": 3, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Descubrimiento de la corporeidad, a través de prácticas que favorecen la expresión y la comunicación corporal.", "i": ["Representa, corporal y motrizmente, imágenes, melodías, cuentos, en el desarrollo de juegos expresivos.", "Explora formas de comunicar diferentes mensajes, a partir de gestos, posturas y dramatizaciones.", "Corporiza ideas y emociones, en diferentes situaciones de juego.", "Improvisa e inventa movimientos rítmicos expresivos, que permiten el reconocimiento y disfrute del cuerpo como medio de expresión."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Participación activa en diversas prácticas corporales ludomotrices compartidas, con reconocimiento de reglas, roles, materiales y espacios que componen los juegos.", "i": ["Se involucra en prácticas ludomotrices de complejidad creciente y avanza en propuestas grupales, cooperativas y regladas (de persecución, de organización simple y compleja, masivo, por bando, con refugios; con roles diferenciados, tradicionales, de ocultamiento, entre otras).", "Asume diferentes roles en los juegos.", "Colabora en la organización del espacio.", "Participa en la construcción de juegos con materiales no convencionales.", "Reconoce las propias posibilidades de acción y las de otras/os, a partir de la exploración de diferentes formas de moverse e interactuar con el espacio y las/os pares, en prácticas ludomotrices variadas.", "Conoce prácticas ludomotrices compartidas que contemplan particularidades sociales, culturales y geográficas, propias del contexto en el que vive.", "Crea y respeta reglas básicas propias de cada juego, y reconoce la importancia de su sostenimiento."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Participación en diversas prácticas ludomotrices que permitan la identificación de actitudes y modos de jugar, y pongan en práctica la resolución de desafíos y la interacción con las/os demás.", "i": ["Reconoce y participa en la construcción de acuerdos de convivencia que permiten resolver conflictos vinculares, respetar y cuidar el propio cuerpo y el de sus compañeras/os, en juegos compartidos.", "Valora a la/al otra/o como compañera/o de juego, reconoce las diferencias, y contribuye a que todas/os participen activamente.", "Participa en las propuestas, con creciente autonomía y mayor sentido colaborativo.", "Participa en espacios de reflexión sobre lo vivenciado en el juego.", "Resuelve, con o sin mediación docente, situaciones que implican analizar su propio accionar y el de otras/os, y reconoce la importancia de respetar las reglas para sostener el juego."]}, {"c": "Educación Física", "s": null, "sala": 4, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Participación activa en prácticas corporales expresivas y comunicativas con otras/os, y reconocimiento progresivo del cuerpo como medio de expresión, comunicación y disfrute.", "i": ["Improvisa y experimenta juegos expresivos con otras/os, a partir de cuentos, melodías, imágenes, entre otras posibilidades.", "Realiza movimientos corporales a partir de ritmos musicales.", "Reproduce y crea movimientos rítmicos expresivos, que le permitan reconocer y disfrutar del cuerpo como medio de expresión.", "Identifica, corporiza y expresa ideas y sentimientos, en diferentes situaciones de juego.", "Comunica, a partir de gestos, posturas y dramatizaciones, diferentes mensajes."]}, {"c": "Educación Física", "s": null, "sala": 5, "m": "Participar activamente en diversas prácticas ludomotrices y expresivas, desarrollando la creatividad y la resolución de problemas, y reconocer la importancia de la norma, así como de la presencia de la/del otra/o, como partícipe necesaria/o para jugar.", "a": "Reconocimiento y comprensión de prácticas ludomotrices que integren reglas, roles, acuerdos, y el uso creativo de los materiales y espacios compartidos.", "i": ["Diferencia distintos tipos de juegos (rondas, persecución, puntería, entre otros) y sus características, con apoyo docente.", "Reflexiona sobre los roles que asume en el juego y propone nuevos, de manera flexible, creativa y libre de estereotipos de género, adaptándolos a sus necesidades e intereses.", "Reconoce la finalidad de los juegos, por ejemplo, correr, esconderse, cooperar, lanzar, entre otras.", "Utiliza creativamente el espacio y materiales convencionales y no convencionales, para enriquecer las situaciones de juego.", "Reflexiona sobre el sentido de las reglas, las crea y/o modifica con sus pares.", "Participa activamente en prácticas ludomotrices, en interacción con las/os otras/os, y reconoce las particularidades sociales, culturales y ge const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9);
const lc1 = s=>s? s.charAt(0).toLowerCase()+s.slice(1) : '';
const uc1 = s=>s? s.charAt(0).toUpperCase()+s.slice(1) : '';
const noDot = s=>String(s||'').trim().replace(/[.\s]+$/,'');
const sentence = s=>{s=String(s||'').trim(); if(!s) return ''; s=uc1(s); return /[.!?…]["»”]?$/.test(s)? s : s+'.';};
const joinY = a=>a.length<2? (a[0]||'') : a.slice(0,-1).join(', ')+' y '+a[a.length-1];
const hash = s=>{let h=0;for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const etapaTxt = e=> String(e)==='2'? 'segunda' : 'primera';
function art(a){const w=(a||'').split(/\s/)[0].toLowerCase(); if(/os$/.test(w)) return 'los'; if(/as$/.test(w)) return 'las'; return /(ción|sión|ura|dad|ncia|ía|tud|ión)$/.test(w)?'la':(/o$/.test(w)?'el':'la');}
function corto(a){ const t=noDot(a), i=t.indexOf(', '); return i>=40? t.slice(0,i) : t; }
function contracciones(t){ return t.replace(/\ba el\b/g,'al').replace(/\bde el\b/g,'del'); }
function genero(txt,g){ txt=String(txt||''); if(g!=='f'&&g!=='m') return txt; return txt.replace(/\b(\w+?)(ada|ida|sma|ola)\/o\b/gi,(m,r,e)=> g==='f'? r+e : r+e.slice(0,-1)+'o'); }
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2200);}
async function copiar(text){ if(!text){toast('No hay texto para copiar');return;} try{await navigator.clipboard.writeText(text);toast('Copiado. Ya podés pegarlo en CiDi');}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){} ta.remove(); toast(ok?'Copiado. Ya podés pegarlo en CiDi':'Seleccioná el texto y copialo a mano');}}

function normal(s){ s.sel=s.sel||{}; s.ev=s.ev||{}; s.txt=s.txt||{}; for(const e of ['1','2']){ s.sel[e]=s.sel[e]||{}; s.ev[e]=s.ev[e]||{}; s.txt[e]=s.txt[e]||{}; } s.alumnos=s.alumnos||[]; s.notas=s.notas||[]; s.sem=s.sem||{}; s.cal=s.cal||[]; if(!s.horas||!s.horas.length) s.horas=HORAS_BASE.map(h=>({id:'h'+uid(),h})); s.rol=s.rol||'sala'; s.saludo=s.saludo||{}; s.rev=s.rev||{}; for(const e of ['1','2']){ if(s.saludo[e]==null) s.saludo[e]=''; s.rev[e]=s.rev[e]||{}; } return s; }

const evOf = (s,e,aprId,alId)=> ((s.ev[e]||{})[aprId]||{})[alId];
function aprsArea(s,a){ const A=AREA[a]; return CUR.filter(o=>o.sala==s.edad && o.c===A.c && (!A.sub||o.s===A.sub)); }
function estadoArea(s,e,al,a){ const L=lista(s,e,a); if(!L.length) return 0; const n=L.filter(x=>evOf(s,e,x.id,al.id)?.n).length; return n===0?0:(n===L.length?2:1); }

/* ---------- texto del informe ---------- */
function borrador(s,e,al,a){
  const out=[], dichos=new Set(); let i=0;
  for(const x of lista(s,e,a)){
    const o=CUR_BY_ID[x.id], v=evOf(s,e,x.id,al.id); if(!v||!v.n) continue;
    const L=NIV[v.n], h=hash(al.id+o.id);
    let sen=L.t[h%L.t.length].replace('{X}', art(o.a)+' '+lc1(corto(o.a)));
    const nuevosT=temasDe(x).filter(t=>t.trim()&&!dichos.has(t)); nuevosT.forEach(t=>dichos.add(t));
    if(nuevosT.length) sen+=', en el marco de '+noDot(joinY(nuevosT));
    sen = i===0? al.nombre+(sen.startsWith('con ')?', ':' ')+sen : CONECT[(h+i)%CONECT.length]+sen;
    out.push(contracciones(sentence(sen)));
    if(v.obs && v.obs.trim()) out.push(sentence(genero(v.obs,al.g)));
    i++;
  }
  return out.join(' ');
}
function saludoPara(s,e,al){ return String((s.saludo||{})[e]||'').split('[NOMBRE]').join(al.nombre).trim(); }
function textoDe(s,e,al,a){ const t=((s.txt[e]||{})[al.id]||{})[a]; return t&&t.edit? t : {t: a==='obs'? saludoPara(s,e,al) : borrador(s,e,al,a), edit:false}; }
function setTexto(s,e,al,a,t,ia){ const T=s.txt[e]; (T[al.id]=T[al.id]||{})[a]={t,edit:true,ia:!!ia,ts:Date.now()}; persist(); }
function resetTexto(s,e,al,a){ const T=s.txt[e][al.id]; if(T) delete T[a]; persist(); }

const ST={mode:'local', db:null, uid:null, timer:null, chain:Promise.resolve(), sample:null, listo:false};
function setStatus(t,err){ const el=$('#status'); el.textContent=t; el.className='status'+(err?' err':''); }
function persist(){ clearTimeout(ST.timer); setStatus('Guardando…'); ST.timer=setTimeout(()=>{ ST.chain=ST.chain.then(escribir).catch(()=>{}); },800); }
async function escribir(){
  try{
    if(ST.mode==='db'){
      const col=ST.db.collection('data/users/'+ST.uid), quedan=new Set(Object.keys(S.salas));
      for(const id of quedan){ const {txt,...resto}=S.salas[id]; await col.doc('v2s-'+id).set(resto); await col.doc('v2t-'+id).set({txt:txt||{}}); }
      for(const id of (ST.borrar||[])){ await col.doc('v2s-'+id).delete(); await col.doc('v2t-'+id).delete(); }
      ST.borrar=[];
      setStatus('Guardado');
    } else {
      localStorage.setItem('informes-sala-v2', JSON.stringify(S));
      setStatus('Guardado en este navegador');
    }
  }catch(e){ setStatus('No se pudo guardar', true); }
}
window.addEventListener('pagehide',()=>{ if(ST.timer){ clearTimeout(ST.timer); ST.timer=null; escribir(); } });
function cargarLocal(){ try{ const x=JSON.parse(localStorage.getItem('informes-sala-v2')||'null'); if(x&&x.salas) return x; }catch(e){} return null; }
const descargaLocal={ save: async ({filename,data})=>{ const url=URL.createObjectURL(data), a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); } };
async function iniciarGuardado(){
  if(!window.claude?.use){ ST.listo=true; ST.downloads=descargaLocal; setStatus(Object.keys(S.salas).length?'Guardado en este navegador':''); render(); return; }
  const [user,db,sample,downloads]=await Promise.all(['user','db','sample','downloads'].map(n=>window.claude.use(n).catch(()=>null)));
  ST.sample=sample; ST.downloads=downloads;
  let id=null; try{ id=user? await user.id() : null; }catch(e){}
  if(db&&id){
    ST.mode='db'; ST.db=db; ST.uid=id;
    try{
      const snap=await db.collection('data/users/'+id).get(), salas={}, txts={};
      snap.docs.forEach(d=>{ const b=d.data(); if(d.id==='v2prefs'){ Object.assign(PREF,{tema:b.tema||PREF.tema,letra:b.letra||PREF.letra,nombre:b.nombre??PREF.nombre,efem:b.efem??PREF.efem,memoria:Array.isArray(b.memoria)?b.memoria:(PREF.memoria||[])}); aplicarPref(); try{localStorage.setItem('cuaderno-pref',JSON.stringify(PREF))}catch(e){} } else if(d.id.startsWith('v2s-')) salas[d.id.slice(4)]=b; else if(d.id.startsWith('v2t-')) txts[d.id.slice(4)]=b.txt; });
      if(Object.keys(salas).length){
        for(const k in salas){ salas[k].txt=txts[k]||{}; normal(salas[k]); }
        const pref=(()=>{try{return localStorage.getItem('informes2-actual')}catch(e){return null}})();
        S={salas, actual: salas[S.actual]? S.actual : (salas[pref]? pref : Object.keys(salas)[0])};
        UI.pantalla=null; setStatus('Guardado');
      } else if(Object.keys(S.salas).length){ persist(); }
      else setStatus('');
    }catch(e){ setStatus('No se pudieron leer tus datos', true); }
  } else setStatus(Object.keys(S.salas).length?'Guardado en este navegador':'');
  ST.listo=true; render();
}

  if(UI.sec==='metas') return arriba + vMetas(s);
  if(UI.sec==='proyectos') return arriba + vProyectos(s);
  if(UI.sec==='diag') return arriba + vDiag(s);
  if(UI.sec==='notas') return arriba + vNotas(s,e);

function segEtapa(e){ return `<div class="mode etapa" role="group" aria-label="Etapa del informe"><button type="button" data-etapa="1" aria-pressed="${e==='1'}">Primera etapa</button><button type="button" data-etapa="2" aria-pressed="${e==='2'}">Segunda etapa</button></div>`; }
function progreso(s,e,al){ return areasDe(s).filter(a=>textoDe(s,e,al,a.k).t.trim()).length; }
function revDe(s,e,al){ return ((s.rev||{})[e]||{})[al.id]||{c:[],ok:false}; }
function marcaLado(s,e,al){ return revDe(s,e,al).ok? '✓ revisado' : progreso(s,e,al)+'/'+areasDe(s).length; }
function pillArea(s,e,al,a){

    ${(()=>{const L=proyectosCal(s,a,ET()); return L.length?`<div class="chips" style="margin-top:6px"><span class="small muted">De tu calendario:</span>${L.map(x=>`<button type="button" class="chip" data-pcal="${esc(x.t)}">${esc(x.t)}</button>`).join('')}</div>`:'';})()}

function desdeMetas(s,e,a){

  const P=planDe(s), M=mesesArea(s,a), ya=new Set(lista(s,e,a).map(x=>x.id));

}

async function mejorar(s,e,al,a,signal){
  const {text}=await ST.sample(promptArea(s,e,al,a),{signal,cache:false});
  let t=sinEvitar(text.trim().replace(/^["«]|["»]$/g,'').split('[NOMBRE]').join(al.nombre)).replace(/\s*\n+\s*/g,' ');
  if(t.length>LIMITE) t=t.slice(0,LIMITE);
  setTexto(s,e,al,a,t,true);
}
async function iaUno(alId,a){
  const s=cur(), e=ET(), al=s.alumnos.find(x=>x.id===alId);
  if(IA.ocupado||!al) return;
  if(!estadoArea(s,e,al,a)){ toast('Primero marcá cómo le fue en algún aprendizaje'); return; }
  IA.ocupado=true; IA.actual=alId+a; render();
  try{ await mejorar(s,e,al,a); toast('Listo, revisá el texto'); }catch(err){ if(err?.code!=='cancelled') toast(errIA(err)); }
  IA.ocupado=false; IA.actual=null; render();
}
async function iaLote(pares){
  const s=cur(), e=ET();
  pares=pares.filter(([al,a])=>estadoArea(s,e,al,a));
  if(!pares.length){ toast('Todavía no hay desempeños marcados'); return; }
  IA.ocupado=true; IA.lote=true; IA.hechos=0; IA.total=pares.length; IA.ctl=new AbortController(); render();
  for(const [al,a] of pares){
    if(IA.ctl.signal.aborted) break;
    IA.actual=al.id+a;
    try{ await mejorar(s,e,al,a,IA.ctl.signal); }
    catch(err){ if(err?.code==='cancelled') break; if(['not_granted','rate_limited','sampling_disabled','session_expired'].includes(err?.code)){ toast(errIA(err)); break; } }
    IA.hechos++; render();
  }
  IA.ocupado=false; IA.lote=false; IA.actual=null; render(); toast('Listo, revisá cada texto antes de cargarlo');
}

function micToggle(){
  if(REC){ micParar(); return; }
  if(!SR){ toast('Este navegador no permite dictar. Probá con Chrome.'); return; }

    const v=(base?base+' ':'')+(f+it).trim(); UI.chatDraft=(base?base+' ':'')+f.trim(); const ta=$('#chatIn'); if(ta){ ta.value=v; ta.scrollTop=ta.scrollHeight; } };

  rec.onend=()=>{ const ta=$('#chatIn'); UI.chatDraft= rec._desc? '' : (((base?base+' ':'')+fin).trim() || (ta?ta.value:'')); REC=null; render(); chatScroll(); };

function guardarChat(key){ const s=cur(); if(!s||!CH[key]) return; s.chats=s.chats||{}; const ar=key.startsWith('area|'); s.chats[key]={ts:Date.now(), ...(ar&&CH[key].al?{al:CH[key].al}:{}), msgs:CH[key].msgs.slice(ar?-24:-8).map(m=>({r:m.r,t:String(m.t||'').slice(0,1500),...(m.al?{al:m.al}:{}),...(m.k?{k:m.k}:{}),...(m.txt?{txt:String(m.txt).slice(0,LIMITE)}:{}),...(m.cambios?{cambios:m.cambios}:{}),...(m.usado?{usado:true}:{})}))};

function chatDe(key){ if(CH[key]) return CH[key]; const s=cur(), g=s&&s.chats&&s.chats[key]; return CH[key]={msgs: g? g.msgs.map(m=>({...m})) : [], al: g&&g.al||''}; }
function recordar(txt){ txt=String(txt||'').trim().slice(0,240); if(!txt) return false; PREF.memoria=PREF.memoria||[]; if(PREF.memoria.some(x=>x.toLowerCase()===txt.toLowerCase())) return false; PREF.memoria.push(txt); PREF.memoria=PREF.memoria.slice(-30); guardarPref(); return true; }

const ESTRUCTURA=`CÓMO ESCRIBIR (con oficio pedagógico, no con fórmulas):
- Es un informe evaluativo: cada idea muestra un aprendizaje, cómo lo vive y lo logra el niño o la niña, y dónde se vio (la actividad o la propuesta, en pocas palabras). Que fluya como un texto escrito por alguien que conoce al niño o la niña: hilado, natural, sin estructuras repetidas.
- Mostrá al niño o la niña, no solo la lista de aprendizajes: qué le interesa, qué disfruta, cuáles son sus fortalezas y en qué aspectos todavía necesita intervención docente, siempre ligado a un aprendizaje y a lo que registró la docente (no inventes rasgos ni gustos).
- Lo que todavía cuesta va con delicadeza y desde la intervención, nunca como falta: «Si bien en algunos momentos puede dispersarse, logra reincorporarse a la propuesta mediante las intervenciones y las invitaciones de la docente».
- Agrupá lo afín (por ejemplo: lenguaje oral y juegos con palabras; lectura; escritura; convivencia) y pasá de un grupo a otro con conectores naturales («Por otra parte», «En las situaciones de…», «Asimismo»).
- TODO EN UN SOLO BLOQUE de texto, sin saltos de línea ni párrafos separados: CiDi no los admite.
- Variá el comienzo del texto y de las oraciones; no todas empiezan por el nombre ni por la misma estructura.
- El sujeto es el niño o la niña (o una experiencia que «le permitió…»), nunca el aprendizaje («Su participación… se fortalece»).
- No cuentes qué hizo el grupo ni la historia del proyecto; no cierres con lo que hará después («Continuará…», «Será importante…»): lo que todavía no hizo no se escribe.`;
const EJEMPLO_APOYO=`Ejemplo de la forma buscada para un niño o niña que necesita más acompañamiento (otra área y otra alumna: copiá su forma, nunca su contenido): «[NOMBRE] continúa construyendo sus posibilidades de expresión y participación en diferentes situaciones de intercambio oral y acercamiento a la literatura. Durante la lectura de un cuento necesitó de la motivación y el acompañamiento de la docente para sostener la escucha y mantener la atención durante el desarrollo de la narración. A través de preguntas orientadoras e intervenciones que la convocan a participar, logra recuperar algunos acontecimientos de la historia y compartir sus apreciaciones. Los juegos con rimas y trabalenguas le permitieron explorar los sonidos de las palabras y reconocer semejanzas sonoras, aunque todavía requiere ejemplos y orientación para encontrar nuevas relaciones. En las conversaciones grupales necesita estímulo para expresar sus ideas y sumarse a los intercambios, mostrando mayor disposición cuando se siente acompañada y convocada de manera individual. En las propuestas de escritura colectiva comienza a aproximarse a las diferencias entre lo que se dice y lo que se escribe, realizando aportes cuando cuenta con la orientación necesaria. En relación con la escritura de su nombre, continúa avanzando en su reconocimiento y producción, recurriendo a soportes visuales que funcionan como referencia para este proceso.»`;
const BANCO=`BANCO DE EXPRESIONES de los informes de esta escuela (usalas como repertorio: combiná, adaptá a la concordancia y variá; no las copies en bloque ni repitas la misma en un texto):

• Logro pleno: con autonomía · de manera autónoma · con claridad · con precisión · resolvió con precisión situaciones que requerían… · construye explicaciones cada vez más fundamentadas · comparte con claridad los procedimientos que utiliza · enriqueciendo las conversaciones con aportes pertinentes · realizando producciones cada vez más personales y detalladas · pudiendo explicar los procedimientos que utiliza para llegar a una respuesta · pudiendo comunicar semejanzas y diferencias · reconoció la importancia de… · identificando… a partir de la información registrada.
• Avanza / creciente autonomía: avanza progresivamente en… · avanzando progresivamente hacia una mayor autonomía · cada vez con mayor frecuencia · requiriendo apoyo ocasional cuando lo necesita · con acompañamiento cuando lo requiere · identificando en muchas ocasiones… · estableciendo comparaciones sencillas · comparte experiencias personales cuando se la/lo invita a participar.
• En construcción / con ayuda / primeros acercamientos: se encuentra fortaleciendo progresivamente… · se encuentra ampliando… · comienza a reconocer… · se inicia en… · se aproxima progresivamente a la comprensión de… · logra recitar algunos tramos de… · avanza gradualmente (o paulatinamente) en… · requiriendo en ocasiones ayuda para… · con acompañamiento, puede identificar ciertos… · realizando aportes acordes a sus posibilidades · logra aproximarse a las situaciones planteadas cuando la docente lo/la acompaña mediante preguntas, materiales concretos y estímulos · requirió orientación para… · acercándose progresivamente al reconocimiento de… · comenzó a reconocer la importancia de…
• Estrategias de apoyo (siempre junto a lo que logra): con invitación de la docente · con la mediación de los adultos · a través de preguntas orientadoras e intervenciones que lo/la convocan a participar · cuando se siente acompañado/a y contenido/a · cuando se le brinda un espacio de escucha individual · participa con mayor comodidad en grupos reducidos · cuando cuenta con oportunidades de intercambio y acompañamiento · cuando dispone de material concreto y mediación docente · recurriendo a apoyos visuales o referencias disponibles en la sala · aunque todavía requiere ejemplos y orientación para… · con ayuda de preguntas y referencias · necesita de la motivación y las intervenciones de la docente, que lo/la ayudan a sostener el interés en las propuestas
• Situar la evidencia: como se evidenció al… · estas capacidades se observaron durante… · en propuestas como… · en propuestas lúdicas como… · durante el proyecto «…», realizó… · en las propuestas desarrolladas en torno a…
• Experiencias como sujeto (variante válida, siempre ligada al aprendizaje del niño o la niña): «La historia de la yerba mate le permitió conocer prácticas de otras épocas y relacionarlas con…» · «Los juegos con rimas y trabalenguas le permitieron explorar…» · «El uso del globo terráqueo le permitió aproximarse al reconocimiento de…»
• Conectores: Asimismo · Del mismo modo · También · Además · Por otra parte · Más adelante · En relación con… · En geometría / En las experiencias de medición… · Si bien… · mientras que…
• Cierre opcional, en presente, sobre su actitud frente al aprendizaje: «Frente a los desafíos…, se muestra perseverante y dispuesto/a a explorar distintas alternativas» · «demuestra confianza para afrontar nuevos desafíos» · «demuestra disposición para aprender».`;

async function buscarProy(a){

Además, en «detalle», contá con más precisión las actividades concretas del proyecto (encuentro por encuentro o por momentos): qué hicieron, con qué materiales, juegos, cuentos, canciones, salidas o visitas, y el producto final. Hasta 1.800 caracteres, sin nombres de niños.
Respondé solo con JSON: {"nombre":"<nombre del proyecto si figura, o cadena vacía>","resumen":"<resumen>","detalle":"<detalle>","ids":["<id>", ...],"act":{"<id>":"<actividad breve>", ...}}

LISTA (id | aprendizaje):
${cands.map(o=>o.id+' | '+o.a).join('\n')}

PROYECTO:
${P.img?'(está en la imagen adjunta)':P.texto.slice(0,40000)}`;
  P.ocupado=true; P.error=false; P.estado=''; render();
  try{
    const opts={cache:false}; if(P.img) opts.images=[P.img];
    const out=await ST.sample.json(prompt,opts);
    const valid=new Set(cands.map(o=>o.id)), ids=(out?.ids||[]).map(String).filter(id=>valid.has(id));
    if(!P.nombre && out?.nombre) P.nombre=String(out.nombre);
    const tema=temaDeProyecto(P.nombre), arr=(s.sel[e][a]=s.sel[e][a]||[]);
    if(tema && out?.resumen && !((s.resumenes||{})[tema]||'').trim()){ s.resumenes=s.resumenes||{}; s.resumenes[tema]=String(out.resumen).trim().slice(0,2500); }
    if(tema){ s.proyDet=s.proyDet||{}; if(out?.detalle) s.proyDet[tema]=String(out.detalle).trim().slice(0,2500); if(P.texto.trim()){ s.proyTxt=s.proyTxt||{}; s.proyTxt[tema]=P.texto.trim().slice(0,15000); } }
    let nuevos=0;
    const acts=(out&&typeof out.act==='object'&&out.act)||{};
    for(const id of ids){ const act=String(acts[id]||'').trim().slice(0,300); let x=arr.find(y=>y.id===id);
      if(x){ const ps=temasDe(x); if(tema&&!ps.includes(tema)) ps.push(tema); x.ps=ps; x.tema=joinY(ps); }
      else { x={id,tema,ps:tema?[tema]:[]}; arr.push(x); nuevos++; }
      if(act){ const prev=(x.act||'').trim(); x.act = !prev? act : prev.includes(act)? prev : (temasDe(x).length>1? prev+' / '+act : act); } }
    const ord=cands.map(o=>o.id); arr.sort((x,y)=>ord.indexOf(x.id)-ord.indexOf(y.id));
    persist();
    const conAct=ids.filter(id=>String(acts[id]||'').trim()).length;
    P.estado = ids.length? `Encontré ${ids.length} aprendizaje${ids.length>1?'s':''}${nuevos<ids.length?` (${ids.length-nuevos} ya estaban)`:''}${conAct?` y la actividad donde se trabaja ${conAct===ids.length?'cada uno':conAct+' de ellos'}`:''}. Revisalos más abajo, o sumá otro proyecto o secuencia.` : 'No encontré aprendizajes de esta área en el proyecto. Podés elegirlos a mano.';
    P.texto=''; P.img=null; P.archivo=''; if(ids.length) P.nombre='';
  }catch(err){ P.error=true; P.estado = err?.code==='image_rejected'? 'No pude usar esa foto. Probá con otra más nítida.' : err?.code==='images_unavailable'? 'Las fotos no están disponibles acá: pegá el texto o subí un PDF.' : errIA(err); }
  P.ocupado=false; render();
}

const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
async function cargarModelo(s,f){

    const txt=(await textoDOCX(await f.arrayBuffer())).replace(/\r/g,'');
    const lineas=txt.split('\n').map(x=>x.trim());
    const sec={}; let cur=null;
    for(const l of lineas){ const h=H_MODELO.find(x=>norm(x)===norm(l)); if(h){ cur=h; sec[h]=[]; continue; } if(cur && l) sec[cur].push(l); }
    if(Object.keys(sec).length<3){ toast('No reconocí el modelo. Usá el modelo descargado sin cambiar los títulos.'); return; }
    const limpio=h=>(sec[h]||[]).filter(l=>norm(l)!==norm(AYUDA[h]||'')).join('\n').trim();
    const apTxt=norm((sec['APRENDIZAJES Y CONTENIDOS']||[]).join(' '));
    const areas=areasProy(s), aps=[], usadas=new Set();
    for(const A of areas) for(const o of aprsArea(s,A.k)){ const k=norm(o.a).slice(0,70); if(k && apTxt.includes(k)){ aps.push(o.id); usadas.add(A.k); } }
    const areasTxt=norm(limpio('ÁREAS')); for(const A of areas) if(areasTxt.includes(norm(A.c==='Ambiente'?'Ambiente':A.n))) usadas.add(A.k);
    const fechas=(limpio('SALA, FECHAS Y ENCUENTROS').match(/(\d{1,2})\/(\d{1,2})/g)||[]).map(t=>{ const [d,m]=t.split('/').map(Number); return `${s.ciclo||new Date().getFullYear()}-${pad(m)}-${pad(d)}`; });
    const enc=+(limpio('SALA, FECHAS Y ENCUENTROS').match(/encuentros:\s*(\d+)/i)||[])[1]||0;
    const secs=(sec['ENCUENTROS']||[]).map(l=>l.replace(/^encuentro\s*\d+\s*[:.-]?\s*/i,'')).filter(Boolean);
    const p=nuevoProy(s,{t:limpio('NOMBRE DEL PROYECTO').split('\n')[0]||f.name.replace(/\.docx$/i,''), areas:[...usadas], d1:fechas[0]||'', d2:fechas[1]||'', enc:enc||Math.max(secs.length,8), entus:limpio('LO QUE ME ENTUSIASMA DE ESTA PROPUESTA'), fund:limpio('FUNDAMENTACIÓN'), prop:limpio('PROPÓSITOS'), prod:limpio('PRODUCTO FINAL O META COMPARTIDA'), sec:secs, estr:limpio('ESTRATEGIAS Y ORGANIZACIÓN'), rec:limpio('RECURSOS'), evalx:limpio('EVALUACIÓN'), aps});
    sincronizarMetas(s,p,[]); persist(); UI.proyEd=p.id; render(); scrollTo(0,0); toast(`Proyecto cargado con ${aps.length} aprendizaje${aps.length===1?'':'s'}`);
  }catch(e){ toast('No pude leer el archivo. Probá guardarlo de nuevo como .docx'); }
}

  if(t.dataset.vchk){ const V=UI.vinc||(UI.vinc={}); const c=new Set(V.checks||[]); if(t.checked) c.add(t.dataset.vchk); else c.delete(t.dataset.vchk); V.checks=[...c]; return; }
  if(t.dataset.pmes){ planDe(s).mes[t.dataset.pmes]=+t.value; persist(); const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.pasig!==undefined){ const P=planDe(s); if(t.value) P.asig[t.dataset.pasig]=t.value; else delete P.asig[t.dataset.pasig]; persist(); const y=scrollY; render(); scrollTo(0,y); return; }
  if(t.dataset.revchk!==undefined){ const R=(s.rev[e][t.dataset.al]=s.rev[e][t.dataset.al]||{c:[],ok:false}); R.c[+t.dataset.revchk]=t.checked; persist(); return; }
  if(t.dataset.pick){
    const a=t.dataset.area, arr=(s.sel[e][a]=s.sel[e][a]||[]);
    if(t.checked){ if(!arr.find(x=>x.id===t.dataset.pick)) arr.push({id:t.dataset.pick,tema:''}); const ord=aprsArea(s,a).map(o=>o.id); arr.sort((x,y)=>ord.indexOf(x.id)-ord.indexOf(y.id)); }
    else s.sel[e][a]=arr.filter(x=>x.id!==t.dataset.pick);
    persist(); const lst=document.querySelector('.picker .list'), top=lst?lst.scrollTop:0, y=scrollY; render(); const l2=document.querySelector('.picker .list'); if(l2) l2.scrollTop=top; scrollTo(0,y); return;
  }
});
document.addEventListener('input', ev=>{
  const t=ev.target, s=cur(), e=ET();
  if(t.id==='chatIn'){ UI.chatDraft=t.value; return; }
  if(t.dataset.resumen!==undefined){ const x=proysArea(s,e,t.dataset.area)[+t.dataset.resumen]; if(x){ s.resumenes=s.resumenes||{}; s.resumenes[x.t]=t.value; persist(); } return; }
  if(t.dataset.chatedit){ const C=CH[t.dataset.k], X=chatCtx(t.dataset.k), m=C&&C.msgs[+t.dataset.chatedit]; if(m){ let v=t.value; const al=t.dataset.k.startsWith('inf|')? cur().alumnos.find(x=>x.id===t.dataset.k.split('|')[2]) : t.dataset.k.startsWith('area|')? cur().alumnos.find(x=>x.id===m.al) : null; if(al) v=v.split(al.nombre).join('[NOMBRE]'); m.txt=v; m.usado=false; } autosize(t); return; }
  if(t.dataset.dobs){ const t2=UI.diagT||diagPendiente(s)||epocaDiag()||'inicio'; diagDe(s,t2).obs[t.dataset.dobs]=t.value; persist(); refrescarDiag(); return; }
  if(t.id==='dgrupo'){ const t2=UI.diagT||diagPendiente(s)||epocaDiag()||'inicio'; diagDe(s,t2).grupo=t.value; persist(); refrescarDiag(); return; }
  if(t.id==='dtexto'){ const t2=UI.diagT||diagPendiente(s)||epocaDiag()||'inicio'; diagDe(s,t2).texto=t.value; persist(); return; }
  if(t.dataset.pf){ const p=proyArr(s).find(x=>x.id===UI.proyEd); if(p){ p[t.dataset.pf]= t.dataset.pf==='enc'? (+t.value||1) : t.value; persist(); if(['t','d1','d2'].includes(t.dataset.pf)) sincronizarCal(s,p); } return; }
  if(t.dataset.psec){ const p=proyArr(s).find(x=>x.id===UI.proyEd); if(p){ p.sec=p.sec||[]; p.sec[+t.dataset.psec]=t.value; persist(); } return; }
  if(t.id==='proyBuscar'){ UI.proyBuscar=t.value; const pos=t.selectionStart; render(); const b=$('#proyBuscar'); if(b){ b.focus(); b.setSelectionRange(pos,pos); } return; }
  if(t.dataset.cel){ const wk=UI.semana||isoD(lunesDe(new Date())); const W=(s.sem[wk]=s.sem[wk]||{}); (W[t.dataset.cel]=W[t.dataset.cel]||{}).t=t.value; persist(); return; }
  if(t.dataset.hora){ const h=s.horas.find(x=>x.id===t.dataset.hora); if(h){ h.h=t.value; persist(); } return; }
  if(t.id==='prefNombre'){ PREF.nombre=t.value.trim(); clearTimeout(UI._pn); UI._pn=setTimeout(guardarPref,700); return; }
  if(t.id==='sNombre'){ s.nombre=t.value; persist(); return; }
  if(t.id==='sCiclo'){ s.ciclo=+t.value||s.ciclo; persist(); return; }
  if(t.id==='pNombre'){ proyDe(UI.picker).nombre=t.value; return; }
  if(t.id==='vNombre'){ (UI.vinc||(UI.vinc={})).nombre=t.value; return; }
  if(t.id==='pTexto'){ const P=proyDe(UI.sec==='metas'? 'plan-'+UI.metaArea : UI.picker); P.texto=t.value; P.img=null; return; }
  if(t.id==='saludoTpl'){ s.saludo[e]=t.value; persist(); refrescarTodos(); document.querySelectorAll('.sug').forEach(b=>b.setAttribute('aria-pressed','false')); return; }
  if(t.id==='buscar'){ UI.buscar=t.value; const pos=t.selectionStart; render(); const b=$('#buscar'); if(b){ b.focus(); b.setSelectionRange(pos,pos); } return; }
  if(t.dataset.obs){ const E=s.ev[e]; const o=(E[t.dataset.apr]=E[t.dataset.apr]||{}); (o[t.dataset.al]=o[t.dataset.al]||{}).obs=t.value; persist(); refrescarTodos(); return; }
  if(t.dataset.tema){ const x=(s.sel[e][t.dataset.area]||[]).find(y=>y.id===t.dataset.tema); if(x){ x.tema=t.value; x.ps=t.value.trim()?[t.value]:[]; persist(); } return; }
  if(t.dataset.actap){ const x=(s.sel[e][t.dataset.area]||[]).find(y=>y.id===t.dataset.actap); if(x){ x.act=t.value; persist(); } return; }
  if(t.dataset.texto){ const al=s.alumnos.find(x=>x.id===t.dataset.al); setTexto(s,e,al,t.dataset.texto,t.value,false); autosize(t); t.closest('.texto')?.querySelector('[data-act=resetTexto]')?.removeAttribute('hidden'); const c=document.querySelector(`[data-count="${al.id}-${t.dataset.texto}"]`); if(c){ const n=t.value.length; c.textContent=cuenta(n,t.dataset.texto); c.classList.toggle('over',n>LIMITE);} return; }
});
/* al escribir una observación, el texto automático se actualiza sin redibujar la página */
function refrescarTexto(alId){
  const s=cur(), e=ET(), al=s.alumnos.find(x=>x.id===alId);
  document.querySelectorAll(`textarea[data-texto][data-al="${alId}"]`).forEach(ta=>{
    const T=textoDe(s,e,al,ta.dataset.texto); if(T.edit) return; ta.value=T.t; autosize(ta);
    const c=document.querySelector(`[data-count="${alId}-${ta.dataset.texto}"]`); if(c) c.textContent=cuenta(T.t.length,ta.dataset.texto);
  });
}
