<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cuaderno de Sala: planificación, notas e informes para docentes de nivel inicial de Córdoba.">
<meta name="theme-color" content="#34595E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2334595E'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23D9BC93'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}
.cuentaf .field input{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink)}.cuentaf .field input:focus{border-color:var(--accent);outline:none}</style>
<style>main,.wrap,body{scroll-padding-bottom:80px}body::after{content:"";display:block;height:72px}</style>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<title>Cuaderno de Sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una barra con la sala; primero se configura la sala, después se elige "por alumno" o "por área" y se trabaja en tarjetas por área */
:root{
  --bg:#F2EEE6; --paper:#FFFEFB; --ink:#2E3436; --muted:#6F716C; --line:#E2DCD0; --soft:#ECE6DA;
  --accent:#3D6B71; --accent-ink:#FFFFFF; --accent-soft:#DCE7E7; --sun:#D9B98C; --sun-soft:#F2E4CF; --sun-ink:#7A5E36;
  --head:#2C5257; --bar:#34595E; --bar-ink:#F4F0E8; --bar-muted:#BCCFCF;
  --ok:#5B8C6B; --ok-soft:#E0ECE2; --err:#B4584C;
  --a1:#C98F73; --a2:#D3A964; --a3:#7E9F96; --a4:#B48FA5; --a5:#6F98A0; --a6:#BFA27E;
  --l1:#F0E6CE; --l2:#EDDABD; --l3:#EAD2C8; --l4:#E3E6CC; --l5:#D4E4CF; --l6:#CFE0DC; --l7:#C9DCE0;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C2223; --paper:#242B2C; --ink:#E9E5DD; --muted:#A7A69E; --line:#374142; --soft:#2C3435;
  --accent:#8DBBC0; --accent-ink:#10292C; --accent-soft:#2A4245; --sun:#CDB28A; --sun-soft:#322B21; --sun-ink:#E2C79D;
  --head:#A9D0D3; --bar:#1A3336; --bar-ink:#E9E5DD; --bar-muted:#8FAAAC;
  --ok:#9CC7A7; --ok-soft:#26352B; --err:#E39A8F;
  --l1:#48432F; --l2:#4D4130; --l3:#4D3B35; --l4:#40452F; --l5:#33452F; --l6:#2C4439; --l7:#2D4146;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C2223; --paper:#242B2C; --ink:#E9E5DD; --muted:#A7A69E; --line:#374142; --soft:#2C3435;
  --accent:#8DBBC0; --accent-ink:#10292C; --accent-soft:#2A4245; --sun:#CDB28A; --sun-soft:#322B21; --sun-ink:#E2C79D;
  --head:#A9D0D3; --bar:#1A3336; --bar-ink:#E9E5DD; --bar-muted:#8FAAAC;
  --ok:#9CC7A7; --ok-soft:#26352B; --err:#E39A8F;
  --l1:#48432F; --l2:#4D4130; --l3:#4D3B35; --l4:#40452F; --l5:#33452F; --l6:#2C4439; --l7:#2D4146;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.005em;margin:0;line-height:1.2;text-wrap:balance}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1.5px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.brand{font-family:var(--display);font-weight:600;font-size:21px;display:flex;align-items:center;gap:10px;margin-right:auto}
.sunmark{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:var(--accent-soft);box-shadow:inset 0 0 0 7px var(--accent-soft),inset 0 0 0 13px var(--accent);flex:none;opacity:.9}
.salachip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.salachip select{width:auto;padding:6px 10px;font-size:14px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--err)}

main{padding-block:24px 90px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn{transition:border-color .2s,background .2s}
.btn.big{padding:12px 24px;font-size:17px}
.btn.sm{padding:5px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);background:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--sun-soft);color:var(--sun-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)}

/* configuración */
.setup{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.setup h1{font-size:clamp(28px,5vw,36px)}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px}
.step > b{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:19px}
.step h2{font-size:20px;margin:6px 0 10px}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice button{border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 18px;cursor:pointer;min-width:120px;text-align:left}
.choice button b{display:block;font-family:var(--display);font-size:20px;font-weight:600}
.choice button span{font-size:13px;color:var(--muted)}
.choice button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.field input{color:var(--ink);font-weight:400}
.alumnos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:6px;margin-top:12px}
.al{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:5px 6px 5px 12px;min-width:0}
.al .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gtog{display:inline-flex;border-radius:999px;background:var(--paper);padding:2px;flex:none}
.gtog button{border:0;background:none;border-radius:999px;padding:2px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.gtog button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--err);background:var(--paper)}

/* espacio de trabajo */
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.head h1{font-size:clamp(24px,4vw,30px)}
.mode{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px}
.mode button{border:0;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--muted)}
.mode.etapa button{padding:7px 14px;font-size:14px}
.mode button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto;padding:4px}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left}
.side button:hover{background:var(--soft)}
.side button[aria-current=true]{background:var(--paper);box-shadow:0 0 0 1.5px var(--accent)}
.side .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.side small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mobpick{display:none}
.areatabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.areatabs button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.areatabs button i{width:12px;height:12px;border-radius:50%;flex:none}
.areatabs button[aria-pressed=true]{border-color:currentColor;background:var(--soft)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.area{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;border-top:6px solid var(--ac)}
.area > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;flex-wrap:wrap}
.area > header h2{font-size:20px}
.area .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.lab{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.apr{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.apr .t{font-weight:600}
.apr .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.lvls{display:flex;flex-wrap:wrap;gap:6px}
.lvls button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.lvls button:hover{border-color:var(--muted)}
.lvls button[aria-pressed=true]{color:var(--ink);border-color:transparent;background:var(--lc)}
.texto{background:var(--sun-soft);border-radius:12px;padding:14px}
.texto textarea{background:var(--paper);border-color:transparent;font-size:16px;min-height:120px}
.texto textarea:focus{border-color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.count.over{color:var(--err)}
.picker{border:2px solid var(--accent);border-radius:12px;padding:12px;background:var(--paper)}
.picker .grp{margin-top:10px}
.picker .grp > div{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.picker label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:15px}
.picker label:hover{background:var(--soft)}
.picker input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.picker .list{max-height:420px;overflow:auto;margin-top:6px}
.chosen{display:flex;flex-direction:column;gap:8px}
.chosen .c{display:grid;grid-template-columns:1fr minmax(160px,260px);gap:8px;align-items:center;font-size:15px}
.chosen .c input.act{grid-column:1 / -1;font-size:14px;margin-top:-2px}
.chosen .c{padding-bottom:10px;border-bottom:1px dashed var(--line)}.chosen .c:last-child{border-bottom:0}
.stu{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.stu h3{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.mini .apr{padding:10px 12px}
.aviso{margin:8px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.revision{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px}
.revision h3{font-size:18px;margin:10px 0 4px}
.revision label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
.revision input{accent-color:var(--ok);width:18px;height:18px;margin-top:3px;flex:none}
.aviso-big{background:var(--sun-soft);border-left:5px solid var(--sun);border-radius:10px;padding:12px 14px}
.proyecto{margin-top:12px;background:var(--soft);border-radius:12px;padding:14px}
.errt{color:var(--err)}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.sug{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;line-height:1.5;font-size:15px}
.sug:hover{border-color:var(--sun)}
.sug[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 3px;font-weight:700}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:700;font-size:14px}
.side small.okc{color:var(--ok);font-weight:700}
.secs{border-top:1px solid var(--line)}
.top .secs .wrap{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.secs button,.secs span{border:0;background:none;padding:8px 14px;border-radius:999px;white-space:nowrap;font-weight:700;font-size:15px;color:var(--muted)}
.secs button{cursor:pointer}
.secs button:hover{background:var(--soft);color:var(--ink)}
.secs button[aria-current=page]{background:var(--accent-soft);color:var(--ink)}
.secs span{opacity:.55;font-weight:600;cursor:default}
.secs span small{font-size:11px;margin-left:4px;letter-spacing:.04em;text-transform:uppercase}
.notacard{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.nota{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px}
.nota .meta{font-size:13px;color:var(--muted);font-weight:600}
.nota p{margin:2px 0 0;grid-column:1 / -1}
.misnotas{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.misnotas .n{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:15px}
.misnotas .n small{color:var(--muted);font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.oops{background:var(--accent-soft);border-radius:var(--r);padding:16px}
@media (max-width:640px){
  .top{position:static}
  .salachip .extra{display:none}
  .brand{font-size:19px}
  .side{top:12px}
}
@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .mobpick{display:flex;gap:8px;margin-bottom:12px}
  .chosen .c{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* temas */
:root[data-paleta="salvia"]{--bg:#F4F0E8; --paper:#FFFDF9; --ink:#3A3833; --muted:#7A746A; --line:#E6DECF; --soft:#EEE7DA; --accent:#5F7F62; --accent-soft:#E3EBDF; --sun-soft:#F3E6D6; --head:#4A6A4E; --bar:#5F7F62; --bar-ink:#F7F4EC; --bar-muted:#D6E2D3;}
:root[data-paleta="rosa"]{--bg:#F7F0EC; --paper:#FFFCFA; --ink:#3C3534; --muted:#80716E; --line:#EADDD7; --soft:#F2E7E2; --accent:#4F8C82; --accent-soft:#DDEDE8; --sun-soft:#F4E1D9; --head:#8A5B51; --bar:#A9746A; --bar-ink:#FFF8F5; --bar-muted:#F0D6CF;}
:root[data-paleta="blanco"]{--bg:#F8F8F5; --paper:#FFFFFF; --ink:#2F3637; --muted:#6C7474; --line:#E3E7E4; --soft:#EEF3F1; --accent:#3E8A80; --accent-soft:#DCEEEA; --sun-soft:#FBE9E1; --head:#2F6F67; --bar:#3E8A80; --bar-ink:#FFFFFF; --bar-muted:#CFE6E2;}
@media (prefers-color-scheme: dark){:root[data-paleta]:not([data-theme="light"]){--bg:#1C2223; --paper:#242B2C; --ink:#E9E5DD; --muted:#A7A69E; --line:#374142; --soft:#2C3435; --accent:#8DBBC0; --accent-soft:#2A4245; --sun-soft:#322B21; --head:#A9D0D3; --bar:#1A3336; --bar-ink:#E9E5DD; --bar-muted:#8FAAAC;}}
:root[data-paleta][data-theme="dark"]{--bg:#1C2223; --paper:#242B2C; --ink:#E9E5DD; --muted:#A7A69E; --line:#374142; --soft:#2C3435; --accent:#8DBBC0; --accent-soft:#2A4245; --sun-soft:#322B21; --head:#A9D0D3; --bar:#1A3336; --bar-ink:#E9E5DD; --bar-muted:#8FAAAC;}
:root[data-letra="grande"] body{zoom:1.12}
.ap{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.temas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.tema{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;text-align:left}
.tema[aria-pressed=true]{border-color:var(--accent)}
.tema .sw{display:flex;gap:4px}.tema .sw i{width:28px;height:20px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.mensaje{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--sun);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.mensaje .hola{font-family:var(--display);font-weight:600;font-size:19px;color:var(--head)}
.mensaje p{margin:4px 0 0;font-size:17px;line-height:1.5}
/* hoy y semana */
.hoygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
ol.dia{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.dia li{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:12px}
ol.dia .hora{font-weight:700;color:var(--head);font-variant-numeric:tabular-nums}
ol.dia .act{min-width:0;overflow-wrap:break-word}
ol.dia .ap{display:block;margin-top:4px}
.grilla{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper)}

 en los intercambios cotidianos que tienen lugar en la sala.", "Gestiona permisos ante la/el docente, en consonancia con normas de convivencia.", "Establece acuerdos en actividades conjuntas (juegos, dramatizaciones, salidas).", "Respeta progresivamente turnos de intercambio.", "Usa algunas fórmulas de cortesía (“por favor”, “gracias”, “permiso”)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Exploración y apropiación de nuevas palabras y estructuras sintácticas sencillas, para comunicar sus gustos, preferencias, estados de ánimo, opiniones.", "i": ["Expresa, a través de la palabra, sentimientos, lo que le gusta y lo que no, acuerdos y desacuerdos.", "Complejiza sus enunciados con descripciones sencillas, en situaciones de juego y de indagación acerca de diversos temas.", "Incorpora detalles a sus intervenciones orales cotidianas en rondas, meriendas, paseos."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Incorporación de recursos expresivos en sus enunciados orales, para relatar experiencias personales, anécdotas, situaciones (evocadas o imaginadas).", "i": ["Escucha relatos de experiencias vividas por la/el docente y compañeras/os de la sala.", "Incorpora elementos estructurales sencillos del relato, como las relaciones de causa-consecuencia.", "Comparte, a través de relatos breves, algunas anécdotas y experiencias propias.", "Se inicia en el reconocimiento de una sucesión de hechos narrados (atiende a la ilación del relato).", "Incorpora, en sus relatos, recursos expresivos que acompañan la voz (entonación, énfasis) y otros verbales, como exclamaciones y onomatopeyas."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Conversación a partir de la exploración de diversos portadores de texto en el contexto cotidiano de la biblioteca, participando activamente en experiencias que posibiliten la vivencia de prácticas comunitarias, usos y cuidados de los libros.", "i": ["Expresa comentarios sobre los libros leídos.", "Explora todo tipo de portadores impresos, como libros (de literatura, informativos), folletos, revistas.", "Manifiesta interés por el funcionamiento de la biblioteca de la sala y la tarea de las personas responsables (encargadas/os) de la semana.", "Selecciona qué leer según intereses y guiada/o por un propósito de lectura (por iniciativa propia o siguiendo sugerencias de la/del docente).", "Reconoce y comenta, con otras/os, la función de las fichas en el registro de préstamos de libros.", "Se compromete en el cuidado de los libros de la biblioteca, en el marco del uso compartido de espacios dinámicos y colectivos, como mesas de libros, carritos, canastas o valijas con libros, entre otros.", "Accede a libros por medio de préstamos de la biblioteca, con orientación de la/del docente."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Escucha, identificación y comprensión de información en situaciones cotidianas, como la planificación conjunta de tareas.", "i": ["Participa de una conversación durante períodos más largos.", "Incorpora fórmulas sociales de cortesía (saludo, despedida, pedido, permiso, agradecimiento).", "Establece acuerdos en actividades conjuntas con otras/ os (juegos, dramatizaciones, salidas).", "Respeta turnos de intercambio."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Ampliación del repertorio de palabras y expresiones verbales, para comunicar y compartir (con pares o personas adultas) sus gustos y preferencias, estados de ánimo, opiniones y saberes, a través de expresiones cada vez más complejas.", "i": ["Expresa, a través de la palabra, sentimientos, acuerdos y desacuerdos, opiniones y puntos de vista.", "Elabora enunciados con descripciones detalladas acerca de libros, películas, comidas, música, juegos y juguetes, entre otros.", "Amplía su repertorio de expresiones con el uso de pronombres, cuantificadores, referencias temporales y espaciales."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Incorporación de recursos expresivos de complejidad creciente para relatar experiencias personales, anécdotas, escenas y situaciones (evocadas o imaginadas), de manera cada vez más precisa y detallada.", "i": ["Escucha atentamente relatos de experiencias vividas por la/el docente y compañeras/os de la sala.", "Desarrolla relatos de temporalidad lineal, atendiendo a la ilación del relato y el orden de los sucesos narrados (evocados o imaginados).", "Comparte, de manera frecuente, experiencias propias.", "Incorpora, de manera progresiva, conectores temporales para relatar sucesos pasados."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Escuchar y tomar la palabra para expresarse (sentimientos, deseos, descubrimientos, opiniones y preferencias personales), en contextos cotidianos y escenarios como mesas de libros y biblioteca.", "a": "Conversación a partir de la exploración y selección de diversos materiales de lectura, en el contexto cotidiano y comunitario de la biblioteca, con avance en la construcción del gusto personal y el reconocimiento de la función social y cultural de estos espacios.", "i": ["Explora activamente todo tipo de portadores impresos, como libros (de literatura, informativos), folletos, revistas, textos que producen artesanalmente sus pares, en el marco de proyectos didácticos.", "Expresa comentarios sobre los libros que conoce y a los que puede acceder por medio del préstamo, argumentando su opinión y preferencias (sobre temas, colecciones).", "Selecciona qué leer según intereses y guiada/o por un propósito de lectura (por iniciativa propia o siguiendo sugerencias de la/del docente).", "Formula preguntas relativas al uso de la biblioteca de la sala y del jardín.", "Reconoce el uso de materiales propios de la organización de la biblioteca de la sala (como las fichas de libros o fichas de lectoras/es, que se utilizan para el registro de préstamos).", "Se compromete en el cuidado de los libros de la biblioteca, en el marco del uso compartido de espacios dinámicos y colectivos, como mesas de libros, cuevas de telas, carritos, canastas o valijas con libros, entre otros."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Exploración sensible de las posibilidades lúdicas y estéticas que ofrecen las formas poéticas y primeros repertorios familiares de la tradición oral.", "i": ["Acompaña, con movimientos corporales, la escucha de textos poéticos que ponen el acento en el ritmo y la sonoridad.", "Reconoce nanas que se comparten en la sala y con las familias.", "Reconoce palabras y expresiones significativas de los textos poéticos recitados o leídos por la/el docente y otras personas adultas (en presencia o a través de grabaciones, animaciones audiovisuales).", "Participa en la oralización de rimas sencillas, retahílas, nanas y rondas infantiles."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Escucha de narraciones literarias oralizadas o leídas en voz alta por la/el docente y otras/os lectoras/ es, en escenas de lectura y ambientaciones preparadas especialmente para la ocasión.", "i": ["Participa, de manera cada vez más atenta, en los momentos de narración de cuentos (breves, con estructuras iterativas, lineales), a través de la voz de la/del docente y de otras personas adultas.", "Expresa su interés, mediante gestos o palabras, por los textos literarios escuchados en el marco de los itinerarios de lectura."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Participación en situaciones de intercambio en torno a los textos literarios compartidos en la sala, a partir de la escucha y expresión de comentarios espontáneos.", "i": ["Se inicia en la escucha de comentarios sobre el contenido de los textos seleccionados en el marco de una agenda de lectura.", "Comienza a vincular lo narrado (por la/el docente y otras personas adultas), y lo que se comenta en el marco del intercambio colectivo, con las propias experiencias personales.", "Comparte comentarios espontáneos a través de gestos, exclamaciones, palabras y preguntas simples sobre los textos escuchados."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Lectura exploratoria y por sí mismas/os de los textos literarios ya conocidos, en las lecturas compartidas (en formato papel y digital).", "i": ["Comenta lo que observa, anticipa e imagina (mientras recorre las páginas de un libro con abundantes ilustraciones).", "Anticipa el contenido de los textos literarios seleccionados a partir de las imágenes, diseños, colores o algunos indicios del soporte.", "Reconoce elementos paratextuales en los libros que forman parte de la agenda de lectura (tapa, contratapa, portada)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Exploración sensible y apropiación de las posibilidades lúdicas y estéticas que ofrecen las formas poéticas y primeros repertorios familiares de la tradición oral, favoreciendo la escucha atenta y el reconocimiento de los efectos del lenguaje literario.", "i": ["Acompaña, con movimientos y gestos corporales, la escucha de textos poéticos que ponen el acento en el ritmo y la sonoridad.", "Reconoce y aprecia los efectos que producen algunos recursos del lenguaje poético, como las rimas y juegos de palabras.", "Participa en la oralización de rimas, retahílas, nanas y rondas infantiles.", "Interpreta otros sentidos posibles en el contenido de un poema.", "Reconoce, a través de nanas, a personas importantes que las/os cuidaron o cuidan.", "Juega con la musicalidad del lenguaje, para producir textos poéticos de manera colectiva."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Escucha de narraciones literarias oralizadas o leídas en voz alta por la/el docente y otras/os lectoras/ es, en escenas de lectura y ambientaciones preparadas especialmente para la ocasión, favoreciendo la escucha atenta y la apreciación del lenguaje literario.", "i": ["Sostiene la escucha en los momentos de narración de cuentos, leyendas, fábulas y otras manifestaciones literarias (contemporáneas y tradicionales).", "Manifiesta interés por los textos literarios escuchados, como parte de un itinerario de lectura (pide su relectura, los elige para explorar)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Participa en situaciones de intercambio en torno a los textos literarios (leídos o escuchados), a través de comentarios simples y primeras apreciaciones.", "i": ["Escucha comentarios de la/del docente y de sus pares sobre el contenido de los textos seleccionados, en el marco de una agenda de lectura.", "Reconoce personajes y los vincula con las distintas situaciones narradas.", "Comparte gustos personales y plantea preguntas acerca del contenido de los textos escuchados y compartidos."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Lectura por sí mismas/os de los textos literarios ya conocidos en las lecturas compartidas (en formato papel y digital) y exploración de algunas características comunes.", "i": ["Realiza anticipaciones acerca del contenido de los textos que forman parte de la agenda de lectura.", "Participa de exploraciones de mesas servidas de libros para seleccionar otros textos que integrarán esos itinerarios.", "Reconoce personajes con características comunes en los distintos itinerarios de lectura.", "Comenta qué aspectos tuvo en cuenta para elegir determinados libros.", "Reconoce semejanzas, recurrencias y diferencias en los textos que abordan un tema o un género en común.", "Recupera, en conversaciones mediadas por la/el docente, recursos en los textos literarios ya leídos (como repeticiones, enumeraciones, rimas, onomatopeyas, imágenes sensoriales)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Reconocimiento de las posibilidades lúdicas y estéticas que ofrecen las formas poéticas y repertorios de la tradición oral anónima, transmitidos a través de generaciones.", "i": ["Reconoce diferentes rasgos sonoros en la palabra poética oralizada.", "Vincula sus impresiones e interpretaciones personales con las palabras o versos del texto poético que las han generado.", "Aprecia los efectos que producen distintos recursos del lenguaje poético (imágenes visuales, personificaciones, aliteraciones).", "Produce de manera individual y colectiva, estructuras poéticas como adivinanzas, utilizando metáforas.", "Participa activamente en situaciones lúdicas que implican la escucha y oralización de textos poéticos con musicalidad (melodía y ritmo), como las coplas y retahílas."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Participación en narraciones literarias de diversos géneros, con estructuras más complejas, en escenas de lectura preparadas especialmente para la ocasión.", "i": ["Escucha la narración oral o lectura de quien lee en voz alta por tiempos cada vez más prolongados.", "Realiza comentarios pertinentes durante la lectura de los textos literarios que forman parte de un itinerario.", "Solicita a la/al docente, durante la lectura, que relea algún pasaje para comprenderlo mejor o para disfrutar del modo que está escrito."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Participación en conversaciones literarias, siguiendo el hilo del intercambio, para expresar y compartir comentarios, preferencias, recomendaciones de lectura.", "i": ["Escucha comentarios y construye nuevos sentidos sobre los textos literarios compartidos, en el marco de una agenda de lectura.", "Recupera el hilo argumental del último capítulo leído al continuar la lectura de una novela.", "Produce oralmente recomendaciones de los libros leídos a la/el docente, otras personas adultas y sus pares.", "Se involucra activamente en el mundo del texto a través de la participación en conversaciones literarias.", "Reconoce las partes principales de un relato y puede reconstruir los sucesos lineales."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en la lectura de textos literarios en el marco del ritual compartido, expresar preferencias y comentarios sobre las obras seleccionadas y oralizar textos poéticos, para explorar las posibilidades lúdicas y estéticas que ofrecen.", "a": "Lectura por sí mismas/os de los textos literarios ya conocidos en las lecturas compartidas (en formato papel y digital) y reconocimiento de estructuras/estrategias narrativas características.", "i": ["Realiza anticipaciones e interpretaciones posibles acerca del contenido de los textos que forman parte de la agenda de lectura, teniendo en cuenta lo que sabe sobre los personajes o la trama.", "Presta atención, con progresiva autonomía, a la extensión y ubicación de algunos fragmentos, palabras y letras conocidas, en los textos leídos de manera conjunta.", "Distingue, con la mediación de la/del docente, diferentes estructuras narrativas (lineales, circulares, reiterativas, acumulativas, entre otras).", "Verifica sus anticipaciones atendiendo a distintos indicios (ilustraciones, elementos paratextuales) y/o conocimientos previos (autora/or, género, portador).", "Reconoce a la/al autora/or, el género, las ilustraciones, el título, la tapa o la colección, como criterio para elegir un libro ya conocido.", "Participa activamente en la lectura exploratoria de libros álbum y libros ilustrados."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Exploración de materiales escritos presentes en el ámbito cotidiano de la sala.", "i": ["Manipula materiales escritos disponibles en la sala, a partir de la solicitud de la/del docente.", "Reconoce el uso social, en diferentes momentos, de algunos portadores."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Lectura exploratoria por sí mismas/os, a partir de información contextual verbal y visual.", "i": ["Reconoce la diferencia entre dibujo y escritura en los materiales escritos disponibles en la sala.", "Interactúa con los textos escritos a partir de intervenciones precisas de la/del docente (por ejemplo, para buscar “dónde está escrito”).", "Presta atención a elementos significativos, como imágenes, colores y diseños, en la exploración de materiales escritos."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Reconocimiento de los usos y funciones de diversos materiales escritos presentes en el ámbito cotidiano de la sala.", "i": ["Interactúa con múltiples materiales escritos disponibles en la sala, a partir de la solicitud de la/del docente (calendarios, agendas de cumpleaños, horario semanal, listas de asistencia, fichas de libros, entre otros).", "Reconoce el tipo de información que contienen estos textos a partir de lo que observa, anticipa, predice.", "Reconoce rasgos propios del sistema de escritura, como la linealidad y direccionalidad."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Participación en situaciones de lectura por sí mismas/os de materiales escritos diversos, en situaciones cotidianas que impliquen buscar y señalar “dónde está escrito”.", "i": ["Realiza anticipaciones a partir de elementos contextuales y paratextuales presentes en los materiales impresos disponibles en la sala.", "Comparte con sus pares hipótesis acerca del sistema de escritura, alentada/o por la/el docente.", "Identifica, progresivamente, elementos como las letras que forman parte del nombre propio, en palabras de uso frecuente en la vida cotidiana de la sala.", "Reconoce que los contextos visuales y otros elementos paratextuales aportan información valiosa."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Identificación de los usos y funciones de diversos materiales escritos presentes en el ámbito cotidiano de la sala, a partir de su consulta frecuente.", "i": ["Participa activamente en situaciones contextualizadas de lectura de múltiples materiales escritos (calendarios, agendas de cumpleaños, horario semanal, entre otros).", "Reconoce rasgos propios del sistema de escritura, como índices cualitativos y cuantitativos de la escritura, en aquellos textos en los que dice algo que “sabe que está escrito”.", "Conversa con sus pares y la/el docente sobre el tipo de información que contienen estos textos (a partir de lo que observa, anticipa, predice)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Reconocer palabras de uso frecuente a partir de características propias del sistema de escritura, en particular: linealidad, discriminación de “dónde dice” e identificación visual y sonora de la primera letra.", "a": "Lectura por sí mismas/os en situaciones de búsqueda e identificación de palabras y frases (“dónde dice” o “dónde está escrito”), en materiales escritos de uso frecuente en la sala.", "i": ["Realiza anticipaciones a partir de elementos contextuales y paratextuales presentes en los materiales impresos disponibles en la sala.", "Expresa ideas e hipótesis acerca del sistema de escritura, motivada/o por la intervención docente (“dónde dice”, “qué tiene…”, “que no tiene…”).", "Identifica palabras y algunas letras por comparación de escrituras, como relación sonido-grafía (“es la de…”, “comienza como…”, “termina como…”).", "Reconoce el sistema de escritura como un sistema de correspondencias estable (aunque sólo identifique algunas de ellas)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Participación en experiencias colectivas de escritura, como registro de situaciones cotidianas.", "i": ["Interviene en situaciones de escritura colectiva, a través del o de la docente, con distintos propósitos.", "Reconoce que lo escrito provee información y puede funcionar como forma de “registro”."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Participación en propuestas colectivas de escritura de palabras y frases que impliquen poner, por escrito, expresiones previamente oralizadas.", "i": ["Se inicia en el dictado a la/al docente (y otras personas adultas) de palabras y frases para ser escritas, con distintos propósitos.", "Distingue, progresivamente, las diferencias entre prácticas de oralidad y de escritura, a través de situaciones particulares que le den sentido a estos aprendizajes (cómo se narra, se describe, se explica y se dan instrucciones “oralmente”, y cómo se lo hace “por escrito”)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Escritura libre y exploratoria, por sí mismas/os, de palabras y textos sencillos sobre diversos soportes disponibles (lápiz y papel, tiza o marcador y pizarra, teclado y pantalla).", "i": ["Explora la práctica de “marcas gráficas” con la intencionalidad de producir escrituras que se diferencian progresivamente del dibujo.", "Manipula herramientas de escritura con el propósito de escribir, por sí misma/o, textos sencillos como carteles, rótulos, listas."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Exploración de la forma escrita convencional del nombre propio en situaciones cotidianas y con un propósito comunicativo.", "i": ["Reconoce paulatinamente (le resulta familiar) la forma escrita convencional del nombre propio, en diversas situaciones de uso y de su lectura.", "Ensaya formas personales de escritura (pseudoescrituras) del nombre propio para firmar sus producciones."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Participación en experiencias de escritura que permitan reconocer funciones sociales y usos de la lengua escrita, como extensión de la memoria y medio de registro en la vida cotidiana.", "i": ["Participa, con distintos propósitos, en situaciones de escritura colectiva a través de la/el docente.", "Identifica la escritura como registro de la memoria (cuando hay que dirigirse a una/un destinataria/o ausente, para registrar los turnos o los resultados de los juegos, para identificar producciones).", "Reconoce, paulatinamente, la importancia de la lengua escrita en la construcción de nuevos aprendizajes (como recurrir a fuentes escritas para saber más sobre un tema, recuperar información, resolver dudas, entre otros propósitos)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Participación en propuestas colectivas de escritura de listas de palabras, frases y textos breves que implican comenzar a planificar oralmente lo que se va a escribir y dictar en voz alta.", "i": ["Reconoce progresivamente las diferencias entre las formas de la oralidad y las formas más estructuradas de la escritura, en situaciones de dictado a la/al docente, con distintos propósitos.", "Comienza a participar en la planificación oral del proceso de escritura a través de comentarios sobre “qué” se va a escribir.", "Realiza aportes que contribuyen en la generación y organización de las ideas durante la planificación de la escritura."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Exploración libre de escrituras por sí mismas/os, haciendo uso de diversos instrumentos y soportes de escritura (manuscrita y/o digital), con propósitos diversos.", "i": ["Ensaya formas personales de escritura (pseudoescrituras propias) con sentido social compartido, como carteles, rótulos, listas.", "Escribe por sí misma/o, y de manera frecuente, diferentes tipos de listados (todo tipo de listados vinculados con textos leídos, temas indagados, préstamo de libros, roles en juegos, entre otros).", "Emplea diversos instrumentos y soportes de escritura disponibles, seleccionando aquellos que resultan más adecuados para la tarea propuesta (lápiz y papel, tiza o marcador y pizarra, teclado y pantalla)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Escritura convencional del nombre propio y exploración de los elementos que componen el nombre de otras personas significativas, considerándolos como fuente de información confiable.", "i": ["Reconoce la forma escrita convencional del nombre propio.", "Reconoce progresivamente el repertorio de relaciones sonidos-grafía en los elementos que componen el nombre propio.", "Copia el nombre propio con algún sentido (para firmar trabajos, rotular pertenencias, entre otros), atendiendo a las particularidades del “modelo” y considerando la linealidad, las formas gráficas, la cantidad, la variedad y el orden de las letras en la escritura.", "Participa en situaciones de escritura que tienen por objeto la exploración de la forma escrita convencional del nombre de otras personas significativas."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Valoración de la escritura como extensión de la memoria (individual y colectiva), forma de registro y práctica social en contextos reales.", "i": ["Identifica funciones sociales y usos de la lengua escrita, como representar ideas, deseos, necesidades, intereses y atribuir sentidos, en situaciones de escritura individual y colectiva.", "Recurre a la escritura como forma de registro (cuando hay que dirigirse a una/un destinataria/o ausente, para registrar los turnos o los resultados de los juegos, para identificar producciones).", "Reconoce la importancia de la lengua escrita en la construcción de nuevos aprendizajes, como recurrir a fuentes escritas para saber más sobre un tema, recuperar información, resolver dudas, entre otros propósitos."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Participación en propuestas colectivas de escritura de textos breves (literarios y no literarios), que impliquen el despliegue de estrategias de planificación, de textualización, de revisión y corrección del escrito.", "i": ["Reconoce las diferencias entre las formas de la oralidad y las formas más estructuradas de la escritura, en situaciones de dictado a la/al docente.", "Participa en la revisión colectiva de la producción escrita, atendiendo a las características de los diversos géneros textuales (carta, afiche, invitación, cuento, nota de enciclopedia).", "Considera, en la planificación oral del proceso de escritura, el tipo de texto que se va a producir, el propósito comunicativo, las/os destinatarias/os.", "Realiza aportes que permiten avanzar en la corrección del escrito colectivo, con base en la planificación (qué dice, qué falta, si coincide con lo planificado y previsto).", "Propone fórmulas convencionales propias de la escritura de determinados géneros textuales (inicios de cuentos, secuencias en textos instruccionales, entre otras)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Escritura exploratoria y asidua de palabras y textos sencillos, avanzando en el manejo de diversos instrumentos y soportes de escritura, con propósitos diversos (y no como mero aprestamiento).", "i": ["Ensaya formas personales de escritura con sentido social compartido (carteles, rótulos, invitaciones y todo tipo de listas), avanzando hacia escrituras más convencionales.", "Reconoce y utiliza un repertorio creciente de letras (grafías convencionales) disponibles en la sala.", "Recurre a palabras conocidas para producir las propias escrituras.", "Participa de situaciones de escritura por sí misma/o, tanto manuscritas como digitales.", "Revisa lo escrito considerando cuántas letras, cuáles, en qué orden, en qué direccionalidad."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Participar en situaciones de escritura colectiva de textos breves, a través del dictado de la/del docente.", "a": "Escritura convencional del nombre propio y el de otras personas significativas, en situaciones cotidianas y con un claro propósito comunicativo.", "i": ["Reconoce la forma escrita convencional del nombre propio y el de otras personas significativas.", "Reconoce el repertorio de relaciones sonidos-grafía en los elementos que componen su nombre propio.", "Recurre a la escritura del propio nombre en situaciones en que tiene sentido hacerlo, como firmar sus producciones, identificar sus pertenencias, registrar préstamos en la biblioteca.", "Reconoce el nombre propio como fuente de información confiable sobre el sistema de escritura."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Participación en situaciones de lectura de textos informativos leídos en voz alta por la/el docente y otras personas adultas.", "i": ["Escucha la lectura, a través de la/del docente y otras personas adultas, de diversos textos informativos sobre un tema de interés (notas de enciclopedia, noticias, curiosidades científicas).", "Relaciona lo escuchado en la lectura con lo observado en diferentes tipos de imágenes (fotografías, ilustraciones, entre otras)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 3, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Exploración guiada de materiales informativos, en diversos formatos, sobre temas de estudio y de interés para el grupo.", "i": ["Participa de “mesas servidas” en las que encuentra una diversidad de materiales de lectura sobre un tema (enciclopedias, fascículos, revistas, folletos).", "Tiene en cuenta diferentes tipos de imágenes (fotografías, ilustraciones, entre otras) para realizar anticipaciones sobre el contenido.", "Describe lo que observa en libros de comunicación pública, en un contexto de estudio."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Participación frecuente en situaciones de lectura de textos informativos leídos en voz alta por la/el docente y otras personas adultas.", "i": ["Escucha de la lectura, a través de la/del docente y otras personas adultas, de textos informativos sobre un tema de interés (notas de enciclopedia, noticias, curiosidades científicas).", "Realiza comentarios (a medida que la/el docente lee) sobre lo que entiende y lo que no, comparte preguntas y lo que sabe sobre el tema.", "Reconoce propósitos específicos de lectura relacionados con la consulta de textos no literarios, para “saber más” sobre un tema.", "Relaciona, con creciente complejidad, lo escuchado en la lectura con lo observado en diferentes tipos de imágenes."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Exploración frecuente y guiada de libros de comunicación pública y otros materiales impresos (no literarios) presentes en la biblioteca de la sala y del jardín.", "i": ["Explora, en pequeños grupos, diversos materiales de lectura (enciclopedias, fascículos, revistas, folletos) para seleccionar cuáles podrían ayudarla/o a “saber más” sobre un tema.", "Reconoce la fotografía como un recurso habitual de los libros de comunicación pública infantil y de otras fuentes de consulta.", "Realiza anticipaciones sobre el contenido de los textos a partir de elementos paratextuales (portadas, títulos)."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 4, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Iniciación en la participación en prácticas de escritura sobre un tema de estudio en diversos ámbitos de conocimiento.", "i": ["Participa en la producción de textos gráficos (dibujos) para registrar la información relevada, a modo de “toma de notas”.", "Participa en la escritura de textos breves (en pequeños grupos y a través del dictado a la/al docente), para comunicar lo aprendido en murales informativos, infografías, folletos, fichas."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Lectura, a través de la/del docente, de textos informativos en contextos de estudio, avanzando en el reconocimiento de su función e intencionalidad comunicativa.", "i": ["Sostiene en el tiempo la escucha de la lectura de textos informativos sobre un tema de interés.", "Incorpora en sus comentarios orales vocabulario específico de los campos de estudio.", "Realiza comentarios (a medida que la/el docente lee) sobre lo que entiende y lo que no, solicita aclaraciones, comparte preguntas.", "Reconoce la diferencia de propósitos específicos de la lectura de textos expositivos o instruccionales (como la consulta para buscar determinada información).", "Recupera, en otros momentos de intercambio sobre el tema abordado, la información de textos leídos por la/ el docente."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Selección de textos informativos, en situaciones contextualizadas de lectura, para buscar y localizar información sobre un tema de estudio.", "i": ["Explora, en pequeños grupos, diversos materiales de lectura (enciclopedias, fascículos, revistas, folletos), para decidir en cuáles puede encontrar la información necesaria.", "Solicita, a la/al docente y otras personas adultas, la lectura de una parte específica del texto, para revisar sus anticipaciones o detener la lectura si encuentra la información deseada.", "Se apoya en distintos elementos paratextuales (portadas, títulos, fotografías, ilustraciones, epígrafes) para anticipar “dónde” buscar información.", "Elabora interpretaciones posibles a partir de las relecturas de algunos fragmentos que son leídos en voz alta por la/el docente.", "Realiza anticipaciones sobre el contenido (“qué puede decir”) e intenta verificarlas, descartarlas o confirmarlas por las imágenes, por la información que aporta el texto."]}, {"c": "Lenguaje y Literatura", "s": null, "sala": 5, "m": "Explorar y seleccionar diversidad de materiales informativos sobre temas de interés y, con la colaboración de la/del docente, tomar notas para registrar la información y comunicar lo aprendido.", "a": "Participación en prácticas específicas de escritura sobre un tema de estudio, en diversos ámbitos de conocimiento.", "i": ["Ensaya la producción de textos gráficos (dibujos, secuencias) para registrar la información relevada, a modo de “toma de notas”.", "Escribe textos breves (en pequeños grupos y a través del dictado a la/al docente), para comunicar lo aprendido en murales informativos, infografías, folletos, fichas.", "Produce textos escritos (en pequeños grupos y a través del dictado a la/al docente) para registrar datos relevantes obtenidos en las fuentes consultadas, a partir de la exposición de la/del docente o de la proyección de videos u otras fuentes."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Enunciación de la serie numérica oral hasta aproximadamente el 10, en situaciones cotidianas y juegos.", "i": ["Reconoce oralmente palabras que expresan números (palabras-números).", "Expresa oralmente números desde el 1 hasta aproximadamente el 10 siguiendo el orden convencional y sin saltearse ninguno."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Exploración de la representación simbólica (con cifras) de números desde el 1 y hasta aproximadamente el 10, en situaciones cotidianas y juegos.", "i": ["Diferencia números escritos y letras presentados en distintos soportes.", "Identifica y lee números escritos (código) hasta aproximadamente el 10, recurriendo al conteo oral sobre la banda numérica cuando sea necesario."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Cuantificación de colecciones de hasta aproximadamente 6 objetos, en situaciones cotidianas y juegos.", "i": ["Cuenta oralmente colecciones de hasta 6 objetos desplazables.", "Explica el procedimiento empleado para construir colecciones de hasta 6 objetos desplazables.", "Construye colecciones de aproximadamente 6 objetos desplazables, recurriendo a la correspondencia término a término y al conteo oral."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Comparación perceptiva de longitudes, en situaciones cotidianas y juegos.", "i": ["Determina visualmente longitudes —más largas, más cortas, iguales— en colecciones de objetos desplazables ubicadas de manera vertical u horizontal.", "Organiza de manera vertical u horizontal objetos desplazables al comparar longitudes (más largo, más corto, más alto, más bajo, iguales)."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Enunciación de la serie numérica oral hasta aproximadamente el 30, en situaciones cotidianas y juegos.", "i": ["Expresa oralmente los números desde el 1 y hasta aproximadamente el 30, siguiendo el orden convencional y sin saltearse ninguno.", "Expresa oralmente los números en forma descendente desde aproximadamente el 5.", "Expresa oralmente los números a partir de un número distinto de 1 y en forma ascendente hasta aproximadamente el 30."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Reconocimiento de la serie numérica escrita desde 1 hasta aproximadamente el 20, en situaciones cotidianas y juegos.", "i": ["Identifica y lee números escritos simbólicamente (con cifras) hasta aproximadamente el 20, recurriendo al conteo oral sobre la banda numérica, en caso de ser necesario.", "Utiliza números escritos simbólicamente (con cifras) en situaciones en las que se requiere identificar objetos y designar posiciones hasta aproximadamente el 3.", "Ordena los números escritos desde el 1 y hasta el 10, recurriendo al conteo oral sobre la banda numérica, en caso de ser necesario."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Cuantificación de colecciones de hasta aproximadamente 12 objetos desplazables, en situaciones cotidianas y juegos.", "i": ["Construye una colección de hasta 12 objetos desplazables, a partir de una cantidad expresada oralmente.", "Explica sus propios procedimientos y los de otras/os, empleados para determinar la cantidad de elementos de una colección, luego de reunir o agregar hasta 6 elementos.", "Explica sus propios procedimientos y los de otras/os, empleados para recordar cantidades de hasta aproximadamente 12 objetos desplazables o representados gráficamente.", "Utiliza dibujos y/o marcas para expresar cantidades de hasta aproximadamente 12 objetos."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Medición de longitudes y tiempo transcurrido con unidades de medidas no convencionales, en situaciones cotidianas y juegos.", "i": ["Reconoce la necesidad de usar una misma unidad de medida no convencional (mismo pie, misma soga, entre otras) para determinar longitudes.", "Expresa oralmente la cantidad de veces que la unidad de medida no convencional (contorno de un pie, tiras, sogas, entre otras) entra en la longitud medida.", "Determina longitudes mediante el uso de objetos desplazables (contorno de un pie, tiras, sogas, entre otros), solicitando la colaboración de sus pares y docentes, en caso de ser necesario.", "Identifica el comienzo y la terminación de dos acciones para comparar sus duraciones."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Enunciación de la serie numérica oral hasta aproximadamente el 50, en situaciones cotidianas y juegos.", "i": ["Expresa oralmente la serie numérica desde el 1 y hasta aproximadamente el 50.", "Expresa oralmente los números en forma descendente desde aproximadamente el 10.", "Expresa oralmente los números a partir de un número distinto de 1 y en forma ascendente hasta aproximadamente el 50.", "Identifica regularidades en la serie numérica oral (palabras-número) en situaciones de recitado, con pares y docentes."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Reconocimiento de la serie numérica escrita desde el 1 hasta aproximadamente el 30, en situaciones cotidianas y juegos.", "i": ["Identifica y lee números escritos simbólicamente (con cifras), recurriendo, en caso de ser necesario, al conteo oral sobre la serie numérica escrita hasta aproximadamente el 30.", "Ordena los números desde el 1 hasta el 30, recurriendo, en caso de ser necesario, al conteo oral sobre la serie numérica escrita, con la colaboración de compañeras/ os y docentes.", "Identifica números escritos simbólicamente (con cifras) hasta aproximadamente el 30 en portadores numéricos presentados en diferentes formatos (centímetro, calendario).", "Utiliza números escritos simbólicamente (con cifras) para codificar objetos y designar posiciones."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Cuantificación de colecciones que han sido transformadas por acciones, por ejemplo, reunir-unir, agregar, separar y quitar, en situaciones cotidianas y juegos.", "i": ["Construye una colección a partir de una cantidad expresada oralmente.", "Registra cantidades con cifras, recurriendo, en caso de ser necesario, al conteo sobre la banda numérica.", "Explica y compara sus propios procedimientos con los de otras/os (conteo y/o sobreconteo), para determinar una cantidad luego de reunir o agregar elementos a una colección.", "Considera los aportes de sus pares y docentes para la escritura simbólica de números que refieren a cantidades.", "Relaciona variedad de registros de cantidades (dibujos, marcas, cifras).", "Explica y compara sus propios procedimientos con los de otras/os (conteo y/o descuento) para determinar una cantidad, luego de separar y quitar uno, dos o tres elementos."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Usar la serie numérica oral hasta el 50 y escrita hasta el 30, en situaciones de cuantificación y medición de longitudes, capacidades y tiempo transcurrido.", "a": "Medición de longitudes, capacidades y tiempo transcurrido con unidades de medidas no convencionales, en situaciones cotidianas y juegos.", "i": ["Reconoce la necesidad de usar una misma unidad de medida no convencional (mismo vaso transparente, misma taza) para determinar capacidades.", "Usa la serie numérica oral para comparar la duración de dos acciones que pueden o no comenzar al mismo tiempo.", "Selecciona, junto a su pares, unidades de medida no convencionales (pasos, tiras de papel, soga —para las longitudes— y vasos, recipientes transparentes —para las capacidades— en función de la magnitud a medir.", "Representa con dibujos, marcas y cifras, la cantidad de veces que la unidad de medida no convencional consensuada entra en la longitud o capacidad del objeto que se mide.", "Emplea las unidades de medida no convencionales para determinar longitudes y capacidades, solicitando la colaboración de sus pares y docentes, en caso de ser necesario.", "Interpreta cantidades que corresponden a medidas de longitudes y capacidades presentadas en tablas y diagramas."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Comparación global de cantidades de hasta aproximadamente 6 objetos, en situaciones cotidianas y juegos.", "i": ["Agrupa hasta 6 objetos por un único criterio de clasificación.", "Expresa oralmente cuál de las colecciones tiene más, menos o igual cantidad de objetos, mediante la percepción global.", "Organiza de manera vertical u horizontal objetos agrupados por un único criterio de clasificación."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Identificación y comunicación de las opciones de respuesta más elegidas por el grupo a preguntas estadísticas sobre sí mismas/os.", "i": ["Selecciona una opción de respuesta, entre varias presentadas con dibujos, y la expresa oralmente.", "Anticipa, por percepción global, cuál de las opciones ha sido la más elegida.", "Agrupa, junto a sus pares, los dibujos con la misma opción de respuesta.", "Organiza de manera horizontal o vertical los dibujos seleccionados por cada integrante del grupo, para verificar la anticipación realizada sobre la opción más elegida."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Uso de la serie numérica oral para comparar colecciones de hasta aproximadamente 12 objetos, en situaciones cotidianas y juegos.", "i": ["Agrupa hasta 12 objetos desplazables a partir de dos criterios de clasificación.", "Explica los procedimientos que emplea (percepción global y/o conteo), para determinar cuántos objetos más tiene una colección comparada con otra.", "Organiza, de manera vertical u horizontal, objetos agrupados a partir de dos criterios de clasificación, recurriendo a la correspondencia término a término y/o al conteo, para determinar la colección que tiene más, menos o igual cantidad de objetos.", "Expresa con marcas cuántos elementos más tiene una colección comparada con otra."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Identificación y comunicación de las opciones de respuesta más elegidas por el grupo, a preguntas estadísticas sobre sí mismas/os y el entorno cotidiano.", "i": ["Distingue las diferentes opciones de respuesta presentadas con dibujos.", "Construye, con sus pares, pictogramas para comunicar todos los resultados obtenidos por el grupo clase.", "Selecciona una opción entre las disponibles y la dibuja en una hoja.", "Explica los procedimientos que emplea (correspondencia término a término y/o conteo), para determinar cuál de las opciones fue la más elegida por el grupo clase."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Uso de la serie numérica oral y escrita para comparar colecciones, en situaciones cotidianas y juegos.", "i": ["Identifica los criterios de clasificación a partir de los cuales se han agrupado las colecciones de objetos a comparar.", "Explica sus propios procedimientos y los de otras/os (conteo, sobreconteo y/o descuento) para determinar cuánto más o menos tiene una colección comparada con otra.", "Expresa oralmente, y a través de marcas o con cifras, la cantidad de objetos de las colecciones que compara.", "Interpreta diagramas que muestran las colecciones con pictografías y las cantidades con cifras.", "Construye diagramas y tablas, junto a sus pares y docentes para comunicar, con marcas o cifras, cantidades de dos o más colecciones que se comparan.", "Interpreta tablas que muestran las colecciones con pictografías y las cantidades con cifras."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Establecer relaciones de igualdad y desigualdad entre números, en situaciones de interpretación de datos y juegos.", "a": "Identificación de opciones en encuestas con pictografías y comunicación colectiva de las respuestas recolectadas a través de dibujos, marcas o cifras.", "i": ["Interpreta, en una encuesta, la variedad de opciones dibujadas en listas y tablas de doble entrada e indica su elección.", "Explica sus propios procedimientos y los de otras/os (conteo y/o sobreconteo), para determinar cuál de las opciones fue la más elegida por el grupo clase, considerando los diagramas y pictogramas construidos con sus pares.", "Indica, en un diagrama construido con sus pares, la opción de respuesta seleccionada por cada una/o y por el grupo clase."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Reconocimiento global de formas, de figuras y cuerpos geométricos, en situaciones de composición.", "i": ["Distingue formas respecto de figuras (círculos, triángulos, cuadrados, rectángulos) y cuerpos (esferas, cilindros y cubos) geométricos.", "Selecciona, junto a sus pares, las formas geométricas que permiten cubrir o rellenar cuadrados y rectángulos.", "Agrupa representaciones bi y tridimensionales (en cartulina u otros materiales) por su forma geométrica."]}, {"c": "Matemática", "s": null, "sala": 3, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Observación de series de formas de figuras y cuerpos geométricos sencillos, en situaciones de reproducción.", "i": ["Distingue las formas geométricas que se repiten, en series de hasta seis representaciones bi y tridimensionales (en cartulina u otros materiales).", "Copia series con patrones repetitivos de dos representaciones bi o tridimensionales (en cartulina u otros materiales).", "Ordena representaciones bi y tridimensionales (en cartulina u otros materiales), buscando el patrón que se repite."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Reconocimiento de características globales de formas, de figuras y cuerpos geométricos, en situaciones de composición y reproducción.", "i": ["Clasifica representaciones bi y tridimensionales (en cartulina u otros materiales) que son semejantes en su forma geométrica y diferentes en tamaños, colores y/o texturas.", "Reproduce configuraciones sencillas con representaciones tridimensionales (cubos, prismas, pirámides y cilindros).", "Selecciona las formas geométricas (triángulos, cuadrados, rectángulos, círculos, entre otras) que permiten completar y cubrir configuraciones planas sencillas."]}, {"c": "Matemática", "s": null, "sala": 4, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Reconocimiento del patrón que se repite en series con formas de figuras y cuerpos geométricos, en situaciones de reproducción.", "i": ["Identifica y expresa oralmente el patrón que se repite en una serie, conformado por tres o cuatro formas geométricas.", "Reproduce una serie con formas geométricas, repitiendo dos o tres veces el patrón."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Establecimiento de relaciones entre las formas de figuras y cuerpos geométricos, en situaciones composición, reproducción y comunicación.", "i": ["Describe características de formas geométricas bidimensionales, por ejemplo, presencia de bordes curvos o rectos, y, si son rectos, la cantidad de lados.", "Interpreta mensajes orales con características de formas geométricas bi y tridimensionales, en situaciones de construcción y copiado de configuraciones.", "Describe características de formas geométricas tridimensionales, por ejemplo, presencia de caras curvas o planas, y, si son planas, su forma y cantidad."]}, {"c": "Matemática", "s": null, "sala": 5, "m": "Reconocer globalmente la forma de figuras y cuerpos geométricos en situaciones de reproducción de series y composición de configuraciones geométricas sencillas.", "a": "Comparación de patrones que se repiten en series con formas de figuras y cuerpos geométricos, en situaciones de reproducción.", "i": ["Identifica y expresa, oralmente, semejanzas y diferencias entre patrones conformados por tres o cuatro formas geométricas, en dos series disti
